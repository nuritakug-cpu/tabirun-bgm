const frame=document.getElementById('quest54');
const boot=document.getElementById('boot');
const globalEscape=document.getElementById('globalEscape');
function escapeToQuest(){
  try{
    const w=frame.contentWindow;
    const d=frame.contentDocument;
    // まず追加オーバーレイを明示的に閉じる
    if(d){
      ['.r80GoalOverlay','.r76CertificateOverlay','.r76Overview','.r76MapOverlay'].forEach(sel=>d.querySelectorAll(sel).forEach(el=>el.remove()));
    }
    // QUESTのHOMEへ戻る既存処理を優先
    if(w && w.R80 && typeof w.R80.goHome==='function'){ w.R80.goHome(); return; }
    if(w && w.R76 && typeof w.R76.goHome==='function'){ w.R76.goHome(); return; }
    if(w && typeof w.render==='function'){
      try{
        if(typeof w.stage==='number') w.stage=0;
        if(typeof w.point==='number') w.point=0;
        if(typeof w.mode==='string') w.mode='home';
        w.render();
        return;
      }catch(_e){}
    }
  }catch(e){ console.warn('escape fallback',e); }
  // 子画面が固まっていても必ず抜ける最終手段
  frame.src='./chita_quest_release54.html?escape='+Date.now();
}
globalEscape.addEventListener('click',escapeToQuest,{passive:true});

    const doc=frame.contentDocument;
    if(!doc) throw new Error('release54 document unavailable');
    const bytes=Uint8Array.from(atob(PATCH_B64),c=>c.charCodeAt(0));
    const code=new TextDecoder().decode(bytes);
    const s=doc.createElement('script');
    s.textContent=code;
    (doc.body||doc.documentElement).appendChild(s);
    setTimeout(()=>boot.classList.add('hide'),260);
  }catch(err){
    console.error(err);
    boot.innerHTML='<div><b>release81 読み込みエラー</b><span>chita_quest_release54.html と同じ GitHub Pages フォルダで開いてください。</span></div>';
  }
});
