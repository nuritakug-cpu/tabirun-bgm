.arrival{padding:0;overflow:hidden;background:linear-gradient(180deg,#f9fcfd,#fff7e9)}.arriveTop{padding:21px 20px 4px}.place{font-size:31px;font-weight:950;margin-top:5px}.place.compactTitle{font-size:clamp(20px,6.15vw,27px);letter-spacing:-.055em;white-space:nowrap}.arriveText{margin-top:7px;font-size:12px;line-height:1.65;color:#728289}.gpsPanel{margin:17px 18px 0;padding:15px;border-radius:18px;border:1px solid #d6e5ea;background:linear-gradient(180deg,#f8fdff,#eef8fb);color:#12303c}.startCheck .gpsPanel{margin:20px 0 0}.gpsTop{display:flex;align-items:center;gap:10px}.gpsPulse{width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;background:#0a79ba;color:#fff;font-size:20px;box-shadow:0 0 0 0 rgba(10,121,186,.4);animation:gpsPulse 1.8s infinite}.gpsPulse.off{background:#85949a;animation:none}.gpsPulse.good{background:#18875f}@keyframes gpsPulse{0%{box-shadow:0 0 0 0 rgba(10,121,186,.35)}70%{box-shadow:0 0 0 12px rgba(10,121,186,0)}100%{box-shadow:0 0 0 0 rgba(10,121,186,0)}}.gpsTitle{font-size:13px;font-weight:950}.gpsStatus{margin-top:3px;font-size:10px;line-height:1.45;color:#728289}.gpsDistance{margin-top:12px;text-align:center;font-size:38px;line-height:1;font-weight:1000;color:#075d8c}.gpsDistance small{font-size:11px;letter-spacing:.04em;color:#73878f}.gpsDistanceNote{margin-top:8px;font-size:10px;line-height:1.55;font-weight:800;color:#a35b21;background:#fff3db;border:1px solid #f0d3a1;border-radius:10px;padding:7px 9px}.gpsMeta{margin-top:10px;padding-top:9px;border-top:1px solid #d8e7eb;font-size:9px;line-height:1.65;color:#819198;text-align:center}.gpsActions{display:flex;gap:8px;margin-top:11px}.gpsMini{flex:1;border:0;border-radius:12px;padding:10px 8px;background:#dceff7;color:#075879;font-size:10px;font-weight:950}.gpsExplain{margin:13px 18px 0;padding:13px 14px;border-radius:15px;background:#eef8fb;border:1px solid #d6e5ea;color:#36515c;font-size:11px;line-height:1.75}.startCheck .gpsExplain{margin:13px 0 0}.gpsExplai function todayJst(){
  if(/^\d{4}-\d{2}-\d{2}$/.test(DEMO_DATE))return DEMO_DATE;
  const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
  const get=t=>parts.find(p=>p.type===t)?.value||'';
  return`${get('year')}-${get('month')}-${get('day')}`;
}

  todayPaused:false,resumePhase:'',pausedAt:0
}}
function migrateState(x){
  if(!Array.isArray(x.stageClears)||x.stageClears.length!==3){
    const a=[false,false,false];
    const n=Math.max(0,Math.min(3,Number(x.stamps)||0));
    const st=Math.max(0,Math.min(2,Number(x.start)||0));
    for(let i=0;i<n&&st+i<3;i++)a[st+i]=true;
    x.stageClears=a;
  }
  if(!Array.isArray(x.stageClearDates)||x.stageClearDates.length!==3)x.stageClearDates=[null,null,null];
  if(!Array.isArray(x.done)||x.done.length!==3)x.done=stages.map(st=>st.points.map(()=>false));
  for(let i=0;i<3;i++){
    if(!Array.isArray(x.done[i])||x.done[i].length!==stages[i].points.length){
      const old=Array.isArray(x.done[i])?x.done[i]:[];
      x.done[i]=stages[i].points.map((_,j)=>!!old[j]);
    }
  }
  if(!x.history||typeof x.history!=='object')x.history={status:'none',index:0};
  if(!x.extraRoute||typeof x.extraRoute!=='object')x.extraRoute={status:'none',method:''};
  if(typeof x.extraCompleteDate==='undefined')x.extraCompleteDate=null;
  if(typeof x.masterDate==='undefined')x.masterDate=null;
  if(typeof x.conquestDate==='undefined')x.conquestDate=null;
  if(typeof x.pendingConquest!=='boolean')x.pendingConquest=false;
  if(typeof x.lastStampNew!=='boolean')x.lastStampNew=false;
  if(typeof x.conquestAfterGoal!=='boolean')x.conquestAfterGoal=false;
  if(typeof x.extraRewardShown!=='boolean')x.extraRewardShown=false;

  /* release7以前の「スタンプを押す」画面で止まった記録を救済。
     各STAGEの全CHECKPOINTが確認済みなら、スタンプは自動取得済みとする。 */
  let repaired=false;
  for(let i=0;i<3;i++){
    const allChecked=stages[i].points.every((_,j)=>!!x.done[i][j]);
    if(allChecked&&!x.stageClears[i]){
      x.stageClears[i]=true;
      x.stageClearDates[i]=x.stageClearDates[i]||todayJst();
      repaired=true;
    }
  }
  x.stamps=x.stageClears.filter(Boolean).length;
  if(x.stamps===3&&!x.conquestDate){
    x.conquestDate=todayJst();
    x.pendingConquest=true;
  }
  if(repaired&&['stampReady','stampShow'].includes(x.phase))x.phase='stageClear';
  return x;
}
function load(){try{const x=JSON.parse(localStorage.getItem(SAVE));if(x&&x.done)return migrateState(x)}catch(e){}return fresh()}

if(state.todayPaused&&state.phase==='todayComplete')state.phase='resumeChoice';
function allStagesCleared(){return Array.isArray(state.stageClears)&&state.stageClears.every(Boolean)}
function isExtraComplete(){return state.history?.status==='clear'&&state.extraRoute?.status==='clear'}
function isLimitedMedalEligible(){return allStagesCleared()&&state.conquestDate===EVENT_DATE}

function evaluateGpsPosition(pos){
  const now={
    lat:pos.coords.latitude,
    lng:pos.coords.longitude,
    accuracy:Number.isFinite(pos.coords.accuracy)?pos.coords.accuracy:999,
    time:pos.timestamp||Date.now()

  const stored=readSavedGps();
  const prev=gpsCurrent||gpsLast||stored;

  gpsLast=prev;
  gpsCurrent=now;
  persistGps(now);

  gpsLastSuccessAt=Date.now();
  gpsSoftErrorCount=0;
  gpsStarting=false;
  gpsPermissionDenied=false;
  gpsPermissionState='granted';
  gpsStatus='watching';
  gpsMessage=now.accuracy>220
    ?'GPS接続 OK｜精度が上がるのを待っています'
    :'GPS接続 OK｜自動通過判定中';

  const target=currentGpsTarget();

  if(target){
    gpsDistance=haversine(now,target);
  }

  updateGpsUi();

  if(!state.started||!target||!['startCheck','arrival','extraRoute'].includes(state.phase)){
    return;
  }

  const goodAccuracy=now.accuracy<=220;

  if(goodAccuracy&&gpsDistance<=target.radius){
    if(state.phase==='startCheck')completeStartCheck('GPS START CHECK');
    else if(state.phase==='extraRoute')completeExtraRoute('GPS EXTRA CHECK-IN');
    else autoArrive('GPS AUTO CHECK-IN');
    return;
  }

  if(!['arrival','extraRoute'].includes(state.phase)||!prev||!Number.isFinite(prev.lat)||!Number.isFinite(prev.lng)){
    return;
  }

  const dt=Math.abs(now.time-prev.time);
  const moved=haversine(prev,now);
  const prevAcc=Number.isFinite(prev.accuracy)?prev.accuracy:999;

  if(
    dt<=3*60*60*1000
    && moved<=20000
    && now.accuracy<=250
    && prevAcc<=250

    const segDist=pointToSegmentMeters(target,prev,now);

    if(segDist<=target.radius){
      if(state.phase==='extraRoute')completeExtraRoute('GPS EXTRA PASS-THROUGH');
      else autoArrive('GPS PASS-THROUGH CHECK');
    }
  }
}

function gpsError(err){
  gpsStarting=false;

    const hadGps=!!(gpsLastSuccessAt||gpsCurrent||readSavedGps());
    if(hadGps||gpsPermissionState==='granted'){
      gpsPermissionDenied=false;
      if(gpsPermissionState==='denied')gpsPermissionState='unknown';
      gpsStatus='error';

    }else{
      gpsPermissionDenied=true;
      gpsPermissionState='denied';
      gpsStatus='error';

    }

    gpsSoftErrorCount++;

  }

    gpsSoftErrorCount++;

function startGps(force=false,fromUser=false){

  }

  }

  }

    gpsStarting=false;
    gpsStatus='watching';

  }

  gpsStarting=true;
  gpsStatus='searching';
  gpsMessage='GPSを検索しています…';

      onPos,
      onErr,
      {
        enableHighAccuracy:false,
        timeout:60000,
        maximumAge:5000
      }

  }

    gpsWatchId=null;
  }

    navigator.geolocation.getCurrentPosition(
      onPos,
      err=>{
        if(err&&err.code===1){
          onErr(err);
          return;
        }

        try{
          navigator.geolocation.getCurrentPosition(
            onPos,
            onErr,
            {
              enableHighAccuracy:true,
              timeout:30000,
              maximumAge:0
            }
          );
        }
        catch(e){}
      },
      {
        enableHighAccuracy:false,
        timeout:12000,
        maximumAge:10000
      }
    );
  }
  catch(e){}

  setTimeout(()=>{
    if(!gpsUserStarted||gpsPermissionDenied)return;

    try{
      navigator.geolocation.getCurrentPosition(
        onPos,
        err=>{
          if(err&&err.code===1)onErr(err);
        },
        {
          enableHighAccuracy:true,
          timeout:30000,
          maximumAge:0
        }
      );
    }
    catch(e){}
  },1200);

  const run=()=>{const t=c.currentTime;impact(.9);noiseHit(.50,.20);tone(65,t,.38,'square',.48);tone(392,t+.13,.32,'triangle',.38);tone(523,t+.28,.38,'sine',.44);tone(659,t+.44,.42,'triangle',.48);tone(1047,t+.80,.72,'triangle',.55)};
  if(c.state==='running')run();else{try{const p=c.resume();if(p&&p.then)p.then(run).catch(()=>{});else run()}catch(e){}}
}
function stampFallback(){
  const c=audio();if(!c)return;
  const run=()=>{const t=c.currentTime;impact(1);noiseHit(.65,.20);tone(48,t,.40,'square',.58);tone(72,t+.02,.36,'sine',.48);tone(392,t+.19,.24,'triangle',.32);tone(587,t+.31,.30,'sine',.38);tone(880,t+.45,.48,'triangle',.48)};
  if(c.state==='running')run();else{try{const p=c.resume();if(p&&p.then)p.then(run).catch(()=>{});else run()}catch(e){}}
}

function primeFinishBgm(){
  if(!bgmOn)return;

  const a=document.getElementById('bgm');
  if(!a)return;

  bgmUnlocked=true;
  unlockSound();

  bgmKey='finish';
  a.pause();
  a.src=BGM.finish;
  a.loop=false;
  a.volume=0;

  try{a.load()}catch(e){}

  const p=a.play();

  if(p&&p.then){
    p.then(()=>{
      finishPrimed=true;
      removeResume();
      fadeBgm(BGM_VOL.finish,.01,40);
    }).catch(()=>{
      finishPrimed=false;
      showResume();
    });
  }
}

async function getMedalBlob(){

  if(medalBlob&&medalBlobKey===key)return medalBlob;
  const img=new Image();img.src=MEDAL_IMAGE;
  await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject});
  const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;
  const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);
  const px=c.width*.08,py=c.height*.835,pw=c.width*.84,ph=c.height*(isMasterMedalEligible()?.115:.09);
  x.save();x.fillStyle='rgba(3,25,39,.90)';x.strokeStyle='#e5bf55';x.lineWidth=Math.max(3,c.width*.004);x.beginPath();x.roundRect(px,py,pw,ph,c.width*.018);x.fill();x.stroke();x.textAlign='center';x.textBaseline='middle';x.fillStyle='#ffe48a';x.font=`700 ${Math.round(c.width*.028)}px sans-serif`;
  let yy=py+ph*.50;
  if(isMasterMedalEligible()){
    x.fillStyle='#fff0a8';x.font=`900 ${Math.round(c.width*.032)}px sans-serif`;x.fillText('CHITA TABIRUN MASTER',c.width/2,py+ph*.30);

  medalBlob=await new Promise(resolve=>c.toBlob(resolve,'image/png',1));medalBlobKey=key;return medalBlob;
}

function closeMedalImage(){document.getElementById('medalImageOverlay')?.remove()}
async function openMedalImage(){
  if(!isLimitedMedalEligible()){alert('2026年9月22日限定メダルです。');return}
  closeMedal();closeMedalImage();
  try{
    const blob=await getMedalBlob();if(medalObjectUrl)URL.revokeObjectURL(medalObjectUrl);medalObjectUrl=URL.createObjectURL(blob);
    const o=document.createElement('div');o.id='medalImageOverlay';o.className='medalImageOverlay';o.innerHTML=`<button class="medalBackBtn" onclick="closeMedalImage()">× QUESTに戻る</button><div class="medalImageInner"><img src="${medalObjectUrl}" alt="知多半島旅ラン限定メダル"><div class="medalImageNote">COMPLETE DATE ${medalDate()}<br>保存する場合は画像を長押しできます。</div></div>`;document.body.appendChild(o);
  }catch(e){alert('メダル画像を準備できませんでした。')}
}
async function showMedal(){
  if(!isLimitedMedalEligible()){alert('今回のゴールドメダルは2026年9月22日に全3STAGEを制覇した方限定です。');return}
  closeMedal();
  const o=document.createElement('div');o.id='medalSaveOverlay';o.className='medalSaveOverlay';o.innerHTML=`<div class="medalSaveInner"><div class="finalKick">${medalTitle()}</div><h2>${isMasterMedalEligible()?'👑 知多半島旅ランマスター':'9.22 LIMITED MEDAL'}</h2>${medalVisualHtml()}<div class="medalSaveHelp"><b>制覇日を刻印した9月22日限定メダルです。</b><br>COMPLETE DATE ${medalDate()}${isMasterMedalEligible()?'<br><br><b>全3STAGE＋両EXTRA完全攻略<br>称号「知多半島旅ランマスター」</b>':''}</div><button class="btn gold" style="margin-top:12px" onclick="shareMedal()">共有・保存</button><button class="btn primary" style="margin-top:9px" onclick="saveMedalFile()">画像をダウンロード</button><button class="btn primary" style="margin-top:9px" onclick="openMedalImage()">メダル画像を大きく表示</button><button class="btn secondary" onclick="closeMedal()">閉じる</button></div>`;document.body.appendChild(o);
}
function downloadMedal(){showMedal()}

function finalFX(full=true){if(finalPlayed)return;finalPlayed=true;setTimeout(()=>{sFinalFanfare();confetti(full?200:155);shake()},80);setTimeout(()=>{fire(18,19);fire(82,19)},520);setTimeout(()=>{fire(50,26);confetti(full?130:95)},1050);if(full)setTimeout(()=>{sMedalClink();shake()},1450);setTimeout(()=>{fire(18,43);fire(82,41)},1750)}
function conquestFX(){setTimeout(()=>{sFinalFanfare();confetti(220);shake();fire(18,18);fire(82,19)},80);setTimeout(()=>{fire(50,25);confetti(130)},850);if(isLimitedMedalEligible())setTimeout(()=>sMedalClink(),1350)}
function showConquest(){state.conquestAfterGoal=false;state.phase='conquest';state.pendingConquest=false;save();render();scrollTo(0,0)}
function goConquestAfterFinish(){state.conquestAfterGoal=false;state.phase='conquest';state.pendingConquest=false;finalPlayed=false;save();render();scrollTo(0,0)}
function continueAfterConquest(){
  if(state.conquestAfterGoal){
    state.conquestAfterGoal=false;
    primeFinishBgm();
    state.stage=3;
    state.point=0;
    state.phase='stage';
    state.arrivalMethod='';
    finalPlayed=false;
    save();render();scrollTo(0,0);return;
  }
  finishQuestEnding();
}
function finishQuestEnding(){
  state.phase='ending';
  save();
  stopBgm();
  render();
  scrollTo(0,0);
}
function renderEnding(){
  stopBgm();
  document.getElementById('app').innerHTML=`
  <section class="endingScreen">
    <div class="endingInner">
      <div class="eyebrow" style="color:#ffd879">CHITA TABIRUN QUEST COMPLETE</div>
      <img class="endingLogo" src="${LOGO}" alt="旅ランQUEST">
      <h1>完全制覇<br>おめでとう！</h1>
      <h2>🏆 3 STAMPS COMPLETE 🏆</h2>
      <div class="endingMessage">
        <strong>遊んでくれてありがとう！</strong><br><br>
        3つのSTAGEをすべて攻略しました。<br>
        走って、見て、知って、集めた旅ランQUEST。<br><br>
        <b>次の旅で、また会いましょう！</b>
      </div>
      <div class="endingDate">COMPLETE DATE ${dateLabel(state.conquestDate)}</div>
      ${isLimitedMedalEligible()?'<button class="btn gold" style="margin-top:18px" onclick="showMedal()">🏅 9.22限定メダルを見る</button>':''}
      ${isExtraComplete()?'<button class="btn primary" style="margin-top:9px" onclick="showCertificate()">🏆 完全攻略表彰状を見る</button>':''}
      <button class="btn secondary" style="margin-top:14px" onclick="reset()">🔄 最初から遊ぶ｜記録をリセット</button>
      <div class="endingResetNote">※リセットすると、獲得スタンプ・CHECKPOINT・制覇記録が最初からになります。</div>
    </div>
  </section>`;
  setTimeout(()=>{
    confetti(180);
    fire(20,20);
    fire(80,20);
    shake();
  },120);
}
function renderConquest(){
  stopBgm();updateMasterDate();save();
  const limited=isLimitedMedalEligible(),master=isMasterMedalEligible();
  document.getElementById('app').innerHTML=`<section class="conquestScreen"><div class="conquestInner"><div class="eyebrow" style="color:#ffd879">3 STAMPS COMPLETE</div><h1>🏆 知多半島旅ラン<br>QUEST 制覇！</h1><h2>全3STAGEを攻略しました</h2><div class="conquestStages">${[0,1,2].map(i=>`<div class="conquestStage"><b>✓</b>STAGE ${i+1}<br>${dateLabel(state.stageClearDates[i])}</div>`).join('')}</div><div class="conquestDate">COMPLETE DATE ${dateLabel(state.conquestDate)}</div>${limited?`${master?'<div class="masterBadge">👑 知多半島旅ランマスター</div>':''}${medalVisualHtml()}<div class="limitedBox"><strong>2026.9.22 LIMITED MEDAL 解放！</strong><br>今回のゴールドメダルは9月22日当日に全3STAGEを制覇した方限定です。<br>メダルには制覇日を刻印しています。</div><button class="btn gold" style="margin-top:14px" onclick="showMedal()">🏅 限定メダルを表示・保存</button>`:`<div class="limitedBox"><strong>全3STAGE制覇、おめでとうございます！</strong><br>制覇日は <b>${dateLabel(state.conquestDate)}</b> として記録しました。<br><br>今回のゴールドメダルは <b>2026.9.22 当日制覇限定</b> のため、この制覇では解放されません。</div>`}${isExtraComplete()?'<button class="btn primary" style="margin-top:10px" onclick="showCertificate()">🏆 完全攻略表彰状を表示</button>':''}<button class="btn secondary" onclick="continueAfterConquest()">${state.conquestAfterGoal?'㊗️ 内海 完走セレブレーションへ':'ENDINGへ →'}</button></div></section>`;
  conquestFX();
}
function renderFinish(){
  const conquered=allStagesCleared();
  const pending=conquered&&state.pendingConquest;
  const remain=remainingStageNames();
  document.getElementById('app').innerHTML=`<section class="partialFinal"><div class="partialFinalInner"><div class="partialKick">STAGE 3 / GOAL</div><div class="partialIcon">🏁</div><h1>㊗️ GOAL！</h1><h2>完走おめでとう！</h2><div class="partialRoute">${startName()}<span>→</span>内海・いち豆</div><div class="partialBadge">STAGE 3 COMPLETE</div><p>内海まで走り切りました。<br>今日はここまでのルートをしっかり完走です！</p><div class="finishStatus"><b>${state.stamps} / 3 STAMPS</b><br>${conquered?'全3STAGEのスタンプが揃いました。':`未攻略：${remain.join('・')}`}</div><div class="partialMusic">🎵 FINISH BGM<br>「遥かなる大地」</div>${pending?'<button class="btn gold" onclick="goConquestAfterFinish()">そして… 🏆 全3STAGE制覇へ →</button>':conquered?'<button class="btn gold" onclick="finishQuestEnding()">🎉 QUESTエンディングへ →</button><button class="btn secondary" onclick="showConquest()">🏆 制覇記録を見る</button>':'<button class="btn gold" onclick="goStageSelect()">未攻略STAGEへ挑戦 →</button>'}${isExtraComplete()?'<button class="btn primary" style="margin-top:9px" onclick="showCertificate()">🏆 完全攻略表彰状</button>':''}${!conquered?'<button class="btn secondary" onclick="askTodayStop()">🏁 今日はここまで</button>':''}</div></section>`;
  setTimeout(()=>finalFX(false),100);
}

/* render */
function render(){if(!state.started){renderStart();return}if(state.phase==='resumeChoice'){renderResumeChoice();return}if(state.phase==='todayComplete'){renderTodayComplete();return}if(state.phase==='stageSelect'){renderStageSelect();return}if(state.phase==='conquest'){renderConquest();return}if(state.phase==='ending'){renderEnding();return}if(state.phase==='startCheck'){renderStartCheck();return}if(state.phase==='startReady'){renderStartReady();return}if(state.stage>=stages.length){renderFinish();return}if(state.phase==='stageClear'){renderStageClear();return}if(state.phase==='extraRouteClear'){renderExtraRouteClear();return}if(state.phase==='extraComplete'){renderExtraComplete();return}syncBgm();if(state.phase==='reached'){renderReached();return}document.getElementById('app').innerHTML=header()+'<main id="main"></main>';if(state.phase==='stage')renderStage();else if(state.phase==='arrival')renderArrival();else if(state.phase==='quiz')renderQuiz();else if(state.phase==='secret')renderSecret();else if(state.phase==='history')renderHistory();else if(state.phase==='historyClear')renderHistoryClear();else if(state.phase==='routeBranch')renderRouteBranch();else if(state.phase==='extraRoute')renderExtraRoute();else if(state.phase==='stampReady'||state.phase==='stampShow'){state.phase='stageClear';save();render()}}

/* iPhone unlock / return */
document.addEventListener('pointerdown',()=>{unlockSound()},{capture:true,passive:true});
document.addEventListener('touchstart',()=>{unlockSound()},{capture:true,passive:true});
document.addEventListener('click',()=>{if(state.started&&!bgmUnlocked){bgmUnlocked=true;unlockSound();syncBgm(true)}},{capture:true});
document.addEventListener('visibilitychange',()=>{
  const a=document.getElementById('bgm');
  if(a){
    if(document.hidden){a.dataset.resume=!a.paused?'1':'0';a.pause()}
    else if(a.dataset.resume==='1'&&bgmOn){const p=a.play();if(p&&p.catch)p.catch(showResume)}
  }
  if(!document.hidden&&state.started&&gpsUserStarted){
    if('geolocation'in navigator)navigator.geolocation.getCurrentPosition(evaluateGpsPosition,gpsError,{enableHighAccuracy:true,timeout:20000,maximumAge:0});
    startGps(false,false);
  }
});
window.addEventListener('pageshow',()=>{
  if(state.started&&gpsUserStarted){
    setTimeout(()=>startGps(true,false),250);
  }
});

window.addEventListener('focus',()=>{
  if(state.started&&gpsUserStarted){
    setTimeout(()=>startGps(true,false),250);
  }
});

document.getElementById('bgm').addEventListener('error',showResume);
const savedGpsAtBoot=readSavedGps();if(savedGpsAtBoot)gpsLast=savedGpsAtBoot;
initSeAudio();
render();refreshGpsPermission();
</script>
</body>
</html>
