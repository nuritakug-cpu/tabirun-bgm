<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>旅ランQUEST ルートコンテンツエディタ v1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f3;color:#17313b;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
header{position:sticky;top:0;z-index:10;background:#07384d;color:#fff;padding:14px 16px;box-shadow:0 4px 16px #0002}header b{font-size:20px}header small{display:block;margin-top:4px;opacity:.8}
main{max-width:900px;margin:auto;padding:16px}.intro,.card{background:#fff;border:1px solid #dce4e7;border-radius:16px;padding:16px;margin-bottom:14px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}button,.fileLabel{border:0;border-radius:11px;padding:10px 13px;font-weight:900;cursor:pointer;background:#0b7890;color:#fff}button.secondary,.fileLabel.secondary{background:#e9eef0;color:#17313b}input[type=file]{display:none}
.stageTitle{margin:24px 0 10px;font-size:20px}.route{font-weight:950;font-size:17px}.key{font-size:10px;color:#7a8d94;margin-top:3px}textarea{width:100%;min-height:170px;margin-top:12px;border:1px solid #cfdcdf;border-radius:12px;padding:12px;font:600 14px/1.7 inherit;resize:vertical}
.status{position:sticky;bottom:10px;background:#17313b;color:#fff;padding:10px 13px;border-radius:12px;margin-top:14px;font-size:12px}.preview{white-space:pre-line;background:#f7fafb;padding:12px;border-radius:10px;margin-top:10px;line-height:1.75}
.badge{display:inline-block;background:#e8f6f8;color:#07667a;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:900;margin-left:7px}
</style></head><body>
<header><b>旅ランQUEST ルートコンテンツエディタ</b><small>概要文を編集 → JSONを書き出す → GitHub上の tabirun_route_content_v1.json を差し替える</small></header>
<main>
<div class="intro"><b>今後は本体HTMLを修正しません。</b><p>ルート概要はこのデータファイルを本体が読み込みます。将来の地図エディタも同じJSONにルート座標・注意点・トイレ・チェックポイントを保存できる構造にしてあります。</p><div class="actions"><button id="loadRemote">現在の公開JSONを読込</button><label class="fileLabel secondary">JSONを読み込む<input id="importFile" type="file" accept="application/json,.json"></label><button class="secondary" id="reset">初期内容へ戻す</button><button id="export">JSONを書き出す</button></div></div>
<div id="list"></div><div class="status" id="status">準備完了</div>
</main>
<script>
const DEFAULT={"schemaVersion":1,"contentVersion":"2026-09-11-01","updatedAt":"2026-09-11T14:00:00+09:00","description":"旅ランQUEST route/map content. overviews are live; stages is reserved for the unified map editor.","sections":{"handaBrick":{"stage":1,"from":"阿久比町役場","to":"半田赤レンガ建物","overview":"矢勝川までは、細い路地や住宅地の中を進みます。\n分岐もあるため、ルートマップを確認しながら進んでください。\n\n矢勝川から先は、歩道の幅が狭い区間があります。\n車両の通行に十分注意しながら進みましょう。\n\n⚠️ 半田赤れんが到着後はトイレ休憩を推奨。\nこの先しばらく、コンビニやトイレがない区間に入ります。補給や給水もここで確認しておきましょう。"},"handaCanal":{"stage":1,"from":"半田赤レンガ建物","to":"半田運河","overview":"市街地を抜けて半田運河へ向かいます。\n途中の横断歩道では、左右をよく確認して安全に横断してください。\n\n半田運河に入ると景色が開けます。\n歴史ある運河沿いの街並みと水辺の眺めを楽しみながら進みましょう。"},"taketoyoFamilymart":{"stage":1,"from":"半田運河","to":"武豊工業地帯","overview":"工業地帯を進む、ステージ1最長クラスの区間です。\n\nルート上には、横断歩道を渡らずそのまま進むと歩道がなくなる場所や、歩道が狭く危険な場所があります。\n⚠️ ルートマップに示した横断ポイントを必ず確認してください。\n\n途中にはアップダウンのある長い橋もあります。焦らずペースを保って進みましょう。\n\n到着後はファミリーマートで補給休憩。\n水分やエネルギーを補給して、後半に備えます。"},"mihamaFuttoSeven":{"stage":1,"from":"武豊工業地帯","to":"河和口海岸","overview":"火力発電所やヨットハーバーを抜け、少しずつ海の景色が広がってくる区間です。\n\n工業地帯から海沿いへと景色が変化していくのも、この区間の見どころです。\n\n⚠️ 途中には、そのまま直進できる橋がなく、いったん周り込んで進む場所があります。\nルートマップを確認し、無理に直進しないよう注意してください。"},"kowaguchi":{"stage":1,"from":"河和口海岸","to":"河和口駅","overview":"ここからはステージ1のご褒美区間！\n\n河和口まで、海を眺めながら気持ちのいい海岸線を進みます。\nここまで走ってきた疲れを忘れて、知多半島らしい海の景色を楽しみましょう。\n\nさあ、河和口まであと少し！"},"orangeLine":{"stage":2,"from":"河和口駅","to":"オレンジ広場","overview":"ここからは、緑の中を進むオレンジライン区間へ入ります。\n\n分岐では、オレンジラインの標識や案内看板をよく確認しながら進んでください。\n看板には「知多奥田方面」の案内があります。\n\n道に迷ったと感じたら、そのまま進まず一度立ち止まり、ルートマップを確認しましょう。\n\nこの区間は徐々に標高を上げていく登り区間です。\n無理にペースを上げず、自然の中の景色を楽しみながら進みます。"},"unoike":{"stage":2,"from":"オレンジ広場","to":"鵜の池","overview":"オレンジ広場を出発したら、ルートから少し離れますが、すぐ近くの鍋山へ立ち寄るのもおすすめです。\n\n少し足を延ばして高台からの景色を楽しんだら、再びルートへ戻って鵜の池を目指します。\n\nオレンジラインを進む途中には、公道へ出るポイントもあります。\n⚠️ 車両の通行に注意し、左右をよく確認してから進んでください。\n\n山あいの道を抜けながら、鵜の池へ向かいます。"},"beachlandConvenience":{"stage":2,"from":"鵜の池","to":"南知多ビーチランド入口","overview":"鵜の池をあとにして丘陵地を抜けると、景色は少しずつ住宅地へと変わっていきます。\n\n住宅地を抜けた先は奥田海岸へ。\nここからは伊勢湾の景色を楽しみながら、海沿いを南へ進みます。\n\n山の景色から海へと変わる、ステージ2後半の気持ちいい区間です。\n\n⚠️ ステージ3に入ると、ルート上にコンビニがありません。\n南知多ビーチランド周辺までに、水分や補給食など必要なものを準備しておきましょう。"},"chitaOkuda":{"stage":2,"from":"南知多ビーチランド入口","to":"知多奥田駅","overview":"南知多ビーチランド入口から知多奥田駅へ向かう、ステージ2最後の区間です。\n次のステージにはコンビニ休憩がないので、必要な補給をここまでに準備してください。\n駅への進入位置をルートマップで確認してゴールを目指します。"},"hozanji":{"stage":3,"from":"知多奥田駅","to":"法山寺","overview":"ここからいよいよステージ3へ。\n\n住宅地を抜けながら、まずは法山寺を目指します。\nステージ3はコンビニがない区間が続くため、スタート前に水分や補給食を確認しておきましょう。\n\nここから先は寺社や海岸、灯台など、南知多らしい景色が次々と現れます。\n後半に備えて、まだ無理にペースを上げず進みましょう。"},"nomaDaibo":{"stage":3,"from":"法山寺","to":"野間大坊","overview":"法山寺をあとにして、のどかな田園風景の中を野間大坊へ向かいます。\n\nこの周辺には、源義朝最期の地にまつわる史跡が点在しています。\n法山寺近くの湯殿跡をはじめ、義朝の知らせを聞いて駆けつけた家臣たちが戦ったと伝わる乱橋など、歴史を感じながら進める区間です。\n\n小さな橋や昔ながらの道を抜けながら、静かな野間の景色を楽しんで進みましょう。\n\nそして目的地は、源義朝ゆかりの地として知られる野間大坊。\nここには義朝の御廟があり、現在も木太刀が奉納されています。\n\n景色だけでなく、歴史もたどる旅ラン区間です。"},"fugusakiPark":{"stage":3,"from":"野間大坊","to":"冨具崎公園","overview":"ここからは、希望者だけが挑戦できるEXTRAルート。\n\n通常ルートから少し距離を追加して、冨具崎公園を目指します。\n\n海を望む景色を楽しめる寄り道ですが、その分だけ走行距離も増えます。\n残りの体力と相談しながら挑戦してください。\n\nまだいけるなら、もうひとつ先の景色へ！"},"nomaLighthouse":{"stage":3,"from":"野間大坊","to":"野間灯台","overview":"⚠️ この区間は、旅ランQUESTの中でも特に注意が必要な区間です。\n\n野間埼灯台へ向かう道路は交通量が多く、歩道や路肩が狭い場所があります。\n\n歩道がない、または歩道が途切れる場所では、周囲の交通状況を十分確認し、基本的には道路の右側を進むことをおすすめします。\n\n車両との距離を意識し、無理な追い越しや横断はしないようにしてください。\n\n海が見え始めると景色に目を奪われますが、⚠️ 風景に気を取られすぎず、まずは安全を最優先に。\n\n安全にこの区間を抜ければ、知多半島を代表する景色のひとつ、野間埼灯台が待っています。"},"nomaLighthouseExtra":{"stage":3,"from":"冨具崎公園","to":"野間灯台","overview":"冨具崎公園から分岐点へ戻り、本線へ復帰して野間埼灯台を目指します。\n\n⚠️ 本線復帰後は、旅ランQUESTの中でも特に注意が必要な区間です。\n交通量が多く、歩道や路肩が狭い場所があります。\n\n歩道がない、または歩道が途切れる場所では、周囲の交通状況を十分確認し、基本的には道路の右側を進むことをおすすめします。\n\n風景に気を取られすぎず、安全を最優先に野間埼灯台へ向かいましょう。"},"onoura":{"stage":3,"from":"野間灯台","to":"小野浦海岸","overview":"灯台をあとにすると、再び海を眺めながら進む区間です。\n\n小野浦海岸まで、伊勢湾を横に見ながら海沿いを進みます。\nここまで来ればゴールも少しずつ近づいてきます。\n\n潮風と海岸の景色を楽しみながら進みましょう。\n\nただし、海沿いでも車両の通行があります。\n景色を楽しむときは一度安全な場所で立ち止まり、走行中は周囲の確認を忘れないようにしてください。"},"utsumiPass":{"stage":3,"from":"小野浦海岸","to":"内海峠","overview":"海岸線から離れ、ここから再び内陸へ。\n\nゴール前に待っているのが内海峠です。\n\n海沿いを走ってきた脚には少し厳しい登りになりますが、ここが旅ランQUEST終盤の踏ん張りどころ。\n\nペースを落としても大丈夫。\n無理をせず、一歩ずつ峠を越えていきましょう。\n\nこの先はいよいよゴールへ。"},"goal":{"stage":3,"from":"内海峠","to":"GOAL｜内海・いち豆","overview":"内海峠を越えたら、いよいよラスト区間！\n\n長かった旅ランも残りわずかです。\n\nここまで走ってきた阿久比、半田、武豊、美浜、南知多の景色を思い出しながら、内海の町へ下っていきます。\n\n最後まで車両や交差点に注意して、安全にゴールを目指しましょう。\n\nさあ、旅ランQUESTのゴール「いち豆」へ！\nあと少し、最後まで楽しんでいこう！"}},"stages":{"1":{"route":null,"checkpoints":null,"warnings":null,"toilets":null},"2":{"route":null,"checkpoints":null,"warnings":null,"toilets":null},"3":{"route":null,"checkpoints":null,"warnings":null,"toilets":null}}};let cfg=structuredClone(DEFAULT);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function setStatus(t){document.getElementById('status').textContent=t}
function render(){const root=document.getElementById('list');root.innerHTML='';for(const stage of [1,2,3]){const h=document.createElement('h2');h.className='stageTitle';h.textContent='STAGE '+stage;root.appendChild(h);Object.entries(cfg.sections||{}).filter(([,v])=>Number(v.stage)===stage).forEach(([key,v])=>{const c=document.createElement('section');c.className='card';c.innerHTML=`<div class="route">${esc(v.from)} → ${esc(v.to)}<span class="badge">${esc(key)}</span></div><div class="key">このキーは本体との接続用なので変更しません</div><textarea></textarea><div class="preview"></div>`;const ta=c.querySelector('textarea'),pr=c.querySelector('.preview');ta.value=v.overview||'';pr.textContent=ta.value;ta.addEventListener('input',()=>{cfg.sections[key].overview=ta.value;cfg.updatedAt=new Date().toISOString();pr.textContent=ta.value;setStatus('編集中：'+v.from+' → '+v.to)});root.appendChild(c)})}}
async function remote(){try{const r=await fetch('./tabirun_route_content_v1.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const x=await r.json();if(x.schemaVersion!==1||!x.sections)throw 0;cfg=x;render();setStatus('公開JSONを読み込みました')}catch(e){setStatus('公開JSONを読み込めませんでした。初期内容を表示しています')}}
document.getElementById('loadRemote').onclick=remote;document.getElementById('reset').onclick=()=>{cfg=structuredClone(DEFAULT);render();setStatus('初期内容へ戻しました')};
document.getElementById('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const x=JSON.parse(await f.text());if(x.schemaVersion!==1||!x.sections)throw 0;cfg=x;render();setStatus('JSONを読み込みました')}catch(err){alert('対応するJSONではありません')}};
document.getElementById('export').onclick=()=>{cfg.updatedAt=new Date().toISOString();const blob=new Blob([JSON.stringify(cfg,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tabirun_route_content_v1.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);setStatus('JSONを書き出しました')};render();remote();
</script></body></html>
