function todayJst(){
if(/^\d{4}-\d{2}-\d{2}$/.test(DEMO_DATE))return DEMO_DATE;
const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
const get=t=>parts.find(p=>p.type===t)?.value||'';
return`${get('year')}-${get('month')}-${get('day')}`;
}
function dateLabel(v){if(!v)return'---';const[y,m,d]=v.split('-');return`${y}.${Number(m)}.${Number(d)}`}
function fresh(){return{
started:false,start:0,stage:0,point:0,phase:'stage',stamps:0,
stageClears:[false,false,false],stageClearDates:[null,null,null],conquestDate:null,pendingConquest:false,lastStampNew:false,conquestAfterGoal:false,
arrivalMethod:'',startMethod:'',done:stages.map(s=>s.points.map(()=>false)),
history:{status:'none',index:0},extraRoute:{status:'none',method:''},extraCompleteDate:null,masterDate:null,extraRewardShown:false,
mainMistakes:0,historyMistakes:0,perfectTracking:true,mainPerfectAwarded:false,ultimatePerfectAwarded:false,
todayPaused:false,resumePhase:'',pausedAt:0
}}
function migrateState(x){
if(!Array.isArray(x.stageClears)||x.stageClears.length!==3)x.stageClears=[false,false,false];
if(!Array.isArray(x.stageClearDates))x.stageClearDates=[null,null,null];
if(!Array.isArray(x.done)||x.done.length!==3)x.done=stages.map(s=>s.points.map(()=>false));
for(let i=0;i<3;i++){
if(!Array.isArray(x.done[i]))x.done[i]=stages[i].points.map(()=>false);
}
if(!x.history)x.history={status:'none',index:0};
if(!x.extraRoute)x.extraRoute={status:'none',method:''};
if(typeof x.mainMistakes!=='number')x.mainMistakes=0;
if(typeof x.historyMistakes!=='number')x.historyMistakes=0;
if(typeof x.perfectTracking!=='boolean')x.perfectTracking=true;
if(typeof x.mainPerfectAwarded!=='boolean')x.mainPerfectAwarded=false;
if(typeof x.ultimatePerfectAwarded!=='boolean')x.ultimatePerfectAwarded=false;
x.stamps=x.stageClears.filter(Boolean).length;
return x;
}
function load(){try{const x=JSON.parse(localStorage.getItem(SAVE));if(x)return migrateState(x)}catch(e){}return fresh()}
let state=load();

function allStagesCleared(){return state.stageClears.every(Boolean)}
function isExtraComplete(){return state.history.status==='clear'&&state.extraRoute.status==='clear'}
function isLimitedMedalEligible(){return allStagesCleared()&&state.conquestDate===EVENT_DATE}
function isMasterMedalEligible(){return isLimitedMedalEligible()&&isExtraComplete()&&state.masterDate===EVENT_DATE}
function updateMasterDate(){if(allStagesCleared()&&isExtraComplete()&&!state.masterDate)state.masterDate=todayJst()}
function updateExtraCompleteDate(){if(isExtraComplete()&&!state.extraCompleteDate)state.extraCompleteDate=todayJst();updateMasterDate()}
function refreshPerfectAwards(){
if(state.perfectTracking!==false&&allStagesCleared()&&state.mainMistakes===0)state.mainPerfectAwarded=true;
if(state.mainPerfectAwarded&&state.history.status==='clear'&&state.historyMistakes===0)state.ultimatePerfectAwarded=true;
}
function isMainPerfectAward(){refreshPerfectAwards();return state.mainPerfectAwarded}
function isUltimatePerfectAward(){refreshPerfectAwards();return state.ultimatePerfectAwarded}
function save(){localStorage.setItem(SAVE,JSON.stringify(state))}
function currentPoint(){return stages[state.stage]?.points?.[state.point]||null}
function markStageClear(index){
let freshStamp=false;
if(!state.stageClears[index]){
state.stageClears[index]=true;
state.stageClearDates[index]=todayJst();
freshStamp=true;
}
state.stamps=state.stageClears.filter(Boolean).length;
if(freshStamp)state.lastStampNew=true;
if(state.stamps===3&&!state.conquestDate){state.conquestDate=todayJst();state.pendingConquest=true}
refreshPerfectAwards();updateMasterDate();return freshStamp;
}
function stageCheckpointsConfirmed(index){return stages[index].points.every((_,i)=>!!state.done[index][i])}
function confirmTerminalCheckpoint(){
const p=currentPoint();if(!p||!p.terminal)return false;
state.done[state.stage][state.point]=true;
if(!stageCheckpointsConfirmed(state.stage))return false;
return markStageClear(state.stage);
}
function remainingStageNames(){return stages.map((_,i)=>state.stageClears[i]?null:`STAGE ${i+1}`).filter(Boolean)}
function reset(){if(!confirm('進行状況をリセットしますか？'))return;localStorage.removeItem(SAVE);localStorage.removeItem(LAST_GPS);state=fresh();stopBgm();render();scrollTo(0,0)}

function audio(){try{if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();return ctx}catch(e){return null}}
function runAudioEffect(fn){const c=audio();if(!c)return;const go=()=>{try{fn(c)}catch(e){}};if(c.state==='running')go();else{try{const p=c.resume();if(p&&p.then)p.then(go);else go()}catch(e){}}}
function unlockSound(){const c=audio();if(!c)return;if(c.state==='suspended'){try{c.resume()}catch(e){}}}
function tone(f,t,d,type='sine',v=.18){const c=audio();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.04)}
function impact(v=.28){runAudioEffect(c=>{const t=c.currentTime;const o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(115,t);o.frequency.exponentialRampToValueAtTime(48,t+.24);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.28);o.connect(g);g.connect(c.destination);o.start();o.stop(t+.3)})}

function confetti(n=80){const root=document.getElementById('fx'),colors=['#ff4b22','#0873bb','#f5ba32','#5ac87c','#6dd1ee','#fff'];for(let i=0;i<n;i++){const e=document.createElement('i');e.className='conf';e.style.left=Math.random()*100+'vw';e.style.background=colors[Math.floor(Math.random()*colors.length)];e.style.setProperty('--d',(1.8+Math.random()*1.8)+'s');e.style.setProperty('--x',(-100+Math.random()*200)+'px');root.appendChild(e);setTimeout(()=>e.remove(),4000)}}

function stopBgm(){const a=document.getElementById('bgm');if(a)a.pause()}
function desiredBgm(){if(state.phase==='goalCelebration')return'finish';if(state.stage<=1)return'bright';if(state.stage===2&&state.point<2)return'history';if(state.stage===2)return'sea';return null}
function syncBgm(){
if(!bgmOn||!bgmUnlocked)return;
const key=desiredBgm();if(!key)return;
const a=document.getElementById('bgm');
if(bgmKey!==key){bgmKey=key;a.pause();a.src=BGM[key];a.loop=key!=='finish';a.volume=BGM_VOL[key];try{a.load()}catch(e){}}
const p=a.play();if(p&&p.catch)p.catch(()=>{});
}
function primeFinishBgm(){bgmUnlocked=true;bgmKey='finish';const a=document.getElementById('bgm');a.pause();a.src=BGM.finish;a.loop=false;a.volume=BGM_VOL.finish;try{a.load()}catch(e){}const p=a.play();if(p&&p.catch)p.catch(()=>{})}
function toggleBgm(){bgmOn=!bgmOn;localStorage.setItem(BGM_SWITCH,bgmOn?'on':'off');if(bgmOn){bgmUnlocked=true;syncBgm()}else stopBgm();render()}

function currentGpsTarget(){if(state.phase==='startCheck')return START_GPS[state.start];if(state.phase==='extraRoute')return GPS_POINTS.fugusakiPark;const p=currentPoint();return p?.gps?GPS_POINTS[p.gps]:null}
function haversine(a,b){const R=6371000,r=x=>x*Math.PI/180,p1=r(a.lat),p2=r(b.lat),dp=r(b.lat-a.lat),dl=r(b.lng-a.lng),h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function gpsDistanceText(){if(gpsDistance==null)return'---';return gpsDistance<1000?Math.round(gpsDistance)+'m':(gpsDistance/1000).toFixed(2)+'km'}
function updateGpsUi(){const d=document.getElementById('gpsDistance');if(d)d.innerHTML=gpsDistanceText()+'<br><small>GPS判定ポイントまで（直線距離）</small><div class="gpsDistanceNote">※道路に沿った残り距離ではありません</div>'}
function evaluateGpsPosition(pos){
gpsCurrent={lat:pos.coords.latitude,lng:pos.coords.longitude,accuracy:pos.coords.accuracy,time:Date.now()};
localStorage.setItem(LAST_GPS,JSON.stringify(gpsCurrent));
const target=currentGpsTarget();if(target)gpsDistance=haversine(gpsCurrent,target);updateGpsUi();
if(target&&gpsDistance<=target.radius){
if(state.phase==='startCheck')completeStartCheck('GPS START CHECK');
else if(state.phase==='extraRoute')completeExtraRoute('GPS EXTRA CHECK-IN');
else if(state.phase==='arrival')autoArrive('GPS AUTO CHECK-IN');
}
}
function gpsError(){gpsStatus='error';gpsMessage='GPSを取得できません。手動確認も利用できます。';updateGpsUi()}
function startGps(){if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(evaluateGpsPosition,gpsError,{enableHighAccuracy:true,timeout:20000,maximumAge:0})}
function userStartGps(){gpsUserStarted=true;startGps()}
function retryGps(){startGps()}
function showGpsHelp(){alert('表示距離はGPS判定ポイントまでの直線距離です。GPSが反応しない場合は手動確認で進めます。')}
function showGpsTrouble(){alert('端末とブラウザの位置情報をONにしてください。')}
function gpsPanelHtml(){return`<div class="gpsPanel"><div class="gpsTop"><div class="gpsPulse">◎</div><div><div class="gpsTitle">GPS AUTO CHECK</div><div class="gpsStatus">${gpsMessage}</div></div></div><button class="gpsStartBtn" onclick="userStartGps()">📍 GPSを開始・再取得する</button><div id="gpsDistance" class="gpsDistance">${gpsDistanceText()}<br><small>GPS判定ポイントまで（直線距離）</small></div><div class="gpsActions"><button class="gpsMini" onclick="retryGps()">📡 GPS再取得</button><button class="gpsMini" onclick="showGpsHelp()">？ 判定方法</button></div></div>`}
function autoArrive(method){if(gpsAutoLock)return;gpsAutoLock=true;state.arrivalMethod=method;sArrival();confirmTerminalCheckpoint();state.phase='reached';save();render();scrollTo(0,0);setTimeout(()=>gpsAutoLock=false,500)}
function manualArrive(){state.arrivalMethod='MANUAL CHECK-IN';sArrival();confirmTerminalCheckpoint();state.phase='reached';save();render();scrollTo(0,0)}
function completeStartCheck(method){state.startMethod=method;state.phase='startReady';save();render();scrollTo(0,0)}
function manualStartCheck(){completeStartCheck('MANUAL START CHECK')}

function header(){
let slots='';
for(let i=0;i<3;i++)slots+=`<div class="slot ${state.stageClears[i]?'on':''}"><img src="${LOGO}"><small>${i+1}</small></div>`;
return`<header class="s${state.stage+1}"><div class="head"><div><div class="brand">CHITA TABIRUN QUEST</div><div class="title">旅ラン QUEST</div></div><div class="hr">${stages[state.stage]?.name||''}<br><button class="sound" onclick="toggleBgm()">${bgmOn?'🔊 BGM ON':'🔇 BGM OFF'}</button><button class="todayMini" onclick="askTodayStop()">🏁 今日はここまで</button></div></div><div class="stamps">${slots}<div class="count">${state.stamps} / 3 STAMPS</div></div></header>`;
}
function progress(){
const s=stages[state.stage];
return`<div class="progress">${s.points.map((p,i)=>`<div class="row"><span class="box ${state.done[state.stage][i]?'done':''}">${state.done[state.stage][i]?'✓':''}</span>${p.name}</div>`).join('')}</div>`;
}

function renderStart(){
document.getElementById('app').innerHTML=`<section class="cover"><img class="logo" src="${LOGO}"><div class="kick">CHITA TABIRUN 2026.9.22</div><h1>旅ラン<span>QUEST</span></h1><div class="coverCopy"><b>旅ランQUEST ご利用上の注意</b></div><div class="how">⚠️ スマートフォンの操作は安全な場所で立ち止まって行ってください。<br>📍 GPSが反応しない場合は手動確認で進めます。<br>🎵 BGMはON / OFFできます。</div><button class="soundCheckBtn" onclick="soundTest()">🔊 効果音テスト</button><div class="startTitle">START POINT</div>${starts.map(x=>`<button class="start" onclick="begin(${x[2]})"><b>${x[0]}からSTART</b><span>${x[1]}</span></button>`).join('')}</section>`;
}
function begin(n){unlockSound();state=fresh();state.started=true;state.start=n;state.stage=n;state.phase='startCheck';save();bgmUnlocked=true;render()}
function renderStartCheck(){document.getElementById('app').innerHTML=`<section class="startCheck"><div class="eyebrow">START POINT CHECK</div><h1>${START_GPS[state.start].name}</h1>${gpsPanelHtml()}<div class="manualWrap"><button class="manualBtn" onclick="manualStartCheck()">GPSが反応しない場合は手動でスタート地点確認</button></div></section>`}
function renderStartReady(){document.getElementById('app').innerHTML=`<section class="startReady"><div class="startReadyInner"><div class="startReadyIcon">📍</div><h1>スタート地点確認！</h1><div class="startReadyPlace">${START_GPS[state.start].name}</div><div class="startReadyBig">さあ、始まりだ！</div><button class="btn gold" onclick="startQuestAfterCheck()">旅ラン QUEST START →</button></div></section>`}
function startQuestAfterCheck(){sGood();state.phase='stage';save();render();syncBgm()}

function renderStage(){
const s=stages[state.stage],m=stageInfo[state.stage];
document.getElementById('main').innerHTML=`<div class="card stage s${state.stage+1}"><div class="stageNo">STAGE ${state.stage+1} / 3</div><div class="stageIcon">${m[0]}</div><h2>${m[1]}</h2><div class="stageSub">${m[2]}</div><div class="route">${s.route}</div><div class="mission">${m[3]}</div><button class="btn" onclick="stageStart()">STAGE ${state.stage+1} START →</button></div>`;
}
function stageStart(){state.lastStampNew=false;state.phase='arrival';save();render();syncBgm()}
function renderArrival(){
const p=currentPoint();
document.getElementById('main').innerHTML=`<div class="card arrival"><div class="arriveTop"><div class="eyebrow">NEXT POINT</div><div class="place">${p.name}</div></div>${gpsPanelHtml()}<div class="manualWrap"><button class="manualBtn" onclick="manualArrive()">GPSが反応しない場合は手動で到着</button></div></div>${progress()}`;
}
function renderReached(){
const p=currentPoint();
document.getElementById('app').innerHTML=`<section class="reached s${state.stage+1}"><div class="clearKicker">CHECKPOINT CLEAR</div><div class="clearBadge">✓</div><div class="congrats">🎉 おめでとう！</div><h2>${p.name}<br>到達！</h2><div class="power">${p.cheer}</div><div class="word"><div>${p.word}</div></div><button class="btn gold" onclick="reachedNext()">${p.goal?'㊗️ GOALセレブレーションへ →':p.terminal?'STAGE CLEARへ →':'この地点のQUESTへ →'}</button></section>`;
confetti(70);
}
function reachedNext(){
const p=currentPoint();
if(p.goal){finalPlayed=false;primeFinishBgm();state.phase='goalCelebration'}
else if(p.terminal){playStageClearNow();state.phase='stageClear'}
else state.phase='quiz';
save();render();
}
function goalToStageClear(){playStageClearNow();state.phase='stageClear';save();render()}

function renderQuiz(){
const p=currentPoint();
document.getElementById('main').innerHTML=`<div class="card"><div class="question">${p.q}</div>${p.a.map((x,i)=>`<button class="choice" onclick="answer(${i})"><span class="letter">${String.fromCharCode(65+i)}</span><span>${x}</span></button>`).join('')}</div>`;
}
function answer(i){
const p=currentPoint();
if(i!==p.c){
if(!state.stageClears[state.stage])state.mainMistakes++;
save();sBad();alert('MISS！ もう一度挑戦してください。');return;
}
sGood();state.done[state.stage][state.point]=true;
if(p.extra)state.phase='secret';else{state.point++;state.phase='arrival'}
save();render();
}

function renderSecret(){
document.getElementById('main').innerHTML=`<div class="card secret"><small>HISTORY EXTRA FOUND</small><h2>⚔ HISTORY EXTRA</h2><p>全6問の秘密ステージです。</p><button class="btn" onclick="historyStart()">EXTRA QUIZに挑戦</button><button class="btn secondary" onclick="historySkip()">今回はスキップ →</button></div>`;
}
function historyStart(){state.history={status:'play',index:0};state.phase='history';save();render()}
function historySkip(){state.history.status='skip';state.phase='routeBranch';save();render()}
function renderHistory(){
const i=state.history.index,q=historyQ[i];
document.getElementById('main').innerHTML=`<div class="card"><div class="question">${q[0]}</div>${q[1].map((x,n)=>`<button class="choice" onclick="historyAnswer(${n})"><span class="letter">${String.fromCharCode(65+n)}</span><span>${x}</span></button>`).join('')}</div>`;
}
function historyAnswer(n){
const q=historyQ[state.history.index];
if(n!==q[2]){state.historyMistakes++;save();sBad();alert('MISS！');return}
sGood();state.history.index++;
if(state.history.index>=historyQ.length){state.history.status='clear';refreshPerfectAwards();state.phase='historyClear'}
save();render();
}
function renderHistoryClear(){
document.getElementById('main').innerHTML=`<div class="card secret" style="text-align:center"><h2>HISTORY EXTRA<br>ALL 6 CLEAR！</h2><button class="btn" onclick="historyFinish()">ルート選択へ →</button></div>`;
}
function historyFinish(){state.phase='routeBranch';save();render()}
function renderRouteBranch(){
document.getElementById('main').innerHTML=`<div class="card branchCard"><div class="branchHero"><h2>この先、どうする？</h2></div><div class="branchChoice"><h3>▶ MAIN ROUTE</h3><button class="btn primary" onclick="chooseMainRoute()">野間灯台へ進む →</button></div><div class="branchChoice extra"><h3>🔥 冨具崎公園 EXTRA ROUTE</h3><div class="extraWarning">完全任意。トレーニング要素強めです。</div><button class="btn orange" onclick="chooseExtraRoute()">EXTRA ROUTEに挑戦 🔥</button></div></div>`;
}
function chooseMainRoute(){state.extraRoute.status='skip';continueToNomaLighthouse()}
function chooseExtraRoute(){state.extraRoute.status='play';state.phase='extraRoute';save();render()}
function renderExtraRoute(){
document.getElementById('main').innerHTML=`<div class="card extraRouteCard"><div class="extraRouteTop"><h2>🔥 冨具崎公園</h2></div>${gpsPanelHtml()}<div class="manualWrap"><button class="manualBtn" onclick="manualExtraRoute()">手動で冨具崎公園到着</button></div></div>`;
}
function completeExtraRoute(method){state.extraRoute.status='clear';state.extraRoute.method=method;updateExtraCompleteDate();state.phase='extraRouteClear';save();render();confetti(100)}
function manualExtraRoute(){completeExtraRoute('MANUAL EXTRA CHECK-IN')}
function renderExtraRouteClear(){document.getElementById('app').innerHTML=`<section class="extraClearScreen"><h1>EXTRA ROUTE CLEAR！</h1><h2>冨具崎公園 攻略！</h2><button class="btn gold" onclick="continueToNomaLighthouse()">本線へ復帰 →</button></section>`}
function continueToNomaLighthouse(){state.point=2;state.phase='arrival';save();render()}

function renderStageClear(){
const s=stages[state.stage];
document.getElementById('app').innerHTML=`<section class="stageClearScreen"><div class="stageClearTop">SPECIAL CLEAR CELEBRATION</div><div class="stageClearHuge">STAGE<br>CLEAR！<span>SECTION ${state.stage+1} COMPLETE</span></div><div class="stageClearIcon">🏁</div><div class="stageClearRoute"><b>${s.route}</b><br>このSTAGEを走破しました。</div><div class="stageClearCall">🎉 ここまで走ってきたことを、しっかり祝福！</div><button class="btn" onclick="goStampCelebration()">旅ランスタンプを受け取る →</button></section>`;
confetti(220);fire(18,20);fire(82,20);
}
function goStampCelebration(){playStampNow();state.phase='stampShow';save();render()}
function renderStampShow(){
const freshStamp=state.lastStampNew;
const cells=[0,1,2].map(i=>{
const on=state.stageClears[i],isNew=freshStamp&&i===state.stage;
return`<div class="stampCell ${on?'on':''} ${isNew?'new':''}"><img src="${LOGO}"><div class="stampStageLabel">STAGE ${i+1}</div><div class="stampStateLabel">${on?'✓ STAMP GET':'未取得'}</div></div>`;
}).join('');
const completeNow=state.pendingConquest&&allStagesCleared();
document.getElementById('app').innerHTML=`<section class="stampCeremony"><div class="stampCeremonyInner"><div class="stampCeremonyTop">TABIRUN STAMP CEREMONY</div><h1>STAMP GET！</h1><div class="stampDon">ドン！！</div><div class="stampBoard">${cells}</div><div class="stampCountBig">${state.stamps} / 3 STAMPS<small>ORDER FREE STAMP RALLY</small></div>${completeNow?'<button class="btn gold" onclick="continueAfterStageClear()">🏅 メダルセレブレーションへ →</button>':'<button class="btn gold" onclick="continueAfterStageClear()">次へ進む →</button>'}</div></section>`;
confetti(170);shake();
}
function continueAfterStageClear(){
if(state.pendingConquest&&allStagesCleared()){state.pendingConquest=false;state.phase='conquest';save();render();return}
if(state.stage===2){state.phase='stageSelect';save();render();return}
const next=state.stage+1;
if(next<3&&!state.stageClears[next]){state.stage=next;state.point=0;state.phase='stage';save();render();return}
state.phase='stageSelect';save();render();
}

function medalTitle(){return isMasterMedalEligible()?'CHITA TABIRUN MASTER':'2026.9.22 LIMITED FINISHER'}
function medalDate(){return dateLabel(state.conquestDate||EVENT_DATE)}
function medalVisualHtml(){return`<div class="medalVisual medalHeroVisual"><img src="${MEDAL_IMAGE}"><div class="medalOverlayPlate">${medalTitle()}<br>COMPLETE DATE ${medalDate()}</div></div>`}
function showMedal(){
if(!isLimitedMedalEligible()){alert('2026年9月22日限定メダルです。');return}
const o=document.createElement('div');o.className='medalSaveOverlay';o.id='medalSaveOverlay';
o.innerHTML=`<div class="medalSaveInner"><h2>9.22 LIMITED MEDAL</h2>${medalVisualHtml()}<div class="medalSaveHelp">画像を長押しして保存できます。</div><button class="btn secondary" onclick="document.getElementById('medalSaveOverlay').remove()">閉じる</button></div>`;
document.body.appendChild(o);
}
function perfectCertificateHtml(kind='main'){
const ultimate=kind==='ultimate';
return`<div class="perfectCertificate ${ultimate?'ultimate':''}"><div class="perfectMark">${ultimate?'👑':'🎓'}</div><div class="perfectTitle">${ultimate?'完全無欠攻略賞':'パーフェクト攻略賞'}</div><div class="perfectSub">${ultimate?'本編＋HISTORY EXTRA 全17問 ノーミス認定':'本編全11問 ノーミス認定'}</div><div class="perfectBody">${ultimate?'本編11問とHISTORY EXTRA 6問を、一度も間違えることなく全問正解しました。':'本編クイズ全11問を、一度も間違えることなく全問正解しました。'}<div class="perfectAward">${ultimate?'PERFECT MASTER':'PERFECT CLEAR'}</div>ここに特別達成を認定します。</div><div class="perfectDate">${dateLabel(state.conquestDate||todayJst())}　知多半島 旅ラン QUEST</div></div>`;
}
function showPerfectCertificate(kind='main'){
const o=document.createElement('div');o.className='certificateOverlay';o.id='perfectCertificateOverlay';
o.innerHTML=`<button class="certificateBack" onclick="document.getElementById('perfectCertificateOverlay').remove()">× QUESTに戻る</button><div class="certificateOverlayInner">${perfectCertificateHtml(kind)}</div>`;
document.body.appendChild(o);
}
function certificateHtml(){return`<div class="certificate"><div class="certificateTitle">表 彰 状</div><div class="certificateText">冨具崎公園 EXTRA ROUTEを走破し、HISTORY EXTRA 全6問を攻略しました。<div class="certificateAward">🏆 完 全 攻 略 🏆</div>ここに特別攻略達成を認定します。</div></div>`}
function showCertificate(){const o=document.createElement('div');o.className='certificateOverlay';o.id='certificateOverlay';o.innerHTML=`<button class="certificateBack" onclick="document.getElementById('certificateOverlay').remove()">× QUESTに戻る</button><div class="certificateOverlayInner">${certificateHtml()}</div>`;document.body.appendChild(o)}

function conquestFX(){setTimeout(()=>{sFinalFanfare();confetti(220);fire(18,18);fire(82,19)},80);setTimeout(()=>{fire(50,25);sMedalClink()},900)}
function renderConquest(){
refreshPerfectAwards();updateMasterDate();save();stopBgm();
const limited=isLimitedMedalEligible(),perfect=isMainPerfectAward(),ultimate=isUltimatePerfectAward();
document.getElementById('app').innerHTML=`<section class="conquestScreen"><div class="conquestInner"><div class="eyebrow" style="color:#ffd879">FINAL MEDAL CEREMONY</div><h1>🏆 完全制覇<br>おめでとう！</h1><h2>3 STAMPS COMPLETE</h2>${limited?medalVisualHtml():'<div class="limitedBox">全3STAGE制覇！<br>9.22限定メダルは当日制覇のみ解放されます。</div>'}${perfect?'<div class="perfectUnlock"><strong>🎓 PERFECT CLEAR！</strong><br>本編11問ノーミス！</div>':''}${ultimate?'<div class="perfectUnlock"><strong>👑 PERFECT MASTER！</strong><br>全17問ノーミス！</div>':''}<div class="endingThanks"><strong>遊んでくれてありがとう！</strong><br>次の旅で、また会いましょう！</div>${limited?'<button class="btn gold" onclick="showMedal()">🏅 メダルを表示・保存</button>':''}${perfect?'<button class="btn primary" onclick="showPerfectCertificate(\'main\')">🎓 パーフェクト攻略賞</button>':''}${ultimate?'<button class="btn gold" onclick="showPerfectCertificate(\'ultimate\')">👑 完全無欠攻略賞</button>':''}${isExtraComplete()?'<button class="btn primary" onclick="showCertificate()">🏆 EXTRA完全攻略表彰状</button>':''}<button class="btn secondary" onclick="goStageSelect()">🗺️ STAGE SELECT</button><button class="btn secondary" onclick="reset()">🔄 最初から遊ぶ｜記録をリセット</button></div></section>`;
conquestFX();
}
function renderFinish(){
syncBgm();
document.getElementById('app').innerHTML=`<section class="goalHero"><div class="goalHeroInner"><div class="partialKick">CHITA TABIRUN / FINAL GOAL</div><div class="goalHeroIcon">🏁</div><h1>㊗️ GOAL！</h1><h2>完走おめでとう！</h2><div class="goalHeroMsg">内海・いち豆まで到達！<br><br><b>ここまで走ってきた、その脚と気持ちに拍手！</b><br>街、運河、工業地帯、丘、歴史、灯台、海岸、峠。<br>今日の旅ランを最後までつなぎました。</div><div class="goalHeroMusic">🎵 FINISH BGM「遥かなる大地」</div><button class="btn gold" onclick="goalToStageClear()">STAGE 3 CLEARへ →</button></div></section>`;
confetti(160);fire(18,20);fire(82,20);
}

function goStageSelect(){state.phase='stageSelect';save();stopBgm();render()}
function renderStageSelect(){
document.getElementById('app').innerHTML=`<section class="stageSelectScreen"><div class="stageSelectInner"><h1>次のSTAGEを選ぶ</h1><div class="rallySummary"><b>${state.stamps} / 3 STAMPS</b><div class="rallyDots">${[0,1,2].map(i=>`<div class="rallyDot ${state.stageClears[i]?'done':''}">${state.stageClears[i]?'✓':'○'}<small>STAGE ${i+1}</small></div>`).join('')}</div></div><div class="stageGrid">${stages.map((s,i)=>`<button class="stagePick ${state.stageClears[i]?'done':''}" onclick="startStageFromSelect(${i})"><b>STAGE ${i+1}</b><br>${s.route}</button>`).join('')}</div>${allStagesCleared()?'<button class="btn gold" onclick="renderConquest()">🏆 制覇記録を見る</button>':''}</div></section>`;
}
function startStageFromSelect(n){state.stage=n;state.start=n;state.point=0;state.phase='startCheck';state.done[n]=stages[n].points.map(()=>false);state.lastStampNew=false;save();render()}
function askTodayStop(){if(confirm('今日はここまでにしますか？')){state.todayPaused=true;state.resumePhase=state.phase;state.phase='todayComplete';save();render()}}
function renderTodayComplete(){document.getElementById('app').innerHTML=`<section class="todayComplete"><h1>今日はここまで！</h1><p>進行状況は保存されています。</p><button class="btn gold" onclick="goStageSelect()">別のSTAGEを選ぶ</button></section>`}

function render(){
if(!state.started){renderStart();return}
if(state.phase==='todayComplete'){renderTodayComplete();return}
if(state.phase==='stageSelect'){renderStageSelect();return}
if(state.phase==='conquest'){renderConquest();return}
if(state.phase==='goalCelebration'){renderFinish();return}
if(state.phase==='startCheck'){renderStartCheck();return}
if(state.phase==='startReady'){renderStartReady();return}
if(state.phase==='stageClear'){renderStageClear();return}
if(state.phase==='stampShow'){renderStampShow();return}
if(state.phase==='extraRouteClear'){renderExtraRouteClear();return}
document.getElementById('app').innerHTML=header()+'<main id="main"></main>';
if(state.phase==='stage')renderStage();
else if(state.phase==='arrival')renderArrival();
else if(state.phase==='reached')renderReached();
else if(state.phase==='quiz')renderQuiz();
else if(state.phase==='secret')renderSecret();
else if(state.phase==='history')renderHistory();
else if(state.phase==='historyClear')renderHistoryClear();
else if(state.phase==='routeBranch')renderRouteBranch();
else if(state.phase==='extraRoute')renderExtraRoute();
}

document.addEventListener('pointerdown',unlockSound,{capture:true,passive:true});
document.addEventListener('touchstart',unlockSound,{capture:true,passive:true});
document.addEventListener('touchend',unlockSound,{capture:true,passive:true});
document.addEventListener('click',()=>{if(state.started&&!bgmUnlocked){bgmUnlocked=true;unlockSound();syncBgm()}},{capture:true});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state.started){unlockSound();if(gpsUserStarted)startGps();syncBgm()}});
window.addEventListener('pageshow',()=>{if(state.started){unlockSound();if(gpsUserStarted)startGps();syncBgm()}});
window.addEventListener('focus',()=>{if(state.started){unlockSound();if(gpsUserStarted)startGps();syncBgm()}});
render();
</script>
</body>
</html>
