<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>知多半島 旅ランQUEST release56</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071f2b}
#quest54{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
#boot{position:fixed;inset:0;z-index:999999;display:grid;place-items:center;background:#071f2b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;text-align:center;padding:24px}
#boot b{display:block;font-size:18px;margin-bottom:8px}
#boot span{font-size:12px;opacity:.78;line-height:1.7}
#boot.hide{display:none}
</style>
</head>
<body>
<div id="boot"><div><b>旅ランQUEST release56</b><span>SECTION 1の各区間ルートを準備しています…</span></div></div>
<iframe id="quest54" src="./chita_quest_release54.html" allow="geolocation; autoplay; fullscreen"></iframe>
<script>
const PATCH = String.raw`
(() => {
  const route = (from,to,origin,destination,intermediates,startText,goalText) => ({
    from,
    to,
    origin,
    destination,
    intermediates: intermediates || [],
    points:[
      {kind:'START',title:from,text:startText || 'この地点から次のチェックポイントへ向かいます。',position:origin},
      {kind:'GOAL',title:to,text:goalText || 'この区間の到着地点です。',position:destination}
    ]
  });

  ROUTE_GUIDES.handaBrick = route(
    '阿久比町役場','半田赤レンガ建物',
    {lat:34.9328950,lng:136.9152500},
    {lat:34.9016044,lng:136.9283617},
    [
      {lat:34.9132500,lng:136.9127778},
      {lat:34.9096944,lng:136.9136389}
    ],
    'SECTION 1スタート。阿久比町役場から半田赤レンガ建物へ向かいます。',
    '最初のチェックポイント、半田赤レンガ建物です。'
  );

  ROUTE_GUIDES.handaCanal = route(
    '半田赤レンガ建物','半田運河',
    {lat:34.9016044,lng:136.9283617},
    {lat:34.8919811,lng:136.9347103},
    [
      {lat:34.9011944,lng:136.9290556},
      {lat:34.9010833,lng:136.9312500},
      {lat:34.8990833,lng:136.9318333}
    ],
    '半田赤レンガ建物から半田運河へ向かいます。',
    '半田運河のチェックポイントです。'
  );

  ROUTE_GUIDES.taketoyoFamilymart = route(
    '半田運河','武豊工業地帯',
    {lat:34.8919811,lng:136.9347103},
    {lat:34.8449736,lng:136.9247824},
    [
      {lat:34.8783611,lng:136.9375000},
      {lat:34.8583056,lng:136.9248056},
      {lat:34.8583889,lng:136.9251389}
    ],
    '半田運河から武豊工業地帯の補給ポイントへ向かいます。',
    '武豊工業地帯のチェックポイントです。'
  );

  ROUTE_GUIDES.mihamaFuttoSeven = route(
    '武豊工業地帯','河和口海岸',
    {lat:34.8449736,lng:136.9247824},
    {lat:34.8038742,lng:136.9190097},
    [
      {lat:34.8348333,lng:136.9218611},
      {lat:34.8172222,lng:136.9214444},
      {lat:34.8058056,lng:136.9213611}
    ],
    '武豊工業地帯から河和口海岸へ向かいます。',
    '河和口海岸の補給ポイントです。'
  );

  ROUTE_GUIDES.kowaguchi = route(
    '河和口海岸','河和口駅',
    {lat:34.8038742,lng:136.9190097},
    {lat:34.7980550,lng:136.9189240},
    [
      {lat:34.7986389,lng:136.9189722}
    ],
    '河和口海岸からSECTION 1ゴールの河和口駅へ向かいます。',
    'SECTION 1の終点、河和口駅です。'
  );

  routeGuideMapsUrl = function(g){
    let u='https://www.google.com/maps/dir/?api=1&origin='
      +encodeURIComponent(g.origin.lat+','+g.origin.lng)
      +'&destination='+encodeURIComponent(g.destination.lat+','+g.destination.lng)
      +'&travelmode=walking';
    if(g.intermediates && g.intermediates.length){
      const wp=g.intermediates.map(p=>p.lat+','+p.lng).join('|');
      u+='&waypoints='+encodeURIComponent(wp);
    }
    return u;
  };

  initRouteGuideMap = async function(g){
    if(!document.getElementById('routeGuideMap') || routeGuideActiveKey==='') return;
    const mapDiv=document.getElementById('routeGuideMap');
    const fallback=document.getElementById('routeGuideMapFallback');
    if(fallback) fallback.classList.add('hidden');

    routeGuideMap=new google.maps.Map(mapDiv,{
      center:g.origin,
      zoom:15,
      mapTypeControl:false,
      streetViewControl:false,
      fullscreenControl:false,
      clickableIcons:false,
      gestureHandling:'greedy'
    });

    try{
      const lib=await google.maps.importLibrary('routes');
      const req={
        origin:g.origin,
        destination:g.destination,
        travelMode:'WALKING',
        polylineQuality:'HIGH_QUALITY',
        fields:['path','viewport','distanceMeters','warnings']
      };
      if(g.intermediates && g.intermediates.length){
        req.intermediates=g.intermediates.map(location=>({location,via:true}));
      }

      const result=await lib.Route.computeRoutes(req);
      const r=result.routes && result.routes[0];
      if(!r || !r.path || r.path.length<2) throw new Error('NO_ROUTE');

      const path=r.path.map(p=>({lat:p.lat,lng:p.lng}));
      const arrow={
        path:google.maps.SymbolPath.FORWARD_CLOSED_ARROW,
        scale:3.1,
        strokeColor:'#ffffff',
        strokeWeight:1.6,
        fillColor:'#ffffff',
        fillOpacity:1
      };

      routeGuidePolyline=new google.maps.Polyline({
        map:routeGuideMap,
        path,
        strokeColor:'#087990',
        strokeOpacity:.95,
        strokeWeight:7,
        icons:[{icon:arrow,offset:'0px',repeat:'75px'}]
      });

      const bounds=new google.maps.LatLngBounds();
      path.forEach(p=>bounds.extend(p));
      routeGuideMap.fitBounds(bounds,34);

      let offset=0;
      routeGuideArrowTimer=setInterval(()=>{
        if(!routeGuidePolyline) return;
        offset=(offset+1)%75;
        const icons=routeGuidePolyline.get('icons');
        icons[0].offset=offset+'px';
        routeGuidePolyline.set('icons',icons);
      },55);

      routeGuideMarkers=g.points.map((x,i)=>new google.maps.Marker({
        map:routeGuideMap,
        position:x.position,
        label:{text:String(i+1),color:'#fff',fontWeight:'900'},
        title:x.title
      }));

      const status=document.getElementById('routeGuideMapStatus');
      if(status){
        const km=r.distanceMeters?((r.distanceMeters/1000).toFixed(2)+'km'):'距離取得中';
        status.innerHTML='<strong>'+g.from+' → '+g.to+' '+km+'</strong>｜指定経由地を反映しています。';
      }
    }catch(err){
      console.error('release56 route error',err);
      const status=document.getElementById('routeGuideMapStatus');
      if(status) status.innerHTML='<strong>ルート計算エラー</strong>｜Routes APIとAPIキー設定を確認してください。';
      new google.maps.Marker({map:routeGuideMap,position:g.origin,label:'S',title:g.from});
      new google.maps.Marker({map:routeGuideMap,position:g.destination,label:'G',title:g.to});
      const bounds=new google.maps.LatLngBounds();
      bounds.extend(g.origin);
      bounds.extend(g.destination);
      routeGuideMap.fitBounds(bounds,50);
    }
  };

  try{
    if(typeof render==='function') render();
  }catch(e){
    console.warn('release56 rerender skipped',e);
  }

  console.log('release56 route patch loaded');
})();
`;

const frame=document.getElementById('quest54');
const boot=document.getElementById('boot');
frame.addEventListener('load',()=>{
  try{
    const doc=frame.contentDocument;
    const s=doc.createElement('script');
    s.textContent=PATCH;
    (doc.body||doc.documentElement).appendChild(s);
    setTimeout(()=>boot.classList.add('hide'),350);
  }catch(err){
    console.error(err);
    boot.innerHTML='<div><b>release56 読み込みエラー</b><span>GitHub Pages上で開いてください。release54とrelease56は同じフォルダに置きます。</span></div>';
  }
});
</script>
</body>
</html>
