name: TOP RUN Android Push Receiver Install

on:
  workflow_dispatch:
    inputs:
      install:
        description: 'Install the Android notification receiver on main'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: top-run-android-receiver-install
  cancel-in-progress: false

jobs:
  install:
    if: github.ref == 'refs/heads/main' && inputs.install == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Restore reviewed Android receiver and publish only that file
