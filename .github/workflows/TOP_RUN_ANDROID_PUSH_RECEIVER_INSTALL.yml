          if hashlib.sha256(script).hexdigest() != expected:
              raise SystemExit('Android push receiver source integrity check failed')
          if b"addEventListener('push'" not in script or b"notificationclick" not in script:
              raise SystemExit('Android notification receiver is incomplete')
          dest = pathlib.Path('top-run-push-sw.js')
          if dest.exists() and dest.read_bytes() != script:
              raise SystemExit('Another receiver file already exists. Refusing to overwrite it.')
          dest.write_bytes(script)
          print('Approved Android receiver created; existing files untouched.')
          PYCODE
          node --check top-run-push-sw.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- top-run-push-sw.js
          if git diff --cached --quiet; then
            echo 'Receiver is already in the repository. Nothing to change.'
          else
            git commit -m 'Add Android TOP RUN notification receiver'
            git push origin HEAD:main
          fi
