name: auto-rename-portal
on:
  push:
    paths:
      - 'TOPRUNPORTALv*.html'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: rename
        run: |
          f=$(ls TOPRUNPORTALv*.html 2>/dev/null | sort -V | tail -n 1)
          [ -n "$f" ] || exit 0
          git rm -q --cached TOPRUNPORTALv*.html
          mv -f "$f" TOP_RUN_PORTAL.html
          rm -f TOPRUNPORTALv*.html
          git add TOP_RUN_PORTAL.html
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git commit -m "PORTALを $f で更新"
          git push
      - name: request pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
