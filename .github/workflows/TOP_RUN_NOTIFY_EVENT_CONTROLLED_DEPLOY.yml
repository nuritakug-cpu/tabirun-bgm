name: TOP RUN Event Notification Deploy

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Deploy to Cloudflare (first run false)"
        type: boolean
        default: false
      enable_event:
        description: "Enable event notifications (first run false)"
        type: boolean
        default: false
      confirm_event:
        description: "Only when enabling, enter ENABLE_EVENT_PUSH"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: top-run-notify-manual
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed notification branch
        uses: actions/checkout@v4
        with:
          ref: top-run-notify-event-release-20261025

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify and restore Worker
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const dir = 'cloudflare/top-run-notify/';
          const html = fs.readFileSync(dir + 'WORKER_UPLOAD.html', 'utf8');
          const match = html.match(/<script id="tr-worker-source-base64" type="text\/plain">\s*([A-Za-z0-9+/=\s]+?)\s*<\/script>/);
          if (!match) throw Error('Worker payload missing');
          const buf = Buffer.from(match[1].replace(/\s/g, ''), 'base64');
          const sha = crypto.createHash('sha256').update(buf).digest('hex');
          if (sha !== 'e70dba5d25f3a553146d5e7997255badee7d8976efd0be7eb4ff4349b51cbc09') {
            throw Error('Worker SHA mismatch');
          }
          const cfg = JSON.parse(fs.readFileSync(dir + 'wrangler.jsonc', 'utf8'));
          if (
            cfg.name !== 'top-run-notify' ||
            cfg.main !== './worker.js' ||
            cfg.keep_vars !== true ||
            cfg.vars?.STAGE3_EVENT_ENABLED !== 'false' ||
            cfg.d1_databases?.length !== 1 ||
            cfg.d1_databases[0].binding !== 'DB' ||
            cfg.d1_databases[0].database_id !== '4c6b92f5-460e-4309-8fdf-539651d8b461'
          ) throw Error('Worker or D1 configuration mismatch');
          const source = buf.toString('utf8');
          for (const marker of [
            'stage2Declarative:true',
            'web_push:8030',
            '/api/stage3/event-notify'
          ]) {
            if (!source.includes(marker)) throw Error('Worker code missing ' + marker);
          }
          // Original Worker carrier remains byte-for-byte unchanged and SHA-checked.
          // Extend the EXISTING shared sendWebPush and existing export router only.
          // D1 owns per-subscription counters. No Firebase/UID/profile changes.
          const badgeHelpers = String.raw`
          let trBadgeSchemaReady=false;
          async function trBadgeSchema(db){
            if(trBadgeSchemaReady)return;
            await db.prepare('CREATE TABLE IF NOT EXISTS push_badge_states (id TEXT PRIMARY KEY, badge_count INTEGER NOT NULL DEFAULT 0, updated_at INTEGER NOT NULL)').run();
            trBadgeSchemaReady=true;
          }
          async function trBadgeNext(sub,env){
            if(!env.DB)return 1;
            await trBadgeSchema(env.DB);
            const id=await hashId(sub.endpoint);
            const row=await env.DB.prepare('INSERT INTO push_badge_states(id,badge_count,updated_at) VALUES (?1,1,?2) ON CONFLICT(id) DO UPDATE SET badge_count=MIN(99,push_badge_states.badge_count+1),updated_at=excluded.updated_at RETURNING badge_count')
              .bind(id,Date.now()).first();
            if(!Number.isSafeInteger(row?.badge_count)||row.badge_count<1||row.badge_count>99)throw Error('Badge counter acknowledgement invalid');
            return row.badge_count;
          }
          function trBadgeSame(a,b){
            return a?.endpoint===b?.endpoint&&a?.keys?.p256dh===b?.keys?.p256dh&&a?.keys?.auth===b?.keys?.auth;
          }
          async function trBadgeClear(request,env){
            const headers=cors(request);
            if(request.method==='OPTIONS')return new Response(null,{status:request.headers.get('Origin')===ALLOWED_ORIGIN?204:403,headers});
            if(request.method!=='POST')return json({ok:false},405,headers);
            if(request.headers.get('Origin')!==ALLOWED_ORIGIN)return json({ok:false},403,headers);
            if(!env.DB)return json({ok:false},503,headers);
            try{
              const sub=subscriptionFrom(await parseJson(request));
              const id=await hashId(sub.endpoint);
              // The endpoint by itself does not authorize a reset. Both existing Push
              // subscription keys must match a server-registered endpoint, byte-for-byte.
              // This operation does not expose or modify another user's Firebase identity.
              let valid=false;
              const legacy=await env.DB.prepare('SELECT raw FROM subs WHERE id=?1').bind(id).first();
              if(legacy?.raw)valid=trBadgeSame(subscriptionFrom(JSON.parse(legacy.raw)),sub);
              if(!valid){
                await stage3EnsureDb(env.DB);
                const formal=await env.DB.prepare('SELECT raw FROM stage3_devices WHERE id=?1').bind(id).first();
                if(formal?.raw)valid=trBadgeSame(subscriptionFrom(JSON.parse(formal.raw)),sub);
              }
              if(!valid)return json({ok:false},404,headers);
              await trBadgeSchema(env.DB);
              await env.DB.prepare('UPDATE push_badge_states SET badge_count=0,updated_at=?2 WHERE id=?1').bind(id,Date.now()).run();
              return json({ok:true,cleared:true},200,headers);
            }catch{return json({ok:false},400,headers);}
          }
          async function trBadgeClearAuthenticated(request,env){
            const headers=cors(request);
            if(request.method==='OPTIONS')return new Response(null,{status:request.headers.get('Origin')===ALLOWED_ORIGIN?204:403,headers});
            if(request.method!=='POST')return json({ok:false},405,headers);
            if(request.headers.get('Origin')!==ALLOWED_ORIGIN)return json({ok:false},403,headers);
            if(!env.DB)return json({ok:false},503,headers);
            let auth,data;
            try{
              auth=await stage3VerifyToken(request);
              data=await parseJson(request);
              if(!auth?.uid||typeof data?.profileId!=='string'||
                 !/^[-A-Za-z0-9_]{8,160}$/.test(data.profileId))throw Error('Identity mismatch');
              // A signed Firebase UID plus a pre-existing D1 enrollment for that
              // exact UID/profileId is sufficient for clearing a badge count.
              // No extra Firebase RTDB reads on every app visibility event.
            }catch{return json({ok:false,error:'Not authorized'},403,headers);}
            try{
              await stage3EnsureDb(env.DB);
              await trBadgeSchema(env.DB);
              // Reset the same verified person's registered devices. For a shared
              // unread state, opening any of this person's devices resets the
              // sender-side counter. No other UID or profile can be targeted.
              const result=await env.DB.prepare('UPDATE push_badge_states SET badge_count=0,updated_at=?3 WHERE id IN (SELECT id FROM stage3_devices WHERE uid=?1 AND profile_id=?2)')
                .bind(auth.uid,data.profileId,Date.now()).run();
              const changed=Number(result?.meta?.changes||0);
              if(!Number.isInteger(changed)||changed<0)throw Error('Invalid database acknowledgement');
              if(changed===0)return json({ok:false,registeredDevices:0},404,headers);
              return json({ok:true,cleared:true,registeredDevices:changed},200,headers);
            }catch{return json({ok:false,error:'Badge reset unavailable'},503,headers);}
          }
          async function trBadgeSyncAuthenticated(request,env){
            const headers=cors(request);
            if(request.method==='OPTIONS')return new Response(null,{status:request.headers.get('Origin')===ALLOWED_ORIGIN?204:403,headers});
            if(request.method!=='POST')return json({ok:false},405,headers);
            if(request.headers.get('Origin')!==ALLOWED_ORIGIN)return json({ok:false},403,headers);
            if(!env.DB)return json({ok:false},503,headers);
            let auth,data;
            try{
              auth=await stage3VerifyToken(request);
              data=await parseJson(request);
              if(!auth?.uid||typeof data?.profileId!=='string'||
                 !/^[-A-Za-z0-9_]{8,160}$/.test(data.profileId)||
                 !Number.isSafeInteger(data.count)||data.count<0||data.count>99)
                throw Error('Bad badge sync input');
            }catch{return json({ok:false,error:'Not authorized'},403,headers);}
            try{
              await stage3EnsureDb(env.DB);
              await trBadgeSchema(env.DB);
              const row=await env.DB.prepare('SELECT COUNT(*) AS n FROM stage3_devices WHERE uid=?1 AND profile_id=?2')
                .bind(auth.uid,data.profileId).first();
              const n=Number(row?.n||0);
              if(!Number.isSafeInteger(n)||n<1)return json({ok:false,error:'No registered device'},404,headers);
              // Only existing devices owned by this signed UID/profileId.
              // No Firebase writes, no notification content and no independent auth.
              const ts=Date.now();
              await env.DB.prepare('INSERT OR IGNORE INTO push_badge_states(id,badge_count,updated_at) SELECT id,0,?3 FROM stage3_devices WHERE uid=?1 AND profile_id=?2')
                .bind(auth.uid,data.profileId,ts).run();
              await env.DB.prepare('UPDATE push_badge_states SET badge_count=?3,updated_at=?4 WHERE id IN (SELECT id FROM stage3_devices WHERE uid=?1 AND profile_id=?2)')
                .bind(auth.uid,data.profileId,data.count,ts).run();
              return json({ok:true,count:data.count,registeredDevices:n},200,headers);
            }catch{return json({ok:false,error:'Badge sync unavailable'},503,headers);}
          }
          `;
          const sendStart = 'async function sendWebPush(subscription,env,fetcher=fetch,payload=stage2Payload()){\n  let prepared;';
          if(source.split(sendStart).length!==2)throw Error('Shared sendWebPush anchor mismatch. Stop deploy.');
          const sendWithBadge = sendStart + '\n  let trBadge=1;\n  try{trBadge=await trBadgeNext(subscription,env);}catch(_){/* Delivery remains available if count storage fails. */}';
          const serializeBefore = 'data:JSON.stringify(payload),options:';
          const serializeAfter = 'data:JSON.stringify({...payload,badge:trBadge,app_badge:trBadge,notification:{...payload.notification,app_badge:trBadge}}),options:';
          if(source.split(serializeBefore).length!==2)throw Error('Unique Push serialization anchor missing. Stop deploy.');
          const entryBefore = "    if(path!=='/api/stage3/event-notify')return baseWorker.fetch(request,env,ctx);";
          const entryAfter = "    if(path==='/api/stage2/badge-clear')return trBadgeClear(request,env);\n" +
            "    if(path==='/api/stage3/badge-clear')return trBadgeClearAuthenticated(request,env);\n" +
            "    if(path==='/api/stage3/badge-sync')return trBadgeSyncAuthenticated(request,env);\n" + entryBefore;
          if(source.split(entryBefore).length!==2)throw Error('Export router anchor mismatch. Stop deploy.');
          let patched=source.replace(sendStart,sendWithBadge)
            .replace(serializeBefore,serializeAfter)
            .replace(entryBefore,entryAfter);
          const insertBefore = 'async function sendWebPush(subscription,env,fetcher=fetch,payload=stage2Payload())';
          if(patched.split(insertBefore).length!==2)throw Error('Counter helper anchor missing. Stop deploy.');
          patched=patched.replace(insertBefore,badgeHelpers+'\n'+insertBefore);
          // Verify this change can be mechanically undone to precisely the signed parent.
          let restored=patched.replace(badgeHelpers+'\n','').replace(sendWithBadge,sendStart)
            .replace(serializeAfter,serializeBefore).replace(entryAfter,entryBefore);
          if(restored!==source)throw Error('Non-badge Worker code modified. Stop deploy.');
          for(const marker of ['trBadgeNext(subscription,env)','/api/stage3/badge-clear',
            'trBadgeClearAuthenticated(request,env)','trBadgeSyncAuthenticated(request,env)',
            '/api/stage3/badge-sync','/api/stage2/badge-clear',
            'app_badge:trBadge','ON CONFLICT(id) DO UPDATE SET badge_count']){
            if(!patched.includes(marker))throw Error('Expected badge integration missing: '+marker);
          }
          // Room-only extension. Existing signed Worker / CHAT / NOTICE / Badge helpers remain untouched.
          const roomHelpers = String.raw`
          async function stage3NotifyRoom(data,env,person,auth,c){
            const match=typeof data?.id==='string'&&data.id.length<=130
              ? /^(r[A-Za-z0-9_]{6,60})\/(m[A-Za-z0-9_]+)$/.exec(data.id) : null;
            if(!match)return json({ok:false,error:'Invalid room notification id'},400,c);
            const roomId=match[1],msgId=match[2],now=Date.now();
            let msg,meta,members;
            try{
              [msg,meta,members]=await Promise.all([
                stage3Read('portalCommon/topRun/roomMessages/'+roomId+'/'+msgId,auth.token),
                stage3Read('portalCommon/topRun/roomMeta/'+roomId,auth.token),
                stage3Read('portalCommon/topRun/roomMembers/'+roomId,auth.token)
              ]);
            }catch{
              return json({ok:false,error:'Room canonical read denied or unavailable'},403,c);
            }
            const stamp=Number(msg?.ts);
            if(!msg||msg.senderUid!==auth.uid||auth.uid!==person.uid||
               !Number.isFinite(stamp)||stamp>now+30000||now-stamp>10*60*1000||
               typeof msg.name!=='string'||!msg.name.trim()||
               typeof msg.text!=='string'||!msg.text.trim()||
               typeof meta?.name!=='string'||!meta.name.trim()||
               !members||typeof members!=='object'||Array.isArray(members)||
               members[auth.uid]?.status!=='joined'){
              return json({ok:false,error:'Room message, sender or membership invalid'},403,c);
            }
            const memberUids=Object.entries(members)
              .filter(([uid,item])=>uid!==auth.uid&&/^[-A-Za-z0-9_]{1,128}$/.test(uid)&&item?.status==='joined')
              .map(([uid])=>uid);
            if(memberUids.length>80)return json({ok:false,error:'Room audience exceeds safe limit'},503,c);
            const recipients=new Set(memberUids);
            let devices=[];
            try{
              await stage3EnsureDb(env.DB);
              if(memberUids.length){
                const placeholders=memberUids.map(()=>'?').join(',');
                const sql='SELECT id,uid,raw FROM stage3_devices WHERE uid IN ('+placeholders+
                  ') AND chat_enabled=1 AND updated_at>? ORDER BY updated_at DESC LIMIT 81';
                const rows=await env.DB.prepare(sql).bind(...memberUids,now-180*86400000).all();
                if(!Array.isArray(rows?.results)||rows.results.length>80)
                  return json({ok:false,error:'Room device audience unavailable or too large'},503,c);
                devices=rows.results.filter(x=>x&&recipients.has(x.uid));
              }
              await env.DB.prepare('CREATE TABLE IF NOT EXISTS stage3_sent_events (id TEXT PRIMARY KEY, sent_at INTEGER NOT NULL)').run();
              const eventKey='room:'+roomId+'/'+msgId;
              const mark=await env.DB.prepare('INSERT OR IGNORE INTO stage3_sent_events(id,sent_at) VALUES (?1,?2)')
                .bind(eventKey,now).run();
              if((mark?.meta?.changes??0)===0)return json({ok:true,alreadyProcessed:true},200,c);
              const payload={web_push:8030,notification:{
                title:meta.name.trim().slice(0,120),lang:'ja',dir:'auto',
                body:msg.name.trim().slice(0,80)+'：'+Array.from(msg.text).slice(0,40).join(''),
                navigate:PORTAL_URL,tag:'top-run-room-'+roomId+'-'+msgId,silent:false
              }};
              let accepted=0,invalid=0,failed=0;
              for(let i=0;i<devices.length;i+=8){
                await Promise.all(devices.slice(i,i+8).map(async row=>{
                  if(!recipients.has(row.uid)||row.uid===auth.uid)return;
                  try{
                    const sub=subscriptionFrom(JSON.parse(row.raw));
                    const result=await sendWebPush(sub,env,fetch,payload);
                    if(result.status===201||result.status===202)accepted++;
                    else if(result.status===404||result.status===410){
                      invalid++;
                      await env.DB.prepare('DELETE FROM stage3_devices WHERE id=?1').bind(row.id).run();
                    }else failed++;
                  }catch{failed++;}
                }));
              }
              if(accepted===0&&devices.length>0){
                await env.DB.prepare('DELETE FROM stage3_sent_events WHERE id=?1').bind(eventKey).run();
              }
              return json({
                ok:accepted>0||devices.length===0,acceptedByPushService:accepted,
                attemptedDevices:devices.length,staleRemoved:invalid,failedDevices:failed,
                deliveredToDevice:'unverified'
              },accepted>0||devices.length===0?200:502,c);
            }catch{
              return json({ok:false,error:'Room delivery service unavailable'},503,c);
            }
          }
          `;
          const roomAnchor = 'async function stage3Notify(request,env,person,auth,c){';
          const roomRouteBefore = "  const id=data?.id;\n  if(!['chat','notice'].includes(kind)";
          const roomRouteAfter = "  const id=data?.id;\n  if(kind==='room')return stage3NotifyRoom(data,env,person,auth,c);\n  if(!['chat','notice'].includes(kind)";
          if(patched.split(roomAnchor).length!==2||patched.split(roomRouteBefore).length!==2)
            throw Error('Room patch anchor mismatch. Stop deploy.');
          const beforeRoom=patched;
          patched=patched.replace(roomAnchor,roomHelpers+'\n'+roomAnchor).replace(roomRouteBefore,roomRouteAfter);
          if(patched.replace(roomHelpers+'\n','').replace(roomRouteAfter,roomRouteBefore)!==beforeRoom)
            throw Error('Unexpected non-room Worker change. Stop deploy.');
          for(const marker of ['stage3NotifyRoom(data,env,person,auth,c)',
            'roomMembers/'+"'",'stage3_sent_events','chat_enabled=1','ROOM_NOTIFY_20261030']){
            if(marker==='ROOM_NOTIFY_20261030')continue;
            if(!patched.includes(marker))throw Error('Room integration marker missing: '+marker);
          }
          fs.writeFileSync(dir + 'worker.js', patched, 'utf8');
          fs.writeFileSync(dir + 'package.json', JSON.stringify({
            private: true,
            type: 'module',
            dependencies: {
              '@block65/webcrypto-web-push': '2.0.0',
              'uint8array-extras': '1.5.0'
            },
            devDependencies: {
              wrangler: '4.0.0'
            }
          }, null, 2));
          console.log('Original Worker SHA and D1 verified; cumulative badge-count patch prepared.');
          NODE
          node --check cloudflare/top-run-notify/worker.js

      - name: Install dependencies
        working-directory: cloudflare/top-run-notify
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Dry run
        working-directory: cloudflare/top-run-notify
        run: npx wrangler deploy --dry-run

      - name: Require explicit confirmation to enable
        if: ${{ inputs.enable_event }}
        env:
          PUBLISH: ${{ inputs.publish }}
          CONFIRM: ${{ inputs.confirm_event }}
        run: test "$PUBLISH" = "true" && test "$CONFIRM" = "ENABLE_EVENT_PUSH"

      - name: Deploy to Cloudflare
        if: ${{ inputs.publish }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/top-run-notify
          wranglerVersion: "4"
          command: deploy --var STAGE3_ENABLED:true --var STAGE3_EVENT_ENABLED:${{ inputs.enable_event }}
