name: TOP RUN Event Notify deployment
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Deploy to the existing Cloudflare Worker? OFF = build/validate only"
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: top-run-notify-manual
  cancel-in-progress: false
jobs:
  event-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out approved notification staging branch (not main)
        uses: actions/checkout@v4
        with:
          ref: top-run-notify-stage2-20261015
          persist-credentials: false
      - name: Rebuild the reviewed Stage3 Worker with event-notify route
        shell: bash
        run: |
          set -euo pipefail
          python3 cloudflare/top-run-notify/build_event_notify_worker.py cloudflare/top-run-notify
          node --input-type=module --check < cloudflare/top-run-notify/worker.js
          python3 - <<'PY'
          from pathlib import Path
          w=Path('cloudflare/top-run-notify/worker.js').read_text()
          for marker in (
              "'/api/stage3/notify'",
              "'/api/stage3/event-notify'",
              "'/api/stage3/register'",
              "'/api/stage3/revoke'",
              "FIREBASE_READONLY_SERVICE_ACCOUNT_JSON",
          ):
              if marker not in w: raise SystemExit(f'Missing existing/required route: {marker}')
          print('Both existing and event notification routes confirmed.')
          PY
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing Stage3 dependencies
        run: |
          cd cloudflare/top-run-notify
          npm install --no-save --ignore-scripts --no-audit --no-fund \
            @block65/webcrypto-web-push@2.0.0 uint8array-extras@1.5.0 wrangler@4
      - name: Validate Cloudflare worker without deployment
        run: cd cloudflare/top-run-notify && npx wrangler@4 deploy --dry-run
      - name: Deploy only with publish explicitly enabled
        if: ${{ inputs.publish == true }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/top-run-notify
          command: deploy --var STAGE3_ENABLED:true
