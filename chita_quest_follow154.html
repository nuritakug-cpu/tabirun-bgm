let map=null,routeLayer=null,gpsMarker=null,accuracyCircle=null,watchId=null,lastPos=null,lastHeading=null,lastBearingPos=null,lastBearingAt=0,lastCameraPos=null,lastCameraAt=0,userBusy=false,resumeTimer=0,lastUiAt=0;
const ret=()=>{try{if(window.parent&&window.parent!==window&&typeof window.parent.r150CloseExternalMap==='function'){window.parent.r150CloseExternalMap();return}}catch(e){}try{if(window.parent&&window.parent!==window){window.parent.postMessage({type:'tabirun-map150-close'},location.origin);return}}catch(e){}if(history.length>1){history.back();return}location.href='chita_quest_release154.html'};
document.getElementById('back').onclick=ret;
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]))}
function norm(v){v=Number(v);return ((v%360)+360)%360}
function delta(a,b){return ((b-a+540)%360)-180}
function hav(a,b){if(!a||!b)return Infinity;const R=6371000,r=Math.PI/180,p1=a.lat*r,p2=b.lat*r,dp=(b.lat-a.lat)*r,dl=(b.lng-a.lng)*r,x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function bearing(a,b){const r=Math.PI/180,p1=a.lat*r,p2=b.lat*r,dl=(b.lng-a.lng)*r,y=Math.sin(dl)*Math.cos(p2),x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);return norm(Math.atan2(y,x)/r)}
function smoothHeading(next){next=norm(next);if(!Number.isFinite(lastHeading)){lastHeading=next;return next}const d=delta(lastHeading,next);if(Math.abs(d)<5)return lastHeading;lastHeading=norm(lastHeading+d*.5);return lastHeading}
function gpsArrowIcon(){return L.divIcon({className:'',html:'<div class="gpsArrow"></div>',iconSize:[20,24],iconAnchor:[10,12]})}
function pin(t,g){return L.divIcon({className:'',html:'<div class="pin '+(g?'goal':'')+'"><b>'+t+'</b></div>',iconSize:[29,29],iconAnchor:[14,27]})}
function emoji(e){return L.divIcon({className:'',html:'<div class="emoji">'+e+'</div>',iconSize:[26,26],iconAnchor:[13,13]})}
function st(t){document.getElementById('status').textContent=t}
function rotationAvailable(){return !!(map&&typeof map.setBearing==='function'&&typeof map.getBearing==='function')}
function candidateHeading(coords,q){const acc=Math.max(1,Number(coords.accuracy)||999),now=Date.now();let h=null,native=Number(coords.heading),speed=Number(coords.speed);if(Number.isFinite(native)&&native>=0&&(Number.isFinite(speed)?speed>=.7:true)&&acc<=60)h=norm(native);if(h==null&&lastBearingPos){const d=hav(lastBearingPos,q),age=now-lastBearingAt;if(d>=1.8&&age<=6500&&acc<=60)h=bearing(lastBearingPos,q)}if(!lastBearingPos||hav(lastBearingPos,q)>=1.8||now-lastBearingAt>5500){lastBearingPos={lat:q.lat,lng:q.lng};lastBearingAt=now}return h==null?(Number.isFinite(lastHeading)?lastHeading:null):smoothHeading(h)}
function followPosition(q,h,force){if(userBusy||!rotationAvailable())return;const now=(window.performance&&performance.now)?performance.now():Date.now(),moved=lastCameraPos?hav(lastCameraPos,q):Infinity,elapsed=now-lastCameraAt;if(!force&&moved<1.1&&elapsed<700)return;lastCameraAt=now;lastCameraPos={lat:q.lat,lng:q.lng};try{if(Number.isFinite(h)){const target=norm(-h),cur=norm(map.getBearing()||0),d=delta(cur,target);if(Math.abs(d)>=5)map.setBearing(norm(cur+d*.55))}map.panTo([q.lat,q.lng],{animate:false,noMoveStart:true})}catch(e){}}
function pauseFollow(){userBusy=true;clearTimeout(resumeTimer)}
function resumeFollowLater(){clearTimeout(resumeTimer);resumeTimer=setTimeout(()=>{userBusy=false;if(lastPos)followPosition(lastPos,lastHeading,true)},1300)}
if(!p||!Array.isArray(p.path)||p.path.length<2||typeof L==='undefined'){document.getElementById('map').innerHTML='<div class="error"><div><strong>ルートデータを読み込めませんでした</strong>QUESTからもう一度MAPを開いてください。<br><button id="errback">QUESTへ戻る</button></div></div>';document.getElementById('errback').onclick=ret;st('MAPデータなし');return}
document.getElementById('fromto').textContent=p.from+' → '+p.to;document.getElementById('overview').textContent=p.overview||'進行方向が画面上になるよう追従します';const distM=Number(p.distanceMeters);document.getElementById('distance').textContent=(Number.isFinite(distM)?distM/1000:0).toFixed(2)+' km';
const opts={zoomControl:false,attributionControl:true,preferCanvas:true,zoomAnimation:false,fadeAnimation:false,markerZoomAnimation:false,inertia:true,inertiaDeceleration:3400,inertiaMaxSpeed:1800,rotate:true,bearing:0,dragRotate:false,shiftKeyRotate:false,touchRotate:false,rotateControl:false,preventPageGestures:true};
map=L.map('map',opts);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,updateWhenIdle:true,updateWhenZooming:false,keepBuffer:1,detectRetina:false,attribution:'&copy; OpenStreetMap'}).addTo(map);
const ll=p.path.map(x=>[x.lat,x.lng]);routeLayer=L.polyline(ll,{color:'#087990',weight:7,opacity:.96,lineJoin:'round',lineCap:'round',smoothFactor:2.0}).addTo(map);
const fit=()=>{try{map.invalidateSize(false);if(typeof map.setBearing==='function')map.setBearing(0);const b=routeLayer.getBounds();if(b&&b.isValid())map.fitBounds(b,{paddingTopLeft:[22,22],paddingBottomRight:[22,112],animate:false,maxZoom:17})}catch(e){try{map.setView(ll[0],16,{animate:false})}catch(_){}}};fit()
L.marker(ll[0],{icon:pin('S',false)}).addTo(map).bindPopup('<b>'+esc(p.from)+'</b>');L.marker(ll[ll.length-1],{icon:pin('G',true)}).addTo(map).bindPopup('<b>'+esc(p.to)+'</b>');
(p.warnings||[]).forEach(w=>{const em=({crosswalk:'🚸',intersection:'⚠️',sidewalk:'↔️',narrow:'⚠️',turn:'↪️',coast:'🌊'})[w.type]||'⚠️';L.marker([w.lat,w.lng],{icon:emoji(em),zIndexOffset:700}).addTo(map).bindPopup('<b>'+em+' '+esc(w.title||'注意点')+'</b>'+(w.note?'<br>'+esc(w.note).replace(/\n/g,'<br>'):'') )});
(p.toilets||[]).forEach(t=>L.marker([t.lat,t.lng],{icon:emoji('🚻')}).addTo(map).bindPopup('<b>🚻 '+esc(t.title||'トイレ')+'</b>'+(t.note?'<br>'+esc(t.note).replace(/\n/g,'<br>'):'')));
document.getElementById('all').onclick=()=>location.replace('chita_quest_map154.html?key='+encodeURIComponent(key)+'&full=1&v=154');document.getElementById('follow').onclick=()=>location.replace('chita_quest_map154.html?key='+encodeURIComponent(key)+'&v=154');
function update(pos,center){const c=pos.coords,q={lat:c.latitude,lng:c.longitude},a=Math.max(1,Number(c.accuracy)||50),h=candidateHeading(c,q),now=Date.now();lastPos=q;if(!gpsMarker)gpsMarker=L.marker([q.lat,q.lng],{icon:gpsArrowIcon(),zIndexOffset:1000,interactive:false}).addTo(map);else gpsMarker.setLatLng([q.lat,q.lng]);if(!accuracyCircle)accuracyCircle=L.circle([q.lat,q.lng],{radius:a,weight:1,color:'#1a73e8',opacity:.35,fillColor:'#4285f4',fillOpacity:.08,interactive:false}).addTo(map);else if(now-lastUiAt>900){accuracyCircle.setLatLng([q.lat,q.lng]);accuracyCircle.setRadius(a)}followPosition(q,h,!!center);if(now-lastUiAt>900){lastUiAt=now;st('進行方向FOLLOW｜GPS精度 約'+Math.round(a)+'m')}}
function err(e){st(e&&e.code===1?'位置情報が許可されていません':'GPSを取得できません')}
if(navigator.geolocation)watchId=navigator.geolocation.watchPosition(x=>update(x,false),err,{enableHighAccuracy:true,maximumAge:700,timeout:12000});else st('この端末ではGPSを利用できません');
document.getElementById('loc').onclick=()=>{if(lastPos){followPosition(lastPos,lastHeading,true);return}st('GPS取得中…');navigator.geolocation&&navigator.geolocation.getCurrentPosition(x=>update(x,true),err,{enableHighAccuracy:true,maximumAge:0,timeout:12000})};
map.on('dragstart zoomstart',pauseFollow);map.on('dragend zoomend',resumeFollowLater);
window.addEventListener('pagehide',()=>{clearTimeout(resumeTimer);if(watchId!=null&&navigator.geolocation)navigator.geolocation.clearWatch(watchId)});
setTimeout(()=>{map.invalidateSize(false);if(!lastPos)fit()},80);st(rotationAvailable()?'進行方向FOLLOW｜GPS取得中…':'進行方向機能を読み込めませんでした');
})();
