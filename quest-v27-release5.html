function rad(v){
return v*Math.PI/180;
}

function haversine(a,b){
const R=6371000;
const p1=rad(a.lat);
const p2=rad(b.lat);
const dp=rad(b.lat-a.lat);
const dl=rad(b.lng-a.lng);

const h=
Math.sin(dp/2)**2+
Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;

return 2*R*Math.asin(Math.sqrt(h));
}

function pointToSegmentMeters(target,a,b){
const R=6371000;
const lat0=rad(target.lat);

const project=p=>({
x:rad(p.lng-target.lng)*Math.cos(lat0)*R,
y:rad(p.lat-target.lat)*R
});

const A=project(a);
const B=project(b);

const vx=B.x-A.x;
const vy=B.y-A.y;
const len2=vx*vx+vy*vy;

if(len2===0){
return Math.hypot(A.x,A.y);
}

let t=-(A.x*vx+A.y*vy)/len2;
t=Math.max(0,Math.min(1,t));

return Math.hypot(
A.x+t*vx,
A.y+t*vy
);
}

async function refreshGpsPermission(){
gpsPermissionState='unknown';

if(!navigator.permissions||!navigator.permissions.query){
updateGpsUi();
return;
}

try{
const p=await navigator.permissions.query({name:'geolocation'});

gpsPermissionState=p.state||'unknown';

if(p.state==='granted'){
gpsPermissionDenied=false;
}

p.onchange=()=>{
gpsPermissionState=p.state||'unknown';

if(p.state!=='denied'){
gpsPermissionDenied=false;
}

updateGpsUi();
};

}catch(e){
gpsPermissionState='unknown';
}

updateGpsUi();
}

function evaluateGpsPosition(pos){
const now={
lat:pos.coords.latitude,
lng:pos.coords.longitude,
accuracy:Number.isFinite(pos.coords.accuracy)
?pos.coords.accuracy
:999,
time:pos.timestamp||Date.now()
};

const stored=readSavedGps();
const prev=gpsCurrent||gpsLast||stored;

gpsLast=prev;
gpsCurrent=now;
persistGps(now);

gpsLastSuccessAt=Date.now();
gpsSoftErrorCount=0;
gpsStarting=false;
gpsPermissionDenied=false;
gpsPermissionState='granted';
gpsStatus='watching';

gpsMessage=
now.accuracy>220
?'GPS接続 OK｜精度が上がるのを待っています'
:'GPS接続 OK｜自動通過判定中';

const target=currentGpsTarget();

if(target){
gpsDistance=haversine(now,target);
}

updateGpsUi();

if(
!state.started||
!target||
!['startCheck','arrival'].includes(state.phase)
){
return;
}

const goodAccuracy=now.accuracy<=220;

if(goodAccuracy&&gpsDistance<=target.radius){

if(state.phase==='startCheck'){
completeStartCheck('GPS START CHECK');
}else{
autoArrive('GPS AUTO CHECK-IN');
}

return;
}

if(
state.phase!=='arrival'||
!prev||
!Number.isFinite(prev.lat)||
!Number.isFinite(prev.lng)
){
return;
}

const dt=Math.abs(now.time-prev.time);
const moved=haversine(prev,now);
const prevAcc=Number.isFinite(prev.accuracy)
?prev.accuracy
:999;

if(
dt<=3*60*60*1000&&
moved<=20000&&
now.accuracy<=250&&
prevAcc<=250
){
const segDist=
pointToSegmentMeters(
target,
prev,
now
);

if(segDist<=target.radius){
autoArrive('GPS PASS-THROUGH CHECK');
}
}
}

function gpsError(err){
gpsStarting=false;

if(err&&err.code===1){
gpsPermissionDenied=true;
gpsPermissionState='denied';
gpsStatus='error';
gpsMessage='Chromeの位置情報が拒否されています。iPhone設定でChromeの位置情報を許可してください';
}
else if(err&&err.code===2){
gpsSoftErrorCount++;
gpsStatus='searching';
gpsMessage='GPS検索中｜位置を取得できるまで待機しています';
}
else if(err&&err.code===3){
gpsSoftErrorCount++;
gpsStatus='searching';
gpsMessage='GPS検索中｜再取得しています';
}
else{
gpsSoftErrorCount++;
gpsStatus='searching';
gpsMessage='GPS検索中…';
}

updateGpsUi();
}

function startGps(force=false,fromUser=false){
if(!window.isSecureContext){
gpsStarting=false;
gpsStatus='error';
gpsMessage='GPSにはHTTPS接続が必要です';
updateGpsUi();
return;
}

if(!('geolocation' in navigator)){
gpsStarting=false;
gpsStatus='error';
gpsMessage='このブラウザではGPSを利用できません';
updateGpsUi();
return;
}

if(!gpsUserStarted&&!fromUser){
gpsStatus='idle';
gpsMessage='GPS開始ボタンを押してください';
updateGpsUi();
return;
}

if(fromUser){
gpsUserStarted=true;
}

if(gpsWatchId!==null&&force){
try{
navigator.geolocation.clearWatch(gpsWatchId);
}catch(e){}
gpsWatchId=null;
}

if(gpsWatchId!==null&&!force){
gpsStarting=false;
gpsStatus='watching';
updateGpsUi();
return;
}

gpsPermissionDenied=false;
gpsStarting=true;
gpsStatus='searching';
gpsMessage='GPSを検索しています…';
updateGpsUi();

const onPos=pos=>evaluateGpsPosition(pos);
const onErr=err=>gpsError(err);

try{
gpsWatchId=navigator.geolocation.watchPosition(
onPos,
onErr,
{
enableHighAccuracy:false,
timeout:60000,
maximumAge:5000
}
);
}catch(e){
gpsWatchId=null;
}

try{
navigator.geolocation.getCurrentPosition(
onPos,
err=>{

if(err&&err.code===1){
onErr(err);
return;
}

try{
navigator.geolocation.getCurrentPosition(
onPos,
onErr,
{
enableHighAccuracy:true,
timeout:30000,
maximumAge:0
}
);
}catch(e){}

},
{
enableHighAccuracy:false,
timeout:12000,
maximumAge:10000
}
);
}catch(e){}

setTimeout(()=>{

if(!gpsUserStarted||gpsPermissionDenied){
return;
}

try{
navigator.geolocation.getCurrentPosition(
onPos,
err=>{
if(err&&err.code===1){
onErr(err);
}
},
{
enableHighAccuracy:true,
timeout:30000,
maximumAge:0
}
);
}catch(e){}

},1200);
}

function desiredBgm(){
if(!state.started)return null;

if(
[
'startCheck',
'startReady',
'stageClear',
'stampReady',
'stampShow',
'todayComplete',
'resumeChoice'
].includes(state.phase)
){
return null;
}

if(state.stage>=3)return'finish';
if(state.stage<=1)return'bright';
if(state.point<2)return'history';

return'sea';
}

function fadeBgm(target,step=.01,interval=40){
const a=document.getElementById('bgm');

if(!a)return;

clearInterval(a._fade);

target=Math.max(
0,
Math.min(1,target)
);

if(target<=.001){
a.volume=target;
return;
}

a._fade=setInterval(()=>{

a.volume=Math.min(
target,
a.volume+step
);

if(a.volume>=target){
clearInterval(a._fade);
}

},interval);
}

function syncBgm(force=false){
const key=desiredBgm();
const a=document.getElementById('bgm');

if(
!key||
!bgmOn||
!bgmUnlocked||
!a
){
return;
}

const changed=bgmKey!==key;

if(changed){
bgmKey=key;
a.pause();
a.src=BGM[key];
a.loop=key!=='finish';
a.volume=0;

try{
a.load();
}catch(e){}
}

if(changed||force||a.paused){

const p=a.play();

if(p&&p.then){

p.then(()=>{
removeResume();
fadeBgm(BGM_VOL[key]);
})
.catch(showResume);

}

}else{
a.volume=BGM_VOL[key];
}
}

function duck(ms=1800){
const a=document.getElementById('bgm');

if(
!a||
a.paused||
!bgmKey||
bgmKey==='finish'
){
return;
}

clearTimeout(duckTimer);

const base=
BGM_VOL[bgmKey]??.010;

a.volume=0;

duckTimer=setTimeout(()=>{

if(!a.paused){
a.volume=base;
}

},ms);
}

function audio(){
try{

if(!ctx){
ctx=new(
window.AudioContext||
window.webkitAudioContext
)();
}

return ctx;

}catch(e){
return null;
}
}

function tone(f,t,d,type='sine',v=.18){
const c=audio();

if(!c)return;

const o=c.createOscillator();
const g=c.createGain();

o.type=type;
o.frequency.setValueAtTime(f,t);

g.gain.setValueAtTime(.0001,t);
g.gain.exponentialRampToValueAtTime(v,t+.012);
g.gain.exponentialRampToValueAtTime(.0001,t+d);

o.connect(g);
g.connect(c.destination);

o.start(t);
o.stop(t+d+.04);
}

function impact(strength=.28){
const c=audio();

if(!c)return;

const t=c.currentTime;
const o=c.createOscillator();
const g=c.createGain();

o.type='sine';

o.frequency.setValueAtTime(115,t);
o.frequency.exponentialRampToValueAtTime(48,t+.24);

g.gain.setValueAtTime(strength,t);
g.gain.exponentialRampToValueAtTime(.0001,t+.28);

o.connect(g);
g.connect(c.destination);

o.start(t);
o.stop(t+.3);
}

function noiseHit(strength=.12,duration=.12){
const c=audio();

if(!c)return;

const size=Math.floor(c.sampleRate*duration);
const buffer=c.createBuffer(1,size,c.sampleRate);
const data=buffer.getChannelData(0);

for(let i=0;i<size;i++){
data[i]=(Math.random()*2-1)*(1-i/size);
}

const src=c.createBufferSource();
const filter=c.createBiquadFilter();
const gain=c.createGain();

src.buffer=buffer;

filter.type='lowpass';
filter.frequency.value=950;

gain.gain.value=strength;

src.connect(filter);
filter.connect(gain);
gain.connect(c.destination);

src.start();
}

function makeSeWavUrl(kind){
const sr=22050;
const seconds=kind==='clear'?1.45:.92;
const n=Math.floor(sr*seconds);
const samples=new Float32Array(n);

const addTone=(start,freq,dur,amp,decay=.18)=>{
const s0=Math.floor(start*sr);
const len=Math.floor(dur*sr);

for(let j=0;j<len&&s0+j<n;j++){
const t=j/sr;
const e=
(1-Math.exp(-t/.004))*
Math.exp(-t/decay);

samples[s0+j]+=
amp*
e*
Math.sin(2*Math.PI*freq*t);
}
};

const addThump=amp=>{
const len=Math.min(
n,
Math.floor(sr*.48)
);

for(let i=0;i<len;i++){
const t=i/sr;
const e=Math.exp(-t/.12);

const f=
(kind==='clear'?118:92)*
Math.pow(
.40,
Math.min(t/.28,1)
);

samples[i]+=
amp*
e*
Math.sin(2*Math.PI*f*t);

if(t<.14){
samples[i]+=
(Math.random()*2-1)*
(kind==='clear'?.34:.58)*
Math.exp(-t/.03);
}
}
};

if(kind==='clear'){

addThump(.95);

[
[.08,392,.34],
[.22,523.25,.38],
[.38,659.25,.42],
[.56,783.99,.46],
[.78,1046.5,.52]
].forEach(q=>
addTone(
q[0],
q[1],
.58,
q[2],
.23
)
);

}else{

addThump(1.12);

[
[.18,392,.28],
[.29,587.33,.34],
[.43,880,.42]
].forEach(q=>
addTone(
q[0],
q[1],
.34,
q[2],
.13
)
);

}

let peak=.0001;

for(const v of samples){
peak=Math.max(
peak,
Math.abs(v)
);
}

const gain=.92/peak;
const buf=new ArrayBuffer(44+n*2);
const view=new DataView(buf);

const str=(o,s)=>{
for(let i=0;i<s.length;i++){
view.setUint8(
o+i,
s.charCodeAt(i)
);
}
};

str(0,'RIFF');
view.setUint32(4,36+n*2,true);
str(8,'WAVE');
str(12,'fmt ');
view.setUint32(16,16,true);
view.setUint16(20,1,true);
view.setUint16(22,1,true);
view.setUint32(24,sr,true);
view.setUint32(28,sr*2,true);
view.setUint16(32,2,true);
view.setUint16(34,16,true);
str(36,'data');
view.setUint32(40,n*2,true);

for(let i=0;i<n;i++){

const v=
Math.max(
-1,
Math.min(
1,
samples[i]*gain
)
);

view.setInt16(
44+i*2,
Math.round(v*32767),
true
);

}

return URL.createObjectURL(
new Blob(
[buf],
{type:'audio/wav'}
)
);
}

async function getMedalBlob(){

URL.revokeObjectURL(
medalObjectUrl
);

document.createElement('a');

medalObjectUrl;

'知多半島旅ラン_FINISHER_MEDAL_2026-9-22.png';

async function shareMedal(){
try{

const blob=
await getMedalBlob();

const f=
new File(
[blob],
'知多半島旅ラン_FINISHER_MEDAL_2026-9-22.png',
{
type:
blob.type||
'image/png'
}
);

if(
navigator.share&&
(
!navigator.canShare||
navigator.canShare({
files:[f]
})
)
){

await navigator.share({
title:'知多半島 旅ラン FINISHER',
text:'知多半島 旅ラン 完走メダル',
files:[f]
});

return;
}

}catch(e){

}

}

openMedalImage();
}

最初から見る

`;

setTimeout(
()=>finalFX(false),
100
);
}

function render(){
if(!state.started){
renderStart();
return;
}

if(state.phase==='resumeChoice'){
renderResumeChoice();
return;
}

if(state.phase==='todayComplete'){
renderTodayComplete();
return;
}

if(state.phase==='startCheck'){
renderStartCheck();
return;
}

if(state.phase==='startReady'){
renderStartReady();
return;
}

if(state.stage>=stages.length){
renderFinish();
return;
}

if(state.phase==='stageClear'){
renderStageClear();
return;
}

syncBgm();

if(state.phase==='reached'){
renderReached();
return;
}

document.getElementById('app').innerHTML=
header()+
'<main id="main"></main>';

if(state.phase==='stage'){
renderStage();
}
else if(state.phase==='arrival'){
renderArrival();
}
else if(state.phase==='quiz'){
renderQuiz();
}
else if(state.phase==='secret'){
renderSecret();
}
else if(state.phase==='history'){
renderHistory();
}
else if(state.phase==='historyClear'){
renderHistoryClear();
}
else if(state.phase==='stampReady'){
renderStampReady();
}
else if(state.phase==='stampShow'){
renderStampShow();
}
}

document.addEventListener(
'pointerdown',
()=>{
unlockSound();
},
{
capture:true,
passive:true
}
);

document.addEventListener(
'touchstart',
()=>{
unlockSound();
},
{
capture:true,
passive:true
}
);

document.addEventListener(
'click',
()=>{
if(
state.started&&
!bgmUnlocked
){
bgmUnlocked=true;
unlockSound();
syncBgm(true);
}
},
{
capture:true
}
);

document.addEventListener(
'visibilitychange',
()=>{

const a=
document.getElementById('bgm');

if(a){

if(document.hidden){

a.dataset.resume=
!a.paused
?'1'
:'0';

a.pause();

}
else if(
a.dataset.resume==='1'&&
bgmOn
){

const p=a.play();

if(p&&p.catch){
p.catch(showResume);
}

}
}

if(
!document.hidden&&
state.started&&
gpsUserStarted
){

if('geolocation' in navigator){

navigator.geolocation.getCurrentPosition(
evaluateGpsPosition,
gpsError,
{
enableHighAccuracy:true,
timeout:20000,
maximumAge:0
}
);

}

startGps(false,false);
}

}
);

window.addEventListener(
'pageshow',
()=>{

if(
state.started&&
gpsUserStarted
){

setTimeout(
()=>startGps(true,false),
250
);

}

}
);

window.addEventListener(
'focus',
()=>{

if(
state.started&&
gpsUserStarted
){

setTimeout(
()=>startGps(true,false),
250
);

}

}
);

document
.getElementById('bgm')
.addEventListener(
'error',
showResume
);

const savedGpsAtBoot=
readSavedGps();

if(savedGpsAtBoot){
gpsLast=savedGpsAtBoot;
}

initSeAudio();
render();
refreshGpsPermission();
</script>
</body>
</html>
