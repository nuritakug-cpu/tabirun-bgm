# GitHub Pages publishing filter for TabiRun QUEST
# Keeps the current app and a small number of rollback versions in the repository,
# while preventing hundreds of obsolete large HTML releases from being copied
# into the GitHub Pages deployment artifact.

exclude:
  # Jekyll standard exclusions
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

  # Old TabiRun QUEST releases (kept in GitHub, not published to Pages)
  # release 3-99 only
  - "chita_quest_release[3-9].html"
  - "chita_quest_release[3-9]_*.html"
  - "chita_quest_release[3-9][0-9].html"
  - "chita_quest_release[3-9][0-9]_*.html"

  # release 100-199
  - "chita_quest_release1*.html"

  # release 200-269
  - "chita_quest_release2[0-6]*.html"

  # Selected 270-series kept out of Pages
  - "chita_quest_release27[0-4]*.html"
  - "chita_quest_release27[6-9]*.html"

  # Selected 280-series kept out of Pages
  - "chita_quest_release28[0-4]*.html"

# Intentionally still published:
# - chita_quest_release275_performance.html
# - chita_quest_release285_map_overview_sourcefix.html
# - chita_quest_release286_fast_static_overview.html
# - chita_quest_release300_map_follow_stable.html
# - chita_quest_map192.html
# - chita_quest_follow192.html
# - chita_quest_follow202_single_gps_stable.html
# - audio files and current route JSON/editor files
