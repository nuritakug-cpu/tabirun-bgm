<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes"><meta name="theme-color" content="#062f42"><title>旅ランQUEST LIVE Prototype v4</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#071f2a;color:#17313b}button,input{font:inherit}#app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}.head{padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:linear-gradient(145deg,#052e42,#08758b);color:#fff;z-index:1500}.row{display:flex;align-items:center;gap:10px}.back{width:38px;height:38px;border-radius:50%;border:1px solid #ffffff55;background:#ffffff18;color:#fff;font-size:22px}.title{flex:1}.title small{display:block;color:#ffd77a;font-size:8px;font-weight:900;letter-spacing:.14em}.title strong{display:block;font-size:16px}.title span{display:block;font-size:9px;color:#d9edf2}.live{padding:5px 8px;border-radius:999px;background:#ffffff1f;font-size:9px;font-weight:900}#map{height:100%;min-height:0}.toolbar{position:absolute;z-index:1200;left:10px;right:10px;top:calc(78px + env(safe-area-inset-top));display:flex;gap:6px;pointer-events:none}.tool{pointer-events:auto;border:0;border-radius:12px;padding:8px 10px;background:#fffffff2;color:#123845;font-size:11px;font-weight:950;box-shadow:0 2px 10px #0003}.bottom{z-index:1600;display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#fff;padding:7px 10px calc(7px + env(safe-area-inset-bottom))}.nav{border:0;border-radius:12px;padding:9px;background:#edf4f5;font-size:11px;font-weight:950}.nav.active{background:#0a7186;color:#fff}.runner{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:1000;border:3px solid #fff;box-shadow:0 2px 9px #0006;position:relative}.runner.stop:after,.runner.lost:after{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid #f1aa2b}.runner.lost:after{border-color:#777}.cluster{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#062f42;color:#fff;border:3px solid #fff;font-weight:1000;box-shadow:0 2px 10px #0006}.cp{width:21px;height:21px;border-radius:50%;display:grid;place-items:center;background:#fff;border:3px solid #0b7488;color:#0b6075;font-size:8px;font-weight:1000}.sheet{position:fixed;z-index:3000;left:0;right:0;bottom:0;transform:translateY(110%);transition:.2s;background:#fff;border-radius:18px 18px 0 0;max-height:68dvh;overflow:auto;padding-bottom:calc(10px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px #0005}.sheet.open{transform:translateY(0)}.grip{width:42px;height:4px;border-radius:999px;background:#ccd5d8;margin:8px auto}.shead{display:flex;gap:10px;align-items:center;padding:5px 14px 10px;border-bottom:1px solid #e7edef}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:1000}.stitle{flex:1}.stitle strong{display:block;font-size:16px}.stitle small{font-size:10px;color:#789}.close{border:0;background:#edf3f4;width:34px;height:34px;border-radius:50%;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 14px}.box{background:#f4f8f9;border-radius:12px;padding:10px}.box small{display:block;font-size:8px;color:#789}.box b{display:block;margin-top:3px;font-size:12px}.run{color:#078d57}.stopc{color:#b56b00}.lostc{color:#6c767a}.member{display:flex;align-items:center;gap:9px;padding:9px 14px;border-bottom:1px solid #eef2f3}.mini{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:9px;font-weight:1000}.mtext{flex:1}.mtext b{display:block;font-size:12px}.mtext small{font-size:9px;color:#789}.chat{position:fixed;z-index:2500;inset:0;background:#edf3f4;display:none;grid-template-rows:auto 1fr auto}.chat.open{display:grid}.chatHead{display:flex;align-items:center;gap:9px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:linear-gradient(145deg,#052e42,#08758b);color:#fff}.chatHead button{width:36px;height:36px;border:0;border-radius:50%;background:#ffffff1f;color:#fff}.msgs{padding:12px;overflow:auto}.msg{max-width:82%;margin-bottom:10px;padding:9px 10px;border-radius:13px;background:#fff;box-shadow:0 1px 4px #0001}.msg.sys{max-width:94%;margin-left:auto;margin-right:auto;background:#fff4d8}.msg.me{margin-left:auto;background:#dff3f7}.msg small{display:block;font-size:8px;color:#789;margin-bottom:3px}.msg div{font-size:12px;line-height:1.45}.chatInput{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#fff}.chatInput input{min-width:0;border:1px solid #cbdadd;border-radius:999px;padding:10px 13px}.chatInput button{border:0;border-radius:999px;background:#0a7186;color:#fff;padding:0 16px;font-weight:950}.legend{position:absolute;z-index:1150;right:10px;bottom:82px;background:#fffffff2;border-radius:12px;padding:8px 9px;font-size:8px;box-shadow:0 2px 10px #0003}.legend div{display:flex;align-items:center;gap:5px;line-height:1.7}.legend i{width:13px;height:4px;border-radius:9px}.demo{position:absolute;z-index:1150;left:10px;bottom:82px;border:0;border-radius:12px;padding:8px 10px;background:#fff;font-size:9px;font-weight:950;box-shadow:0 2px 10px #0003}.note{position:absolute;z-index:1100;left:50%;transform:translateX(-50%);bottom:83px;padding:5px 8px;border-radius:999px;background:#052f42d9;color:#fff;font-size:8px;font-weight:850;white-space:nowrap}

@keyframes alertPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.22);opacity:.28}}
@keyframes chatPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,173,51,0)}50%{box-shadow:0 0 0 7px rgba(255,173,51,.28)}}
.runner.stop:after,.runner.lost:after{animation:alertPulse 1.15s ease-in-out infinite}
.nav.unread{background:#fff2cf!important;color:#9a5c00!important;animation:chatPulse 1.05s ease-in-out infinite}
#badge{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;margin-left:3px;border-radius:999px;background:#e94d45;color:#fff;font-size:9px;font-weight:1000;vertical-align:middle}
#badge:empty{display:none}
</style></head><body><div id="app"><header class="head"><div class="row"><button class="back" onclick="history.back()">‹</button><div class="title"><small>RUNNING LIVE SYSTEM / PROTOTYPE v4</small><strong>旅ランQUEST LIVE MAP</strong><span>3ステージ統合・位置共有テスト</span></div><div class="live">● DEMO LIVE</div></div></header><div id="map"></div><nav class="bottom"><button class="nav active">◎ LIVE MAP</button><button class="nav" id="chatTab">💬 CHAT <span id="badge"></span></button></nav></div><div class="toolbar"><button class="tool" id="allBtn">↺ 全体</button><button class="tool" id="peopleBtn">● 参加者</button><button class="tool" id="meBtn">◎ 現在地</button></div><div class="legend"><b>ROUTE</b><div><i style="background:#0b7d91"></i>S1</div><div><i style="background:#d98b21"></i>S2</div><div><i style="background:#a04ca0"></i>S3</div></div><button class="demo" id="demoMove">👥 重なり表示確認</button><div class="note">試作v4：4人重なり表示をワンタップ確認</div><div class="sheet" id="sheet"><div class="grip"></div><div id="sheetBody"></div></div><div class="chat" id="chat"><div class="chatHead"><button id="chatBack">‹</button><div><small style="font-size:8px;color:#ffd77a;font-weight:900">EVENT CHAT</small><strong>旅ランQUEST 9/22</strong></div></div><div class="msgs" id="msgs"></div><div class="chatInput"><input id="chatInput" placeholder="メッセージを入力"><button id="sendBtn">送信</button></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const cps=[['阿久比町役場',1,34.93303,136.91559],['河和口海岸',1,34.8041362,136.9191338],['河和口駅',1,34.7978335,136.9189308],['オレンジ広場',2,34.7985747,136.9009253],['鵜の池',2,34.80184,136.88325],['南知多ビーチランド入口',2,34.7859127,136.858349],['知多奥田駅',2,34.7873565,136.8643192],['法山寺',3,34.77224,136.86481],['野間大坊',3,34.7707293,136.8531312],['冨具崎公園',3,34.7628349,136.845687],['野間埼灯台',3,34.7427,136.8429],['小野浦海岸',3,34.7315,136.8632],['内海温泉いち豆',3,34.7224,136.8688]].map((x,i)=>({n:x[0],s:x[1],lat:x[2],lng:x[3],i:i+1}));
const colors={1:'#0b7d91',2:'#d98b21',3:'#a04ca0'};let people=[{id:'taku',name:'拓郎',ini:'拓',c:'#1677d2',lat:34.7990,lng:136.8928,state:'run',up:1,stop:0,cp:'河和口駅',time:'7:58',stage:2},{id:'suzuki',name:'鈴木',ini:'鈴',c:'#dc554f',lat:34.7990,lng:136.8928,state:'run',up:1,stop:0,cp:'オレンジ広場',time:'8:16',stage:2},{id:'sato',name:'佐藤',ini:'佐',c:'#7a56c2',lat:34.7990,lng:136.8928,state:'stop',up:1,stop:8,cp:'オレンジ広場',time:'8:15',stage:2},{id:'tanaka',name:'田中',ini:'田',c:'#13a374',lat:34.7990,lng:136.8928,state:'run',up:2,stop:0,cp:'オレンジ広場',time:'8:17',stage:2},{id:'ito',name:'伊藤',ini:'伊',c:'#e68a18',lat:34.7868,lng:136.8628,state:'lost',up:14,stop:0,cp:'知多奥田駅',time:'9:02',stage:3},{id:'yamada',name:'山田',ini:'山',c:'#d84e9c',lat:34.7720,lng:136.8618,state:'stop',up:1,stop:21,cp:'法山寺',time:'9:28',stage:3}];
const map=L.map('map',{preferCanvas:true,minZoom:10,maxZoom:19});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
let routeLayer=L.layerGroup().addTo(map),cpLayer=L.layerGroup().addTo(map),layer=L.layerGroup().addTo(map);
let bounds=L.latLngBounds(cps.map(c=>[c.lat,c.lng]));
function drawFallback(){routeLayer.clearLayers();cpLayer.clearLayers();[1,2,3].forEach(s=>L.polyline(cps.filter(x=>x.s===s).map(x=>[x.lat,x.lng]),{color:colors[s],weight:5,opacity:.5,dashArray:'6 7'}).addTo(routeLayer));cps.forEach(c=>L.marker([c.lat,c.lng],{icon:L.divIcon({className:'',html:`<div class="cp">${c.i}</div>`,iconSize:[21,21],iconAnchor:[10,10]})}).addTo(cpLayer).bindTooltip(c.n));}
function fitAll(){map.fitBounds(bounds.pad(.06))}
function extractRoutes(txt){const tag='const ROUTES=';const at=txt.indexOf(tag);if(at<0)throw new Error('ROUTES not found');const st=txt.indexOf('{',at+tag.length);if(st<0)throw new Error('ROUTES start not found');let d=0,ins=false,esc=false,end=-1;for(let i=st;i<txt.length;i++){const ch=txt[i];if(ins){if(esc)esc=false;else if(ch==='\\')esc=true;else if(ch==='"')ins=false}else{if(ch==='"')ins=true;else if(ch==='{')d++;else if(ch==='}'){d--;if(d===0){end=i+1;break}}}}if(end<0)throw new Error('ROUTES end not found');return JSON.parse(txt.slice(st,end))}
function routeStage(key,current){if(key==='orangeLine')return 2;if(key==='hozanji')return 3;return current}
function drawActualRoutes(routes){routeLayer.clearLayers();cpLayer.clearLayers();bounds=L.latLngBounds();let stage=1;let cpNo=1;const endpointMap=new Map();for(const [key,r] of Object.entries(routes)){stage=routeStage(key,stage);if(key.endsWith('__extra')||!r||!Array.isArray(r.path)||r.path.length<2)continue;const pts=r.path.map(p=>[p.lat,p.lng]);const optional=/fugusaki/i.test(key);L.polyline(pts,{color:colors[stage],weight:optional?5:6,opacity:optional?.72:.88,dashArray:optional?'8 7':null,lineCap:'round',lineJoin:'round'}).addTo(routeLayer);pts.forEach(x=>bounds.extend(x));if(r.from&&!endpointMap.has(r.from))endpointMap.set(r.from,{name:r.from,pos:pts[0],stage});if(r.to&&!endpointMap.has(r.to))endpointMap.set(r.to,{name:r.to,pos:pts[pts.length-1],stage});}
for(const ep of endpointMap.values()){const isExtra=ep.name.includes('冨具崎');const label=isExtra?'E':String(cpNo++);L.marker(ep.pos,{icon:L.divIcon({className:'',html:`<div class="cp" style="border-color:${colors[ep.stage]}">${label}</div>`,iconSize:[21,21],iconAnchor:[10,10]})}).addTo(cpLayer).bindTooltip(ep.name,{direction:'top'});}
if(bounds.isValid())fitAll();const note=document.querySelector('.note');if(note)note.textContent=`実ルート読込完了：${Object.keys(routes).filter(k=>!k.endsWith('__extra')).length}区間`;}
async function loadActualRoutes(){const note=document.querySelector('.note');try{if(note)note.textContent='旅ラン実ルートを読み込み中…';const res=await fetch('./chita_quest_follow199_stablecamera.html',{cache:'no-store'});if(!res.ok)throw new Error('route source '+res.status);const txt=await res.text();drawActualRoutes(extractRoutes(txt));}catch(e){console.warn(e);drawFallback();bounds=L.latLngBounds(cps.map(c=>[c.lat,c.lng]));fitAll();if(note)note.textContent='実ルート読込失敗：概略線で表示中';}}
drawFallback();fitAll();loadActualRoutes();
function dist(a,b){const R=6371000,r=x=>x*Math.PI/180,dla=r(b.lat-a.lat),dlo=r(b.lng-a.lng),q=Math.sin(dla/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dlo/2)**2;return 2*R*Math.asin(Math.sqrt(q))}function groups(){const g=[];people.forEach(p=>{let x=g.find(z=>dist(z.a,p)<38);if(!x){x={a:{lat:p.lat,lng:p.lng},m:[]};g.push(x)}x.m.push(p)});return g}function stext(p){return p.state==='run'?'移動中':p.state==='stop'?`停止推定 ${p.stop}分`:'位置更新なし（要確認）'}function sclass(p){return p.state==='run'?'run':p.state==='stop'?'stopc':'lostc'}function icon(p){return L.divIcon({className:'',html:`<div class="runner ${p.state==='stop'?'stop':p.state==='lost'?'lost':''}" style="background:${p.c}">${p.ini}</div>`,iconSize:[32,32],iconAnchor:[16,16]})}function render(){layer.clearLayers();groups().forEach(g=>{if(g.m.length>1){const lat=g.m.reduce((a,p)=>a+p.lat,0)/g.m.length,lng=g.m.reduce((a,p)=>a+p.lng,0)/g.m.length;L.marker([lat,lng],{icon:L.divIcon({className:'',html:`<div class="cluster">${g.m.length}</div>`,iconSize:[44,44],iconAnchor:[22,22]})}).addTo(layer).on('click',()=>showGroup(g.m))}else{const p=g.m[0];L.marker([p.lat,p.lng],{icon:icon(p)}).addTo(layer).on('click',()=>showPerson(p))}})}function showPerson(p){sheetBody.innerHTML=`<div class="shead"><div class="avatar" style="background:${p.c}">${p.ini}</div><div class="stitle"><strong>${p.name}</strong><small>STAGE ${p.stage} ・ 最終更新 ${p.up}分前</small></div><button class="close" onclick="closeSheet()">×</button></div><div class="grid"><div class="box"><small>現在状態</small><b class="${sclass(p)}">${stext(p)}</b></div><div class="box"><small>最終位置更新</small><b>${p.up}分前</b></div><div class="box"><small>前チェックポイント</small><b>${p.cp}</b></div><div class="box"><small>通過時刻</small><b>${p.time}</b></div><div class="box"><small>停止時間</small><b>${p.state==='stop'?p.stop+'分':'—'}</b></div><div class="box"><small>共有状態</small><b>${p.state==='lost'?'要確認':'共有中'}</b></div></div>`;sheet.classList.add('open');map.panTo([p.lat,p.lng]);if(map.getZoom()<15)map.setZoom(15)}function showGroup(a){sheetBody.innerHTML=`<div class="shead"><div class="avatar" style="background:#062f42">${a.length}</div><div class="stitle"><strong>同じ場所に ${a.length}人</strong><small>まとまって走行中・個別情報を確認</small></div><button class="close" onclick="closeSheet()">×</button></div>${a.map(p=>`<div class="member" onclick="showPerson(people.find(x=>x.id==='${p.id}'))"><div class="mini" style="background:${p.c}">${p.ini}</div><div class="mtext"><b>${p.name}</b><small class="${sclass(p)}">${stext(p)} ・ 更新${p.up}分前</small></div><b>›</b></div>`).join('')}`;sheet.classList.add('open')}window.closeSheet=()=>sheet.classList.remove('open');window.showPerson=showPerson;render();allBtn.onclick=fitAll;peopleBtn.onclick=()=>map.fitBounds(L.latLngBounds(people.map(p=>[p.lat,p.lng])).pad(.3));meBtn.onclick=()=>navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>{const ll=[p.coords.latitude,p.coords.longitude];L.circleMarker(ll,{radius:8,color:'#fff',weight:3,fillColor:'#1677d2',fillOpacity:1}).addTo(map);map.setView(ll,16)},()=>alert('位置情報を取得できませんでした'));demoMove.onclick=()=>{const g=groups().sort((a,b)=>b.m.length-a.m.length)[0];if(!g||g.m.length<2)return;const lat=g.m.reduce((a,p)=>a+p.lat,0)/g.m.length,lng=g.m.reduce((a,p)=>a+p.lng,0)/g.m.length;map.setView([lat,lng],17);setTimeout(()=>showGroup(g.m),250)};
let chats=[{n:'運営',t:'07:45',m:'LIVE位置共有テストを開始しました。',sys:1},{n:'鈴木',t:'08:19',m:'オレンジ広場で少し給水します。'},{n:'佐藤',t:'08:20',m:'5分ほど休憩します。'},{n:'運営',t:'08:22',m:'了解です。無理せず進んでください。',sys:1}];let unread=0;function updateUnread(){badge.textContent=unread?String(unread):'';chatTab.classList.toggle('unread',unread>0&&!chat.classList.contains('open'))}function receiveChat(x){chats.push(x);if(chat.classList.contains('open'))renderMsgs();else{unread++;updateUnread()}}function renderMsgs(){msgs.innerHTML=chats.map(x=>`<div class="msg ${x.sys?'sys':''}"><small>${x.n} ・ ${x.t}</small><div>${x.m}</div></div>`).join('');msgs.scrollTop=msgs.scrollHeight}renderMsgs();chatTab.onclick=()=>{chat.classList.add('open');unread=0;updateUnread();renderMsgs()};chatBack.onclick=()=>chat.classList.remove('open');sendBtn.onclick=()=>{if(!chatInput.value.trim())return;const d=new Date();chats.push({n:'あなた',t:`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`,m:chatInput.value.trim()});chatInput.value='';renderMsgs()};chatInput.onkeydown=e=>{if(e.key==='Enter')sendBtn.click()};setTimeout(()=>{const d=new Date();receiveChat({n:'運営',t:`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`,m:'【通知テスト】新着メッセージです。CHATの点滅と未読バッジを確認してください。',sys:1})},8000);
</script></body></html>
