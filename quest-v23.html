function questAudioRun(fn){

  if(!soundOn){
    return;
  }

  try{

    if(!ctx){

      ctx=new(
        window.AudioContext
        ||
        window.webkitAudioContext
      )();

    }

    const run=()=>{

      try{
        fn(ctx);
      }
      catch(e){}

    };


    if(
      ctx.state==='running'
    ){

      run();

      return;
    }


    const p=
      ctx.resume();


    if(
      p
      &&
      p.then
    ){

      p
        .then(
          run
        )
        .catch(
          ()=>{}
        );

    }
    else{

      setTimeout(
        run,
        0
      );

    }

  }
  catch(e){}

}


function questAudioUnlock(){

  if(!soundOn){
    return;
  }

  try{

    if(!ctx){

      ctx=new(
        window.AudioContext
        ||
        window.webkitAudioContext
      )();

    }


    if(
      ctx.state==='suspended'
    ){

      const p=
        ctx.resume();


      if(
        p
        &&
        p.catch
      ){

        p.catch(
          ()=>{}
        );

      }

    }

  }
  catch(e){}

}

function dataUrlToBlobV23(
  dataUrl
){

  const parts=
    dataUrl.split(
      ','
    );


  const mime=
    (
      parts[0]
      .match(
        /:(.*?);/
      )
      ||
      []
    )[1]
    ||
    'image/png';


  const bytes=
    atob(
      parts[1]
    );


  const arr=
    new Uint8Array(
      bytes.length
    );


  for(
    let i=0;
    i<bytes.length;
    i++
  ){

    arr[i]=
      bytes.charCodeAt(
        i
      );

  }


  return new Blob(
    [arr],
    {
      type:mime
    }
  );

}
