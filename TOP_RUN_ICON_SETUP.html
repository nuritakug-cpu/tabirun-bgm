<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f3534">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="top-run-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="top-run-192.png">
<meta name="apple-mobile-web-app-title" content="TOP RUN">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>TOP RUN アイコンの作りかた</title>
<style>
:root{
  --bg:#eceae4;--card:#faf9f5;--ink:#2e3433;--muted:#5f6866;--line:#d8d4c9;--gold:#d8b825;--gold-deep:#8a6d12;
  --btn:#2e3433;--btn-ink:#fff;--off:#c9c7bf;--off-ink:#7d827f;--warn-bg:#fff3d6;--warn-line:#e0b84a;--ph:#fff;--phs:#2e3433;--ph2:#eceae4;--ph3:#cfcac0;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d2220;--card:#2a312f;--ink:#eef1ef;--muted:#b3bcb8;--line:#46504d;--gold:#e4ca58;--gold-deep:#e4ca58;--btn:#e4ca58;--btn-ink:#222;--off:#46504d;--off-ink:#8d9591;--warn-bg:#3a3420;--warn-line:#a98a2b;--ph:#2a312f;--phs:#b3bcb8;--ph2:#1d2220;--ph3:#46504d}}
:root[data-theme="dark"]{--bg:#1d2220;--card:#2a312f;--ink:#eef1ef;--muted:#b3bcb8;--line:#46504d;--gold:#e4ca58;--gold-deep:#e4ca58;--btn:#e4ca58;--btn-ink:#222;--off:#46504d;--off-ink:#8d9591;--warn-bg:#3a3420;--warn-line:#a98a2b;--ph:#2a312f;--phs:#b3bcb8;--ph2:#1d2220;--ph3:#46504d}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;line-height:1.7;-webkit-text-size-adjust:100%}
.wrap{max-width:480px;margin:0 auto;padding:16px 14px 60px}
header{text-align:center;padding:6px 0 10px}
header img{width:64px;height:64px;border-radius:15px;display:block;margin:0 auto 8px}
header small{display:block;color:var(--gold-deep);font-weight:900;letter-spacing:.12em;font-size:12px}
header h1{margin:2px 0 4px;font-size:22px;line-height:1.35}
header p{margin:0;color:var(--muted);font-size:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.tabs button{min-height:52px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;font-size:16px;font-weight:900;font-family:inherit}
.tabs button[aria-pressed="true"]{border-color:var(--gold);background:var(--gold);color:#2e2713}
.warn{margin:12px 0;padding:12px 14px;border-radius:14px;background:var(--warn-bg);border:1px solid var(--warn-line);font-size:14.5px}
.warn b{display:block;margin-bottom:4px;font-size:15.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 14px 18px;box-shadow:0 6px 18px rgba(46,52,51,.07)}
.prog{display:flex;gap:5px;margin:0 0 10px}
.prog i{flex:1;height:7px;border-radius:4px;background:var(--line)}
.prog i.on{background:var(--gold)}
.stepno{font-size:13px;font-weight:900;color:var(--gold-deep);letter-spacing:.08em}
.card h2{margin:2px 0 6px;font-size:21px;line-height:1.4}
.card p{margin:6px 0;font-size:15.5px}
.pic{margin:12px auto 6px;max-width:300px}
.pic svg{display:block;width:100%;height:auto}
.note{margin:8px 0 0;font-size:13.5px;color:var(--muted)}
.nav{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:14px}
.btn{display:block;width:100%;min-height:54px;border:0;border-radius:14px;background:var(--btn);color:var(--btn-ink);font-size:17px;font-weight:900;font-family:inherit;text-align:center;text-decoration:none;padding:14px 10px}
.btn.sec{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:disabled{background:var(--off);color:var(--off-ink);border-color:var(--off);cursor:not-allowed}
.btn.sec:disabled{background:transparent;color:var(--off-ink);border-color:var(--line)}
.copy{margin-top:10px}
.done{margin:8px 0 0;font-size:13.5px;color:var(--gold-deep);font-weight:800}
.help{margin-top:16px;font-size:13.5px;color:var(--muted)}
.demo{position:sticky;bottom:0;margin:18px -14px -60px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.demo button{margin:4px 4px 0 0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:800;min-height:34px;font-family:inherit}
.partlabel{display:inline-block;margin:0 0 8px;padding:4px 12px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:12.5px;font-weight:900;color:var(--gold-deep)}
.modelink{margin:0 0 10px;text-align:center}
.linkbtn{border:0;background:none;color:var(--ink);font-size:14px;font-weight:800;text-decoration:underline;text-underline-offset:3px;padding:8px 6px;min-height:40px;font-family:inherit}
.copyrow{margin:10px 0 2px}
.urllead{margin:12px 0 6px;font-size:13.5px;color:var(--muted)}
.urlbox{display:block;width:100%;resize:none;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all;-webkit-user-select:text;user-select:text}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="top-run-192.png" alt="" onerror="this.remove()">
    <small>TOP RUN PORTAL</small>
    <h1>アイコンの作りかた</h1>
    <p>5分ほどで終わります。まだ、登録はしません。</p>
  </header>

  <div id="pcnote" class="warn" hidden>
    <b>スマホで開いてください</b>
    このページは、スマホで使います。スマホで、同じアドレスを開いてください。
  </div>

  <div class="tabs" role="group" aria-label="スマホの種類">
    <button type="button" id="tabIos" aria-pressed="false">iPhone</button>
    <button type="button" id="tabAnd" aria-pressed="false">Android</button>
  </div>

  <p class="modelink"><button type="button" id="modeLink" class="linkbtn"></button></p>
  <div class="card" id="card"></div>

  <p class="help">うまくいかないときは、BAND（LINEでも可）で運営に連絡してください。スマホの機種名と、画面の写真を送ってもらえると、すぐに分かります。</p>

  <div class="demo" id="demo" hidden>
    見本の切り替え（本番のページには出ません）<br>
    <button type="button" data-d="ios">iPhoneで見る</button>
    <button type="button" data-d="and">Androidで見る</button>
    <button type="button" data-d="inapp">LINEの中で開いた場合</button>
    <button type="button" data-d="normal">ふつうのブラウザ</button>
  </div>
</div>

<script>
(function(){
  var PORTAL_URL='https://nuritakug-cpu.github.io/tabirun-bgm/TOP_RUN_PORTAL.html';
  var ua=navigator.userAgent||'';
  var isIos=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  var isAnd=/Android/.test(ua);
  /* BAND / LINE etc. open links in an in-app WebView: no 'Safari/' token on iPhone, a 'wv' token on Android. */
  var iosWeb=isIos&&!/Safari\//.test(ua);
  var andWeb=isAnd&&/;\s*wv\)|\bwv\b/.test(ua);
  var inApp=/Line\/|\bLINE\b|BAND|FBAN|FBAV|Instagram|MicroMessenger|Twitter/i.test(ua)||iosWeb||andWeb;
  var standalone=(window.navigator.standalone===true)||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches);

  /* Opened from the home-screen icon: go straight to PORTAL. */
  if(standalone){
    try{location.replace(PORTAL_URL);}catch(e){}
    document.body.innerHTML='<div class="wrap"><div class="card" style="text-align:center"><h2>PORTALを開いています</h2><p>開かないときは、下のボタンを押してください。</p><a class="btn" href="'+PORTAL_URL+'">PORTALを開く</a></div></div>';
    return;
  }

  var $=function(id){return document.getElementById(id)};
  var os=isIos?'ios':(isAnd?'and':'');
  var step=0;

  /* ---------- pictures (simple drawings; real screens differ a little) ---------- */
  var RING='fill="none" stroke="#e0481f" stroke-width="4"';
  function phone(inner){
    return '<svg viewBox="0 0 320 430" role="img" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">'+
    '<rect x="20" y="8" width="280" height="414" rx="36" fill="var(--ph)" stroke="var(--phs)" stroke-width="4"/>'+
    '<rect x="128" y="18" width="64" height="8" rx="4" fill="var(--ph3)"/>'+inner+'</svg>';
  }
  function txt(x,y,s,size,anchor,weight,fill){return '<text x="'+x+'" y="'+y+'" font-size="'+(size||13)+'" text-anchor="'+(anchor||'middle')+'" font-weight="'+(weight||700)+'" fill="'+(fill||'var(--ink)')+'" font-family="-apple-system,Hiragino Kaku Gothic ProN,Meiryo,sans-serif">'+s+'</text>'}
  function label(x,y,s){return '<g><rect x="'+(x-40)+'" y="'+(y-14)+'" width="80" height="24" rx="12" fill="#e0481f"/>'+txt(x,y+3,s,12.5,'middle',900,'#fff')+'</g>'}
  function shareIcon(cx,cy,c){return '<g stroke="'+(c||'var(--phs)')+'" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M'+(cx-9)+' '+(cy-2)+' h-3 v16 h24 v-16 h-3"/><path d="M'+cx+' '+(cy+8)+' v-22 M'+(cx-6)+' '+(cy-8)+' l6 -6 l6 6"/></g>'}
  function plusSquare(cx,cy){return '<g stroke="var(--phs)" stroke-width="2.6" fill="none" stroke-linecap="round"><rect x="'+(cx-11)+'" y="'+(cy-11)+'" width="22" height="22" rx="5"/><path d="M'+cx+' '+(cy-5)+' v10 M'+(cx-5)+' '+cy+' h10"/></g>'}


  function pie(cx,cy,r,a0,a1,c){var p0=[cx+r*Math.cos(a0),cy+r*Math.sin(a0)],p1=[cx+r*Math.cos(a1),cy+r*Math.sin(a1)];return '<path d="M'+cx+' '+cy+' L'+p0[0].toFixed(1)+' '+p0[1].toFixed(1)+' A'+r+' '+r+' 0 0 1 '+p1[0].toFixed(1)+' '+p1[1].toFixed(1)+' Z" fill="'+c+'"/>'}
  function safariIcon(cx,cy,r){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="#1e8cf2"/><circle cx="'+cx+'" cy="'+cy+'" r="'+(r*0.78)+'" fill="none" stroke="#fff" stroke-width="2"/><path d="M'+(cx-r*0.5)+' '+(cy+r*0.5)+' L'+(cx+r*0.12)+' '+(cy-r*0.12)+' L'+(cx+r*0.5)+' '+(cy-r*0.5)+' Z" fill="#ff3b30"/><path d="M'+(cx-r*0.5)+' '+(cy+r*0.5)+' L'+(cx-r*0.12)+' '+(cy+r*0.12)+' L'+(cx+r*0.5)+' '+(cy-r*0.5)+' Z" fill="#fff"/>'}
  function chromeIcon(cx,cy,r){var d=Math.PI/180;return pie(cx,cy,r,-150*d,-30*d,'#ea4335')+pie(cx,cy,r,-30*d,90*d,'#fbbc04')+pie(cx,cy,r,90*d,210*d,'#34a853')+'<circle cx="'+cx+'" cy="'+cy+'" r="'+(r*0.46)+'" fill="#fff"/><circle cx="'+cx+'" cy="'+cy+'" r="'+(r*0.34)+'" fill="#4285f4"/>'}
  function dock(browser){
    var s='<rect x="28" y="330" width="264" height="80" fill="var(--ph3)" opacity=".55"/>';
    var xs=[78,138,198,258];
    s+='<rect x="'+(xs[0]-24)+'" y="348" width="48" height="48" rx="12" fill="#34c759"/>'+txt(xs[0],378,'電話',11,'middle',800,'#fff');
    s+=(browser==='safari')?safariIcon(xs[1],372,24):'<rect x="'+(xs[1]-24)+'" y="348" width="48" height="48" rx="12" fill="#5ac8fa"/>';
    s+=(browser==='chrome')?chromeIcon(xs[2],372,24):'<rect x="'+(xs[2]-24)+'" y="348" width="48" height="48" rx="12" fill="#ffd60a"/>';
    s+='<rect x="'+(xs[3]-24)+'" y="348" width="48" height="48" rx="12" fill="#ff6b6b"/>';
    return s;
  }
  function keyboard(){
    var s='<rect x="28" y="236" width="264" height="174" fill="var(--ph3)"/>';
    for(var r=0;r<3;r++)for(var c=0;c<8;c++)s+='<rect x="'+(36+c*32)+'" y="'+(246+r*40)+'" width="27" height="32" rx="6" fill="var(--ph)"/>';
    s+='<rect x="36" y="366" width="60" height="34" rx="7" fill="var(--ph)"/><rect x="102" y="366" width="116" height="34" rx="7" fill="var(--ph)"/>';
    s+='<rect x="224" y="366" width="60" height="34" rx="7" fill="#0a6cff"/>'+txt(254,389,'開く',14,'middle',900,'#fff');
    s+='<rect x="218" y="360" width="72" height="46" rx="12" '+RING+'/>'+label(254,224,'ここを押す');
    return s;
  }
  var pics={
    bs1:function(){return phone(
      '<rect x="28" y="40" width="264" height="36" fill="#6c6f73"/>'+txt(160,64,'BAND',14,'middle',900,'#fff')+txt(46,64,'×',18,'start',900,'#fff')+
      '<rect x="40" y="96" width="240" height="214" rx="14" fill="var(--ph2)"/>'+
      txt(160,130,'TOP RUN',16,'middle',900)+txt(160,152,'アイコンの作りかた',13,'middle',800,'var(--muted)')+
      '<rect x="62" y="232" width="196" height="44" rx="10" fill="var(--phs)"/>'+txt(160,260,'アドレスをコピーする',14,'middle',900,'var(--ph)')+
      '<rect x="56" y="226" width="208" height="56" rx="14" '+RING+'/>'+label(160,206,'ここを押す'))},
    bs2ios:function(){return phone('<rect x="28" y="40" width="264" height="290" fill="var(--ph2)"/>'+txt(160,150,'ホーム画面',15,'middle',800,'var(--muted)')+dock('safari')+
      '<circle cx="138" cy="372" r="34" '+RING+'/>'+label(138,314,'Safari'))},
    bs2and:function(){return phone('<rect x="28" y="40" width="264" height="290" fill="var(--ph2)"/>'+txt(160,150,'ホーム画面',15,'middle',800,'var(--muted)')+dock('chrome')+
      '<circle cx="198" cy="372" r="34" '+RING+'/>'+label(198,314,'Chrome'))},
    bs3ios:function(){return phone('<rect x="28" y="40" width="264" height="370" fill="var(--ph)"/>'+txt(160,190,'Safari',18,'middle',900,'var(--muted)')+
      '<rect x="28" y="340" width="264" height="70" fill="var(--ph2)"/>'+
      '<rect x="42" y="356" width="236" height="38" rx="19" fill="var(--ph)" stroke="var(--ph3)" stroke-width="2"/>'+txt(160,380,'検索またはWebサイト名を入力',12,'middle',700,'var(--muted)')+
      '<rect x="38" y="352" width="244" height="46" rx="23" '+RING+'/>'+label(160,318,'ここを押す'))},
    bs3and:function(){return phone('<rect x="28" y="40" width="264" height="370" fill="var(--ph)"/>'+txt(160,230,'Chrome',18,'middle',900,'var(--muted)')+
      '<rect x="28" y="40" width="264" height="52" fill="var(--ph2)"/>'+
      '<rect x="42" y="50" width="236" height="34" rx="17" fill="var(--ph)" stroke="var(--ph3)" stroke-width="2"/>'+txt(160,72,'検索またはURLを入力',12,'middle',700,'var(--muted)')+
      '<rect x="38" y="46" width="244" height="42" rx="21" '+RING+'/>'+label(160,124,'ここを押す'))},
    bs4ios:function(){return phone('<rect x="28" y="40" width="264" height="370" fill="var(--ph)"/>'+
      '<rect x="28" y="340" width="264" height="70" fill="var(--ph2)"/>'+
      '<rect x="42" y="356" width="236" height="38" rx="19" fill="var(--ph)" stroke="var(--ph3)" stroke-width="2"/>'+txt(66,380,'|',16,'start',700)+
      '<rect x="92" y="296" width="136" height="42" rx="10" fill="#2b2b2b"/>'+txt(160,323,'ペースト',15,'middle',900,'#fff')+'<path d="M150 338 l10 10 l10 -10 Z" fill="#2b2b2b"/>'+
      '<rect x="86" y="290" width="148" height="54" rx="14" '+RING+'/>'+label(160,258,'ここを押す')+
      txt(160,150,'欄を指で長押しします',13,'middle',800,'var(--muted)'))},
    bs4and:function(){return phone('<rect x="28" y="40" width="264" height="370" fill="var(--ph)"/>'+
      '<rect x="28" y="40" width="264" height="52" fill="var(--ph2)"/>'+
      '<rect x="42" y="50" width="236" height="34" rx="17" fill="var(--ph)" stroke="var(--ph3)" stroke-width="2"/>'+txt(66,73,'|',16,'start',700)+
      '<rect x="80" y="96" width="136" height="42" rx="10" fill="#2b2b2b"/>'+txt(148,123,'貼り付け',15,'middle',900,'#fff')+
      '<rect x="74" y="90" width="148" height="54" rx="14" '+RING+'/>'+label(148,168,'ここを押す')+
      txt(160,230,'欄を指で長押しします',13,'middle',800,'var(--muted)'))},
    bs5:function(){return phone('<rect x="28" y="40" width="264" height="190" fill="var(--ph)"/>'+
      '<rect x="42" y="60" width="236" height="38" rx="19" fill="var(--ph2)" stroke="var(--ph3)" stroke-width="2"/>'+txt(160,84,'nuritakug-cpu.github.io/…',12,'middle',700)+
      txt(160,150,'アドレスが入っているのを見ます',13,'middle',800,'var(--muted)')+keyboard())},

    ios2:function(){return phone(
      '<rect x="38" y="40" width="244" height="30" rx="15" fill="var(--ph2)"/>'+txt(160,60,'nuritakug-cpu.github.io',12,'middle',700,'var(--muted)')+
      '<rect x="60" y="100" width="200" height="120" rx="16" fill="var(--ph2)"/>'+txt(160,166,'このページ',16,'middle',900)+
      '<rect x="28" y="352" width="264" height="58" rx="0" fill="var(--ph2)"/>'+
      '<path d="M62 372 l-8 9 l8 9" stroke="var(--phs)" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'+
      '<path d="M112 372 l8 9 l-8 9" stroke="var(--ph3)" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'+
      shareIcon(162,382)+
      '<rect x="206" y="370" width="20" height="22" rx="3" fill="none" stroke="var(--phs)" stroke-width="2.4"/>'+
      '<rect x="254" y="370" width="22" height="22" rx="4" fill="none" stroke="var(--phs)" stroke-width="2.4"/>'+
      '<circle cx="162" cy="381" r="26" '+RING+'/>'+label(162,330,'ここを押す')+
      '<path d="M162 342 v14" stroke="#e0481f" stroke-width="4" stroke-linecap="round"/>')},
    ios3:function(){return phone(
      '<rect x="28" y="40" width="264" height="370" rx="0" fill="var(--ph2)"/>'+
      '<rect x="28" y="150" width="264" height="260" rx="22" fill="var(--ph)" stroke="var(--ph3)" stroke-width="2"/>'+
      '<rect x="140" y="158" width="40" height="5" rx="3" fill="var(--ph3)"/>'+
      txt(160,190,'共有のメニュー',14,'middle',900)+
      '<rect x="44" y="206" width="232" height="38" rx="10" fill="var(--ph2)"/>'+txt(60,230,'コピー',14,'start')+
      '<rect x="44" y="252" width="232" height="38" rx="10" fill="var(--ph2)"/>'+txt(60,276,'ブックマークを追加',14,'start')+
      '<rect x="44" y="298" width="232" height="38" rx="10" fill="var(--ph2)"/>'+txt(60,322,'クイックメモに追加',14,'start')+
      '<path d="M296 150 v-70" stroke="#e0481f" stroke-width="5" stroke-linecap="round"/><path d="M286 94 l10 -14 l10 14" fill="none" stroke="#e0481f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>'+
      label(246,66,'上へ引く')+
      '<path d="M160 392 v-20" stroke="#e0481f" stroke-width="5" stroke-linecap="round"/><path d="M148 378 l12 16 l12 -16" fill="none" stroke="#e0481f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>'+
      label(160,356,'下へ動かす')+txt(160,126,'メニューが小さいときは',12,'middle',700,'var(--muted)')+txt(160,142,'指で上に引き上げます',12,'middle',700,'var(--muted)'))},
    ios4:function(){return phone(
      '<rect x="28" y="40" width="264" height="370" fill="var(--ph)"/>'+
      '<rect x="44" y="56" width="232" height="38" rx="10" fill="var(--ph2)"/>'+txt(60,80,'ブックマークを追加',14,'start')+
      '<rect x="44" y="102" width="232" height="38" rx="10" fill="var(--ph2)"/>'+txt(60,126,'クイックメモに追加',14,'start')+
      '<rect x="44" y="148" width="232" height="44" rx="10" fill="var(--ph2)"/>'+plusSquare(66,170)+txt(88,175,'ホーム画面に追加',15,'start',900)+
      '<rect x="40" y="144" width="240" height="52" rx="12" '+RING+'/>'+label(236,222,'これを押す')+

  /* ---------- steps ---------- */
  var COPYBTN='<div class="copyrow"><button class="btn" type="button" id="copyUrl">アドレスをコピーする</button><p class="done" id="copied" hidden></p><p class="urllead">ボタンで、コピーできないときは、下のアドレスを、長押しして、コピーしてください。</p><textarea class="urlbox" id="urlBox" rows="3" readonly spellcheck="false" aria-label="このページのアドレス"></textarea></div>';
  var BAND_NOTE='BANDやLINEの画面の右上の「…」の中に、「ブラウザで開く」「Safariで開く」「Chromeで開く」があれば、それを押すだけでも大丈夫です。';
  var bsteps={
    ios:[
      {t:'まず、アドレスをコピーします',p:'いま、BANDなどの中で開いています。このままでは、アイコンが作れません。いったん、Safariで開き直します。まず、このページの「アドレス」をコピーします。',extra:COPYBTN,n:BAND_NOTE,pic:'bs1'},
      {t:'「Safari」を開きます',p:'ホーム画面の「Safari」（青い、コンパスのアイコン）を押します。BANDは、閉じなくて大丈夫です。',n:'ホーム画面に戻るには、画面の一番下から、上へ軽くスワイプします（ホームボタンのある機種は、ホームボタンを押します）。',pic:'bs2ios'},
      {t:'「アドレスの欄」を押します',p:'Safariの画面の下にある、「検索またはWebサイト名を入力」と書かれた、細長い欄です。',n:'欄が上にある機種もあります。',pic:'bs3ios'},
      {t:'欄を長押しして、「ペースト」を押します',p:'欄を、指で長押しします。「ペースト」と出たら、押します。',n:'「ペーストして開く」と出たときは、それを押すだけで開きます。',pic:'bs4ios'},
      {t:'キーボードの「開く」を押します',p:'さっきコピーしたアドレスが、欄に入ったのを見ます。入ったら、キーボードの右下の青いボタン「開く」を押します。',pic:'bs5'},
      {t:'この案内が、Safariで開けたら成功です',p:'BANDの画面は、もう使いません。ここから先は、Safariの画面で進めます。',n:'下のボタンを押すと、アイコンの作りかたに進みます。',last:true,lastLabel:'アイコンの作りかたへ →'}
    ],
    and:[
      {t:'まず、アドレスをコピーします',p:'いま、BANDなどの中で開いています。このままでは、アイコンが作れません。いったん、Chromeで開き直します。まず、このページの「アドレス」をコピーします。',extra:COPYBTN,n:BAND_NOTE,pic:'bs1'},
      {t:'「Chrome」を開きます',p:'ホーム画面の「Chrome」（赤・黄・緑の丸に、青い点のアイコン）を押します。BANDは、閉じなくて大丈夫です。',n:'見つからないときは、画面を上にスワイプして、アプリの一覧から探します。',pic:'bs2and'},
      {t:'「アドレスの欄」を押します',p:'Chromeの画面の上にある、「検索またはURLを入力」と書かれた、細長い欄です。',pic:'bs3and'},
      {t:'欄を長押しして、「貼り付け」を押します',p:'欄を、指で長押しします。「貼り付け」と出たら、押します。',pic:'bs4and'},
      {t:'キーボードの右下のボタンを押します',p:'さっきコピーしたアドレスが、欄に入ったのを見ます。入ったら、キーボードの右下の「→」「移動」「Go」のどれかを押します。',pic:'bs5'},
      {t:'この案内が、Chromeで開けたら成功です',p:'BANDの画面は、もう使いません。ここから先は、Chromeの画面で進めます。',n:'下のボタンを押すと、アイコンの作りかたに進みます。',last:true,lastLabel:'アイコンの作りかたへ →'}
    ]
  };
  var steps={
    ios:[
      {t:'Safariで開いていますか？',p:'iPhoneは、「Safari」（青いコンパスのアプリ）で、アイコンを作ります。BANDやLINEの中では、作れません。',n:'この画面が、Safariで開いていれば、次へ進みます。',pic:null},
      {t:'下の「共有」ボタンを押します',p:'画面の一番下にある、「四角から上向きの矢印が出ているマーク」です。',n:'見つからないときは、画面の右下にある「…」を押すと、共有が出ることがあります。',pic:'ios2'},
      {t:'メニューを、下へ動かします',p:'白いメニューが出ます。小さいときは、指で上に引き上げます。そのあと、指で下へ動かします。',pic:'ios3'},
      {t:'「ホーム画面に追加」を押します',p:'「四角の中に＋」のマークが、目印です。',n:'見つからないときは、メニューの一番下の「さらに表示」を押します。',pic:'ios4'},
      {t:'右上の「追加」を押します',p:'名前の欄が、「TOP RUN」などになっているのを見てから、押します。',pic:'ios5'},
      {t:'アイコンができました。ブラウザを閉じます',p:'Safariの画面を閉じて、ホーム画面に戻ります。そのあと、「TOP RUN」のアイコンを押してください。PORTALにつながります。',n:'この画面では、PORTALは開きません。必ず、アイコンを押して、つないでください。Safariで、PORTALを開いて使うのは、やめてください。登録は、必ず、このアイコンから行います。<br><br>Safariの閉じかた：画面の一番下から、上へスワイプして、少し止めます。Safariの画面を、上へ飛ばします。（ホームボタンのある機種は、ホームボタンを2回押して、Safariの画面を上へ飛ばします）',pic:'ios6',last:true,lastLabel:'おわり'}
    ],
    and:[
      {t:'Chromeで開いていますか？',p:'Androidは、「Chrome」で、アイコンを作ります。BANDやLINEの中では、作れません。',n:'この画面が、Chromeで開いていれば、次へ進みます。',pic:null},
      {t:'右上の「⋮」を押します',p:'画面の右上にある、「点が縦に3つ並んだマーク」です。',pic:'and2'},
      {t:'次のどちらかを押します',p:'「ホーム画面に追加」、または、「アプリをインストール」。',n:'機種によって、「アプリをダウンロード」と出ることもあります。似た名前を探してください。',pic:'and3'},
      {t:'「追加」または「インストール」を押します',p:'確認の画面が出ます。もう一度「追加」と出たら、もう一度押します。',pic:'and4'},
      {t:'アイコンができました。ブラウザを閉じます',p:'Chromeの画面を閉じて、ホーム画面に戻ります。そのあと、「TOP RUN」のアイコンを押してください。PORTALにつながります。',n:'この画面では、PORTALは開きません。必ず、アイコンを押して、つないでください。Chromeで、PORTALを開いて使うのは、やめてください。登録は、必ず、このアイコンから行います。<br><br>アイコンが見つからないときは、画面を上にスワイプして、アプリの一覧も見てください。<br><br>Chromeの閉じかた：画面の下の「□」を押して、Chromeの画面を、上へ飛ばします。（「□」が無い機種は、画面の一番下から、上へスワイプして、少し止めます）',pic:'and5',last:true,lastLabel:'おわり'}
    ]
  };

  var card=$('card'),mode=(inApp||/[?&]band=1/.test(location.search))?'browser':'icon';
  function fallbackCopy(t){try{var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();var ok=document.execCommand('copy');document.body.removeChild(ta);return !!ok}catch(e){return false}}
  function pageUrl(){return (location.protocol==='http:'||location.protocol==='https:')?location.href.split('#')[0]:PORTAL_URL}
  function bindCopy(){
    var cb=$('copyUrl');if(!cb)return;
    var box=$('urlBox');
    if(box){
      box.value=pageUrl();
      var selectAll=function(){try{box.focus();box.select();box.setSelectionRange(0,box.value.length)}catch(e){}};
      box.addEventListener('click',selectAll);
      box.addEventListener('focus',selectAll);
    }
    cb.addEventListener('click',function(){
      var u=pageUrl();
      var done=function(ok){var d=$('copied');d.hidden=false;d.textContent=ok?'コピーしました。次へ進んでください。':'コピーできませんでした。上のアドレスを長押しして、コピーしてください。'};
      try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(u).then(function(){done(true)},function(){done(fallbackCopy(u))});return}}catch(e){}
      done(fallbackCopy(u));
    });
  }
  function render(){
    var set=(mode==='browser')?bsteps:steps;
    var list=set[os]||set.ios;
    if(step>=list.length)step=list.length-1;
    var s=list[step],total=list.length;
    var h='<span class="partlabel">'+(mode==='browser'?'手順1：ブラウザで開き直す':'手順2：アイコンを作る')+'</span>';
    h+='<div class="prog">';for(var i=0;i<total;i++)h+='<i class="'+(i<=step?'on':'')+'"></i>';h+='</div>';
    h+='<div class="stepno">'+(step+1)+' / '+total+'</div><h2>'+s.t+'</h2><p>'+s.p+'</p>';
    if(s.extra)h+=s.extra;
    if(s.pic)h+='<div class="pic">'+pics[s.pic==='bs2'?('bs2'+os):s.pic]()+'</div>';
    if(s.n)h+='<p class="note">'+s.n+'</p>';
    var nextLabel=s.last?(s.lastLabel||'おわり'):'次へ →';
    var nextOff=s.last&&mode==='icon';
    h+='<div class="nav"><button class="btn sec" type="button" id="prev"'+(step===0?' disabled':'')+'>← 戻る</button><button class="btn" type="button" id="next"'+(nextOff?' disabled':'')+'>'+nextLabel+'</button></div>';
    card.innerHTML=h;
    bindCopy();
    $('prev').addEventListener('click',function(){if(step>0){step--;render();window.scrollTo(0,0)}});
    $('next').addEventListener('click',function(){
      if(step<list.length-1){step++;render();window.scrollTo(0,0)}
      else if(mode==='browser'){mode='icon';step=0;render();window.scrollTo(0,0)}
    });
    $('tabIos').setAttribute('aria-pressed',String(os==='ios'));
    $('tabAnd').setAttribute('aria-pressed',String(os==='and'));
    $('modeLink').textContent=(mode==='browser')?'すでにSafari・Chromeで開いている方は、こちら':'BANDやLINEの中で開いている方は、こちら';
  }
  function setOs(v){os=v;step=0;render()}
  function setMode(m){mode=m;step=0;render()}
  $('tabIos').addEventListener('click',function(){setOs('ios')});
  $('tabAnd').addEventListener('click',function(){setOs('and')});
  $('modeLink').addEventListener('click',function(){setMode(mode==='browser'?'icon':'browser')});
  $('pcnote').hidden=!(!isIos&&!isAnd);
  if(!os)os='ios';

/* ---------- demo bar (only off the real site) ---------- */
  var real=(location.hostname==='nuritakug-cpu.github.io');
  if(!real||/[?&]demo=1/.test(location.search)){
    $('demo').hidden=false;
    $('demo').addEventListener('click',function(e){
      var b=e.target.closest('button[data-d]');if(!b)return;var d=b.dataset.d;
      if(d==='ios'){os='ios';step=0;render()}
      if(d==='and'){os='and';step=0;render()}
      if(d==='inapp')setMode('browser');
      if(d==='normal')setMode('icon');
    });
  }
  render();
})();
