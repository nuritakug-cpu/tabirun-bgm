<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>TOP RUN｜大会資料・更新情報</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;background:#101215;color:#f2f2ee}*{box-sizing:border-box}body{margin:0}.wrap{width:min(840px,100%);margin:auto;padding:17px 14px 80px}.brand{font-size:11px;letter-spacing:.2em;font-weight:800;color:#e2d08a}h1{font-size:24px;line-height:1.32;margin:9px 0 5px}.sub{font-size:12px;color:#c5c8cd;line-height:1.65;margin-bottom:17px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.field{background:#1d2227;border:1px solid #454c51;border-radius:10px;color:#fff;font-size:15px;padding:12px;min-width:0;flex:1}.field::placeholder{color:#acb3b6}.select{flex:0 0 130px}.info{font-size:12px;color:#d0d3d5;margin:8px 0 13px}.tabs{display:flex;gap:8px;margin:10px 0 18px}.tab{padding:9px 16px;border-radius:30px;border:1px solid #515862;background:transparent;color:#e3e5e7;font-weight:700}.tab.on{background:#e7d276;border-color:#e7d276;color:#111}.card{border:1px solid #353e45;background:#191e22;border-radius:14px;padding:15px;margin:10px 0}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:9px}.date{font-size:11px;color:#bfc3c5}.name{font-size:16px;font-weight:700;line-height:1.5;margin:5px 0}.place{font-size:12px;color:#d7d9da}.pill{font-size:10px;border-radius:20px;background:#34383a;color:#f0d980;padding:5px 9px;flex-shrink:0}.links{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}.links a{font-size:12px;color:#fff;text-decoration:none;background:#353c42;border:1px solid #4a545c;padding:9px 10px;border-radius:8px}.links a:focus-visible,.tab:focus-visible,.field:focus-visible{outline:2px solid #f0d47a}.empty{border:1px dashed #596069;padding:18px;border-radius:12px;color:#dadada;font-size:13px;line-height:1.6}.status{display:inline-block;font-size:10px;padding:2px 6px;border-radius:5px;border:1px solid #6b6c56;margin-left:6px}.error{border-color:#91615f;color:#ffcfca}.change{padding:12px 13px;border-left:3px solid #e7d276;background:#1c2024;border-radius:6px;margin:8px 0}.change strong{font-size:13px}.change small{color:#c7cbd0;display:block;margin:5px 0;line-height:1.45}.foot{font-size:11px;color:#acb5bb;line-height:1.7;margin-top:22px}.external{display:block;color:#edd998;font-size:12px;text-decoration:underline;margin-top:12px}
</style></head><body><main class="wrap"><div class="brand">TOP RUN / OFFICIAL SOURCE WATCH</div><h1>大会・資料の更新情報</h1><p class="sub">愛知陸協の公式大会一覧を整理した情報です。大会・PDFの追加や差し替えを確認します。公式情報の転載元リンクは各大会に表示します。</p><div class="bar"><input class="field" id="q" placeholder="大会名・会場で検索" aria-label="大会名・会場で検索"><select id="source" class="field select" aria-label="地区"><option value="">すべての地区</option><option value="aichi">県全体</option><option value="nagoya">名古屋</option><option value="owari">尾張</option><option value="nishimikawa">西三河</option></select></div><div class="tabs"><button class="tab on" data-tab="events">大会一覧</button><button class="tab" data-tab="changes">更新履歴</button></div><div id="status" class="info" aria-live="polite">公開情報を読み込み中…</div><section id="list"></section><p class="foot">※個人名簿の収集・出走登録の更新はこの画面では行いません。公式サイトの変更がないか確認する独立した安全な段階です。PDFの内容については各主催者の原本をご確認ください。<a class="external" href="https://www.aichi-rk.jp/01nittei.htm">愛知陸協 競技日程（公式）</a></p></main><script>
'use strict';const $=x=>document.getElementById(x);let state={events:[],changes:[],tab:'events',checkedAt:'',errors:[]};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const safeLink=url=>{try{let u=new URL(url,location.href);return /^https?:$/.test(u.protocol)?u.href:null}catch{return null}};const sources={aichi:'県全体',nagoya:'名古屋',owari:'尾張',nishimikawa:'西三河'};const types={new_event:'新しい大会',event_changed:'大会情報の変更',document_added:'資料の追加',document_replaced:'同じURLの資料が差し替え',document_link_removed:'資料リンクの削除',event_not_found:'大会行の掲載消失',event_reappeared:'大会の再掲載'};
function draw(){let q=$('q').value.trim().toLowerCase(),src=$('source').value;const data=state.tab==='events'?state.events:state.changes;const kept=data.filter(x=>(!src||(x.source||state.events.find(e=>e.id===x.eventId)?.source)===src)&&(!q||[x.name,x.venue,x.field,x.document?.label].join(' ').toLowerCase().includes(q)));$('status').textContent='最終取得：'+(state.checkedAt||'未取得')+' / '+kept.length+'件'+(state.errors.length?' / 一部の取得失敗あり':'');$('list').innerHTML=kept.length?kept.slice(0,250).map(x=>state.tab==='events'?eventCard(x):changeCard(x)).join(''):'<p class="empty">該当する情報がありません。検索条件を変更してください。</p>';}
function eventCard(e){let date=(e.dates||[]).join('、');const links=(e.documents||[]).map(d=>{let url=safeLink(d.url);return url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(d.label||d.kind)}</a>`:''}).join('');let source=safeLink(e.sourceUrl);return `<article class="card"><div class="head"><div><div class="date">${esc(date)} / ${esc(sources[e.source]||e.source)}</div><div class="name">${esc(e.name)}</div><div class="place">${esc(e.venue)}</div></div><span class="pill">${e.listingState==="not_found"?"掲載確認待ち":("資料 "+(e.documents||[]).length+"件")}</span></div><div class="links">${links}${source?`<a href="${esc(source)}" target="_blank" rel="noopener noreferrer">公式一覧ページ</a>`:''}</div></article>`}
function changeCard(c){let name=types[c.type]||c.type;let event=state.events.find(e=>e.id===c.eventId);let details=c.document?.label||c.field||'';return `<article class="change"><strong>${esc(name)}</strong><small>${esc(c.name||event?.name||'')}</small>${details?`<small>${esc(details)}</small>`:''}<small>${esc(c.at||'')}</small></article>`}
$('q').addEventListener('input',draw);$('source').addEventListener('change',draw);document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{state.tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(t=>t.classList.toggle('on',t===b));draw()}));Promise.all([fetch('data/aichi_catalog.json',{cache:'no-store'}),fetch('data/aichi_changes.json',{cache:'no-store'})]).then(async([a,b])=>{if(!a.ok||!b.ok)throw Error('資料一覧がまだ生成されていません');let c=await a.json(),d=await b.json();state.events=c.events||[];state.changes=d.changes||[];state.checkedAt=c.checkedAt;state.errors=c.errors||[];draw()}).catch(e=>{$('status').textContent='公開情報は準備中です';$('list').innerHTML='<p class="empty">自動巡回処理の初回成功後に大会一覧が表示されます。<a class="external" href="https://www.aichi-rk.jp/01nittei.htm">公式日程を開く</a></p>'});
</script></body></html>
