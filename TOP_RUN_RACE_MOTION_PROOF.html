<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TOP RUN — RACE MOTION PROOF</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#05090f;color:#f7f7f7;font-family:system-ui,-apple-system,sans-serif}main{min-height:100dvh;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;background:#0a111c;border-bottom:1px solid #263241}.brand{font-weight:900;letter-spacing:.16em;font-style:italic}.brand b{color:#f5c16c}.tag{font-size:10px;color:#9cabbf;letter-spacing:.1em}.stage{position:relative;flex:1;min-height:460px;overflow:hidden;background:#0a1220}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:absolute;left:12px;top:14px;right:12px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}.pill{background:#050a12c9;border:1px solid #53606e8a;backdrop-filter:blur(9px);padding:9px 11px;font-size:12px;letter-spacing:.06em}.pill strong{font-size:19px}.pill .red{color:#ff6e78}.pill .blue{color:#70caff}.bottom{background:#0b111c;border-top:1px solid #263241;padding:14px 16px max(16px,env(safe-area-inset-bottom));display:flex;gap:9px;align-items:center;flex-wrap:wrap}button{border:1px solid #536173;background:#1b2635;color:white;border-radius:9px;padding:12px 15px;font-weight:800}button.primary{background:#f5c16c;color:#11151c;border:0}.note{font-size:11px;color:#9aaabd;line-height:1.6;margin-left:auto;max-width:360px}.announce{position:absolute;left:0;right:0;top:39%;text-align:center;pointer-events:none;font-size:clamp(24px,8vw,74px);font-weight:1000;font-style:italic;letter-spacing:.07em;text-shadow:0 4px 25px #000,0 0 45px #f3a650aa;opacity:0;transition:opacity .2s}.announce.on{opacity:1}@media(max-width:600px){.stage{min-height:530px}.note{width:100%;max-width:none}.pill{font-size:10px}.pill strong{font-size:15px}}
</style></head><body><main><div class="top"><div class="brand">TOP <b>RUN</b> <span style="font-size:10px;color:#a6b6ca">/ RACE BATTLE</span></div><div class="tag">MOTION TEST · 01</div></div><section class="stage" id="stage"><canvas id="view"></canvas><div class="hud"><div class="pill"><span class="blue">●</span> BLUE <strong id="blue">0.0</strong>m<br><span class="red">●</span> RED <strong id="red">0.0</strong>m</div><div class="pill">1500m / <strong id="clock">0:00.0</strong><br><span id="cameraLabel">TRACKING CAMERA</span></div></div><div class="announce" id="announce">READY?</div></section><div class="bottom"><button class="primary" id="toggle">▶ START</button><button id="replay">↺ REPLAY</button><button id="cam">CAMERA / SIDE</button><button id="speed">×1</button><div class="note">独立した走行モーション検証。選手は関節を動かす2D描画です。速度・勝敗はデモ用で実記録ではありません。PORTAL・Firebase未接続。</div></div></main><script>
(()=>{'use strict';const canvas=document.getElementById('view'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage');const $=id=>document.getElementById(id);let W=0,H=0,dpr=1,run=false,t=0,last=0,cam=0,rate=1,finished=false;let leadPrev=0,flash=0;function resize(){const r=stage.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}new ResizeObserver(resize).observe(stage);resize();const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const ease=x=>x*x*(3-2*x);const blue=t=>Math.min(1500,4.65*t+Math.max(0,t-170)*.48);const red=t=>Math.min(1500,4.87*t-Math.max(0,t-90)*.27+Math.max(0,t-230)*.73);function sky(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#050b1b');g.addColorStop(.55,'#192741');g.addColorStop(1,'#302632');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<30;i++){let x=(i*83.17)%W,y=H*.13+(i%4)*8;ctx.fillStyle='rgba(255,230,190,.18)';ctx.fillRect(x,y,2,2)}const horizon=H*.52;ctx.fillStyle='#101b2b';ctx.fillRect(0,horizon-42,W,82);for(let i=0;i<Math.ceil(W/8);i++){const x=i*8;ctx.fillStyle=i%4?'#41526b':'#d6ac7b';ctx.globalAlpha=.12+(i%7)*.045;ctx.fillRect(x,horizon-30+(i%3)*6,4,2)}ctx.globalAlpha=1;for(let x of [W*.08,W*.91]){ctx.strokeStyle='#c9d5e755';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,horizon-12);ctx.lineTo(x,H*.14);ctx.stroke();ctx.fillStyle='#fff3d2';ctx.shadowColor='#d6e9ff';ctx.shadowBlur=32;for(let k=0;k<3;k++)for(let j=0;j<4;j++)ctx.fillRect(x-18+j*11,H*.14-13+k*11,7,7);ctx.shadowBlur=0}let track=ctx.createLinearGradient(0,horizon,0,H);track.addColorStop(0,'#8a4b48');track.addColorStop(1,'#412b38');ctx.fillStyle=track;ctx.fillRect(0,horizon,W,H-horizon);for(let i=0;i<6;i++){const y=horizon+(H-horizon)*i/6;ctx.strokeStyle='#f7c6a35e';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}const offset=(t*rate*80)%95;ctx.strokeStyle='#e8d8cc35';ctx.lineWidth=3;for(let i=-2;i<W/95+3;i++){let x=i*95-offset;ctx.beginPath();ctx.moveTo(x,horizon);ctx.lineTo(x-50,H);ctx.stroke()}}function capsule(x1,y1,x2,y2,w,color){ctx.strokeStyle=color;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}function runner(x,ground,scale,phase,color,accent,flip=1){ctx.save();ctx.translate(x,ground);ctx.scale(scale*flip,scale);let s=Math.sin(phase),c=Math.cos(phase),bounce=Math.abs(Math.sin(phase))*4;ctx.translate(0,-bounce);ctx.shadowColor=color;ctx.shadowBlur=18;ctx.fillStyle=color+'55';ctx.beginPath();ctx.ellipse(0,2,40,6,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;const hip=[-7,-53],shoulder=[9,-99],head=[22,-123];function leg(a,back){const hipX=hip[0],hipY=hip[1],kneeX=hipX+Math.sin(a)*29,kneeY=hipY+32+Math.cos(a)*6,footX=kneeX+Math.sin(a-1.2)*27,footY=kneeY+28-Math.cos(a)*4;capsule(hipX,hipY,kneeX,kneeY,11,back?'#29354a':color);capsule(kneeX,kneeY,footX,footY,9,back?'#29354a':color);capsule(footX,footY,footX+18,footY+2,7,accent)}leg(phase+Math.PI,true);leg(phase,false);capsule(hip[0],hip[1],shoulder[0],shoulder[1],23,color);ctx.fillStyle=accent;ctx.beginPath();ctx.moveTo(-5,-96);ctx.lineTo(17,-108);ctx.lineTo(25,-83);ctx.lineTo(1,-78);ctx.closePath();ctx.fill();function arm(a,back){const sx=shoulder[0],sy=shoulder[1],ex=sx+Math.sin(a)*22-2,ey=sy+22,fx=ex+Math.sin(a+2)*21,fy=ey-12;capsule(sx,sy,ex,ey,8,back?'#37445b':color);capsule(ex,ey,fx,fy,7,back?'#37445b':color)}arm(phase+Math.PI,true);arm(phase,false);capsule(shoulder[0],shoulder[1],head[0]-4,head[1]+11,7,color);ctx.fillStyle=color;ctx.beginPath();ctx.arc(head[0],head[1],14,0,Math.PI*2);ctx.fill();ctx.fillStyle='#08111c';ctx.beginPath();ctx.moveTo(13,-137);ctx.lineTo(22,-146);ctx.lineTo(34,-140);ctx.lineTo(32,-132);ctx.closePath();ctx.fill();ctx.restore()}function streaks(amount){ctx.save();ctx.globalAlpha=amount;for(let i=0;i<18;i++){let y=H*.48+(i*31)%(H*.47),x=(i*113-t*240*(i%3+1))%(W+250);if(x<0)x+=W+250;ctx.strokeStyle=i%2?'#8ecfff':'#ffd6ad';ctx.lineWidth=i%3+1;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-40-(i%5)*35,y);ctx.stroke()}ctx.restore()}function banner(text){const el=$('announce');el.textContent=text;el.classList.add('on');clearTimeout(banner.timer);banner.timer=setTimeout(()=>el.classList.remove('on'),1150)}function draw(){ctx.clearRect(0,0,W,H);sky();const a=blue(t),b=red(t),gap=a-b,center=W*.5;let scale=clamp(W/490,.67,1.3);let xA=center+clamp(gap*2.1,-W*.26,W*.26),xB=center-clamp(gap*2.1,-W*.26,W*.26);if(cam===1){xA=W*.28+clamp(gap*1.4,-W*.12,W*.12);xB=W*.7-clamp(gap*1.4,-W*.12,W*.12)}if(cam===2){scale*=1.3;xA=center-60+clamp(gap*1.5,-W*.14,W*.14);xB=center+60-clamp(gap*1.5,-W*.14,W*.14)}streaks(run?.45:.15);const ground=H*.80;runner(xB,ground-8,scale*.98,t*14.1+1,'#e5a29a','#ef5067');runner(xA,ground+12,scale,t*13.6,'#9dcaff','#3c8cfa');ctx.fillStyle='#080f1bdc';ctx.font='800 13px system-ui';ctx.textAlign='center';ctx.fillText('BLUE',xA,ground+32);ctx.fillText('RED',xB,ground+12);ctx.textAlign='left';const barY=H-32;ctx.fillStyle='#111a27';ctx.fillRect(14,barY,W-28,7);ctx.fillStyle='#60baff';ctx.fillRect(14,barY,(W-28)*a/1500,3);ctx.fillStyle='#fa6a70';ctx.fillRect(14,barY+4,(W-28)*b/1500,3);$('blue').textContent=a.toFixed(1);$('red').textContent=b.toFixed(1);$('clock').textContent=Math.floor(t/60)+':'+(t%60).toFixed(1).padStart(4,'0');$('cameraLabel').textContent=['TRACKING / SIDE','DUAL CAMERA','CLOSE-UP'][cam];if(flash>0){ctx.fillStyle=`rgba(255,220,175,${flash*.22})`;ctx.fillRect(0,0,W,H);flash*=.88}}function loop(now){let dt=Math.min((now-last)/1000||0,.05);last=now;if(run){let prev=t;t=Math.min(340,t+dt*rate);let sign=Math.sign(blue(t)-red(t));if(sign&&leadPrev&&sign!==leadPrev){banner('OVERTAKE!');flash=1;cam=(cam+1)%3}if(sign)leadPrev=sign;if((blue(t)>=1500&&red(t)>=1500)||t>=340){run=false;finished=true;banner(blue(t)>red(t)?'BLUE WINS':'RED WINS');$('toggle').textContent='▶ START'}}draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);$('toggle').onclick=()=>{if(finished){t=0;finished=false;leadPrev=0}run=!run;$('toggle').textContent=run?'Ⅱ PAUSE':'▶ START';if(run&&t<1)banner('RACE START')};$('replay').onclick=()=>{t=0;run=false;finished=false;leadPrev=0;cam=0;$('toggle').textContent='▶ START';banner('READY?')};$('cam').onclick=()=>{cam=(cam+1)%3;$('cam').textContent=['CAMERA / SIDE','CAMERA / DUAL','CAMERA / CLOSE'][cam]};$('speed').onclick=()=>{rate=rate===1?3:rate===3?10:1;$('speed').textContent='×'+rate};})();
</script></body></html>
