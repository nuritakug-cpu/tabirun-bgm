", "速さや局面によって適した傾きは変わる。", "posture"], ["目線と頭の位置", "目線を下げすぎず、首を力ませない", "視線だけで走力が決まるわけではない。", "posture"], ["骨盤は走りの土台", "上半身と脚をつなぐ中心", "過度な反り腰や丸まりに気づこう。", "posture"], ["接地とは？", "足が地面に触れている時間", "走るたびに「支える」と「押す」が起きる。", "contact"], ["接地の３つの場面", "着地 → 支持 → 離地", "実際には連続した動き。止まった形ではない。", "contact"], ["地面から受ける力", "地面を押すと、地面から反力を受ける", "上下だけでなく前後方向の力も関わる。", "force"], ["足はどこに着く？", "体から遠すぎる着地に注目", "足の位置だけで良し悪しは決められない。", "contact"], ["ブレーキが大きい接地", "前方への着地では減速方向の力が生じる", "接地位置と速度、脚の動きを合わせて考える。", "force"], ["かかと？ つま先？", "接地部位だけで速さは決まらない", "無理に接地方法を変えると負担が増える場合もある。", "choice"], ["接地時間とは？", "地面に触れている時間は一定ではない", "速さ・個人差・疲労で変化する。", "contact"], ["脚は後ろに流れる？", "離地した脚は、次の一歩へ戻る", "後ろへ大きく蹴ることだけを目標にしない。", "cycle"], ["脚の切り替え", "片脚が支える間に、もう片脚が前へ", "左右の脚は役割を交代し続ける。", "cycle"], ["膝を高く上げれば速い？", "膝の高さだけでは評価できない", "前への移動とタイミングを一緒に見る。", "choice"], ["足首の働き", "着地の衝撃を受け、離地に関わる", "足首を常に固める必要はない。", "force"], ["腕振りは何のため？", "脚や体幹の回転を調整する", "腕を大きく振れば必ず速くなるわけではない。", "arms"], ["肩の力みを減らす", "必要以上の力を入れずに腕を動かす", "肩・肘・手の緊張を観察してみよう。", "arms"], ["左右のバランス", "腕と脚は連動して動く", "左右差があっても、すべてが異常ではない。", "arms"], ["ちょっと考えてみよう", "「歩幅を大きく」と言われたら？", "前に足を伸ばすことと、前へ進むことは同じではない。", "break"], ["ストライドを決めるもの", "速度・力・接地・空中での動き", "歩幅だけを無理に広げない。", "formula"], ["ピッチを決めるもの", "脚の切り替えと一歩にかかる時間", "ただ急いで足を動かすだけではない。", "formula"], ["速さを数字で考える", "150cm × 180歩/分 = 270m/分", "これは時速16.2km。数字は説明用の例。", "numbers"], ["同じ速さの２人", "A：150cm × 180歩　B：135cm × 200歩", "どちらも270m/分。優劣はこれだけでは決まらない。", "compare"], ["速さが上がると？", "ピッチもストライドも変わり得る", "変化の割合は個人と速度によって違う。", "chart"], ["フォームとエネルギー", "走る動きには筋肉の仕事が必要", "無駄を減らす工夫は、単純な見た目では測れない。", "four"], ["ランニングエコノミー", "一定速度で走るときのエネルギー消費", "同じ速さでも必要な酸素量などに差がある。", "chart"], ["「きれいなフォーム」なら省エネ？", "見た目と効率は必ずしも一致しない", "映像だけでエネルギー効率を断定しない。", "choice"], ["疲れると何が変わる？", "接地・姿勢・リズムが変化することがある", "全員に同じ変化が起きるわけではない。", "cycle"], ["後半のフォームを観察", "序盤と終盤の映像を比べよう", "一歩の長さ・回数・体の傾きを見比べる。", "compare"], ["痛みがあるときは？", "痛みを我慢してフォームを直さない", "練習を中断し、担当者や医療専門職に相談する。", "warning"], ["ドリルは何のため？", "動きの感覚をつかむ練習", "ドリルの形を、そのまま走りに当てはめない。", "four"], ["ドリル① リズム", "短い距
