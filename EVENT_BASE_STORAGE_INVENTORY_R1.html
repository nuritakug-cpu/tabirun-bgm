<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EVENT BASE Storage Inventory</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#0d1012;color:#f5f6f7;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}
main{max-width:760px;margin:auto}
.card{background:#171b1f;border:1px solid #353c42;border-radius:16px;padding:16px;margin:12px 0}
h1{font-size:25px;margin:6px 0 10px}
p{color:#b8c0c6;line-height:1.6}
.summary{padding:12px;border-radius:10px;background:#0b0e10;border:1px solid #3e464d;white-space:pre-wrap;line-height:1.55}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid #2c3237;vertical-align:top}
td:nth-child(2),th:nth-child(2){text-align:right;white-space:nowrap}
code{word-break:break-all}
button{width:100%;padding:13px;border:0;border-radius:11px;background:#ffd400;color:#080808;font-weight:900;font-size:16px;margin-top:12px}
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>localStorage 容量監査</h1>
    <p>読み取り専用です。削除・追加・変更は一切しません。</p>
    <div id="summary" class="summary">確認中…</div>
    <button id="copy">結果をコピー</button>
  </div>
  <div class="card">
    <strong>localStorage 大きい順</strong>
    <table>
      <thead><tr><th>キー</th><th>概算サイズ</th></tr></thead>
      <tbody id="localRows"></tbody>
    </table>
  </div>
  <div class="card">
    <strong>sessionStorage 大きい順</strong>
    <table>
      <thead><tr><th>キー</th><th>概算サイズ</th></tr></thead>
      <tbody id="sessionRows"></tbody>
    </table>
  </div>
</main>
<script>
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(n){
  if(n>=1024*1024)return (n/1024/1024).toFixed(2)+' MB';
  if(n>=1024)return (n/1024).toFixed(1)+' KB';
  return n+' B';
}
function inspectStore(store){
  const items=[];
  let total=0;
  try{
    for(let i=0;i<store.length;i++){
      const k=store.key(i);
      let v='';
      try{v=store.getItem(k)||''}catch(e){v=''}
      const bytes=(String(k).length+String(v).length)*2;
      total+=bytes;
      items.push({key:k,bytes});
    }
  }catch(e){
    return {error:String(e?.name||e?.code||e),items:[],total:0,count:0};
  }
  items.sort((a,b)=>b.bytes-a.bytes);
  return {items,total,count:items.length,error:''};
}
function render(id,data){
  const el=$(id);
  el.innerHTML=data.items.slice(0,50).map(x=>
    `<tr><td><code>${esc(x.key)}</code></td><td>${fmt(x.bytes)}</td></tr>`
  ).join('') || '<tr><td colspan="2">なし</td></tr>';
}
const local=inspectStore(localStorage);
const session=inspectStore(sessionStorage);
render('localRows',local);
render('sessionRows',session);

const eventItems=local.items.filter(x=>/^tabirun_eventbase_event_/i.test(x.key));
const oldKeys=local.items.filter(x=>/v\d+|test|diag|prototype|backup|legacy/i.test(x.key));
const top=local.items[0];

$('summary').textContent=[
  `localStorage: ${fmt(local.total)} / ${local.count} keys`,
  `sessionStorage: ${fmt(session.total)} / ${session.count} keys`,
  `EVENT BASE大会データキー: ${eventItems.length}件 / ${fmt(eventItems.reduce((s,x)=>s+x.bytes,0))}`,
  `旧版・テストらしきキー: ${oldKeys.length}件 / ${fmt(oldKeys.reduce((s,x)=>s+x.bytes,0))}`,
  top ? `最大キー: ${top.key} / ${fmt(top.bytes)}` : '最大キー: なし',
  '',
  '※このページは書き込みをしていません。'
].join('\n');

$('copy').onclick=async()=>{
  const lines=[
    'EVENT BASE STORAGE INVENTORY R1',
    $('summary').textContent,
    '',
    'LOCAL TOP:',
    ...local.items.slice(0,50).map(x=>`${x.key}\t${x.bytes}\t${fmt(x.bytes)}`),
    '',
    'SESSION TOP:',
    ...session.items.slice(0,30).map(x=>`${x.key}\t${x.bytes}\t${fmt(x.bytes)}`)
  ];
  const text=lines.join('\n');
  try{
    await navigator.clipboard.writeText(text);
    $('copy').textContent='コピーしました';
    setTimeout(()=>$('copy').textContent='結果をコピー',1500);
  }catch(e){
    prompt('この内容をコピーしてください',text);
  }
};
</script>
</body>
</html>
