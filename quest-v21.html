<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#062637">
<title>知多半島 旅ラン QUEST｜V21 GPS</title>

<style>
html,body{
  margin:0;
  min-height:100%;
  background:#031b27;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
}

.loading{
  min-height:100vh;
  display:grid;
  place-items:center;
  text-align:center;
  padding:24px;
  box-sizing:border-box;
}

.loading b{
  display:block;
  font-size:24px;
  margin-bottom:10px;
}

.loading span{
  font-size:12px;
  line-height:1.8;
  color:#bdd6df;
}
</style>
</head>

<body>

<div class="loading" id="loader">
  <div>
    <b>旅ラン QUEST V21</b>
    <span>GPS・サウンド安定版を読み込んでいます…</span>
  </div>
</div>

<script>
(async()=>{

  const res=await fetch(
    './quest-v19.html?v=20260829-v21-nowav',
    {
      cache:'no-store'
    }
  );

  if(!res.ok){
    throw new Error(
      'V19 base load failed: '+res.status
    );
  }

  let html=await res.text();


  /* ==============================
     VERSION
  ============================== */

  html=html.replaceAll(
    'V19 GPS',
    'V21 GPS'
  );

  html=html.replaceAll(
    'tabirunQuestV19',
    'tabirunQuestV21'
  );

  html=html.replaceAll(
    'tabirunSoundV19',
    'tabirunSoundV21'
  );

  html=html.replaceAll(
    'tabirunLastGpsV19',
    'tabirunLastGpsV21'
  );


  /* ==============================
     BGM音量

     1曲目 0.010
     2曲目 0.00035
     3曲目 0.160
     4曲目 0.075
  ============================== */

  const bgmRe=
    /const\s+BGM_VOL\s*=\s*\{[\s\S]*?\};/;

  if(
    !bgmRe.test(
      html
    )
  ){
    throw new Error(
      'BGM設定が見つかりません'
    );
  }

  html=html.replace(
    bgmRe,
    "const BGM_VOL={bright:.010,history:.00035,sea:.160,finish:.075};"
  );


  /* ==============================
     SECTION 2

     美浜オレンジライン
        ↓
     オレンジ広場
  ============================== */

  html=html.replaceAll(
    "next:'美浜オレンジライン'",
    "next:'オレンジ広場'"
  );

  html=html.replaceAll(
    "name:'美浜オレンジライン'",
    "name:'オレンジ広場'"
  );

  html=html.replaceAll(
    'ロードから緑の世界へ。旅ラン中盤戦に突入！アップダウンも、この旅の景色のひとつ。',
    'オレンジ広場まで到達！ここからオレンジラインの中盤へ。アップダウンも、この旅の景色のひとつ。'
  );


  /* ==============================
     iPhone用
     AudioContext安定処理
  ============================== */

  const toneMark=
    /function\s+tone\s*\(/;

  if(
    !toneMark.test(
      html
    )
  ){
    throw new Error(
      '効果音設定が見つかりません'
    );
  }

  html=html.replace(
    toneMark,
`function withAudioReady(fn){

  if(!soundOn){
    return;
  }

  let c;

  try{

    if(!ctx){

      ctx=new(
        window.AudioContext
        ||
        window.webkitAudioContext
      )();

    }

    c=ctx;

  }
  catch(e){

    return;

  }


  const run=()=>{

    try{

      fn(c);

    }
    catch(e){}

  };


  if(
    c.state==='running'
  ){

    run();

    return;

  }


  try{

    const p=
      c.resume();

    if(
      p
      &&
      p.then
    ){

      p
        .then(
          run
        )
        .catch(
          ()=>{}
        );

    }
    else{

      setTimeout(
        run,
        0
      );

    }

  }
  catch(e){}

}


function tone(`
  );


  /* ==============================
     STAGE CLEAR 効果音

     大きな衝撃音
     ＋
     クリアファンファーレ
  ============================== */

  const clearRe=
    /function\s+playStageClearNow\s*\(\s*\)\s*\{[\s\S]*?(?=\n\s*\/\*\s*IMPORTANT:\s*user tap direct stamp impact\s*\*\/|\n\s*function\s+playStampNow\s*\()/;

  if(
    !clearRe.test(
      html
    )
  ){
    throw new Error(
      'STAGE CLEAR効果音設定が見つかりません'
    );
  }

  html=html.replace(
    clearRe,
`function playStageClearNow(){

  stopBgm();

  withAudioReady(
    c=>{

      const t=
        c.currentTime;


      /* 強い最初の衝撃 */

      impact(
        .92
      );

      noiseHit(
        .50,
        .22
      );


      /* 低音 */

      tone(
        70,
        t,
        .38,
        'square',
        .48
      );

      tone(
        105,
        t+.025,
        .32,
        'sine',
        .40
      );

      tone(
        196,
        t+.08,
        .28,
        'square',
        .32
      );


      /* CLEARファンファーレ */

      tone(
        392,
        t+.16,
        .32,
        'triangle',
        .38
      );

      tone(
        523,
        t+.30,
        .38,
        'sine',
        .43
      );

      tone(
        659,
        t+.46,
        .42,
        'triangle',
        .46
      );

      tone(
        784,
        t+.63,
        .48,
        'sine',
        .48
      );

      tone(
        1047,
        t+.84,
        .76,
        'triangle',
        .54
      );

      tone(
        1319,
        t+1.00,
        .60,
        'sine',
        .40
      );

    }
  );

}
`
  );


  /* ==============================
     STAMP 効果音

     大きな「ドン！」
     ＋
     獲得音
  ============================== */

  const stampRe=
    /function\s+playStampNow\s*\(\s*\)\s*\{[\s\S]*?(?=\n\s*function\s+sFinalFanfare\s*\()/;

  if(
    !stampRe.test(
      html
    )
  ){
    throw new Error(
      'スタンプ効果音設定が見つかりません'
    );
  }

  html=html.replace(
    stampRe,
`function playStampNow(){

  withAudioReady(
    c=>{

      const t=
        c.currentTime;


      /* 強いスタンプ「ドン！」 */

      impact(
        1.00
      );

      noiseHit(
        .62,
        .20
      );


      /* 印面衝撃 */

      tone(
        48,
        t,
        .38,
        'square',
        .56
      );

      tone(
        72,
        t+.018,
        .34,
        'sine',
        .48
      );

      tone(
        105,
        t+.055,
        .28,
        'triangle',
        .38
      );


      /* STAMP GET */

      tone(
        392,
        t+.20,
        .24,
        'triangle',
        .30
      );

      tone(
        587,
        t+.32,
        .30,
        'sine',
        .37
      );

      tone(
        880,
        t+.46,
        .48,
        'triangle',
        .46
      );

      tone(
        1175,
        t+.62,
        .42,
        'sine',
        .36
      );

    }
  );

}
`
  );


  /* ==============================
     iPhone

     指が画面に触れた時点で
     AudioContextを起動
  ============================== */

  const insertAt=
    "document.addEventListener(\n  'pointerdown'";

  const insertAtMin=
    "document.addEventListener('pointerdown'";


  const unlock=
`document.addEventListener(
  'pointerdown',
  ()=>{

    if(!soundOn){
      return;
    }

    try{

      if(!ctx){

        ctx=new(
          window.AudioContext
          ||
          window.webkitAudioContext
        )();

      }

      if(
        ctx.state==='suspended'
      ){

        const p=
          ctx.resume();

        if(
          p
          &&
          p.catch
        ){

          p.catch(
            ()=>{}
          );

        }

      }

    }
    catch(e){}

  },
  {
    capture:true
  }
);


`;


  if(
    html.includes(
      insertAt
    )
  ){

    html=html.replace(
      insertAt,
      unlock+
      insertAt
    );

  }
  else if(
    html.includes(
      insertAtMin
    )
  ){

    html=html.replace(
      insertAtMin,
      unlock+
      insertAtMin
    );

  }
  else{

    throw new Error(
      'タップ音声解除設定が見つかりません'
    );

  }


  /* ==============================
     V21表示
  ============================== */

  document.open();

  document.write(
    html
  );

  document.close();


})()
.catch(
  err=>{

    console.error(
      err
    );

    document
      .getElementById(
        'loader'
      )
      .innerHTML=
        '<div>'
        +
        '<b>V21を読み込めませんでした</b>'
        +
        '<span>'
        +
        String(
          err.message
          ||
          err
        )
        +
        '</span>'
        +
        '</div>';

  }
);
</script>

</body>
</html>
