:root{--lime:#d9ff4a;--bg:#05070c;--pan:rgba(8,11,18,.86);--line:rgba(255,255,255,.14);--mut:#9aa4b4;--cond:'BarlowC','Barlow Condensed','Arial Narrow',sans-serif;--ja:'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif;--u:calc(min(100vw,560px)/100)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:#fff;font-family:var(--ja)}
body{background:#000 var(--bgimg) center top/cover no-repeat fixed}
body:before{content:'';position:fixed;inset:0;background:linear-gradient(180deg,rgba(2,4,9,.55),rgba(2,4,9,.82) 40%,rgba(2,4,9,.94));pointer-events:none}
.app{position:relative;max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.hd{display:flex;align-items:center;justify-content:space-between;padding:4px 0 10px}
.logo{font:italic 700 15px/1 var(--cond);letter-spacing:.14em;color:#cfd5de}.logo b{color:var(--lime)}
.ttl{font:italic 700 calc(var(--u)*10.5)/.9 var(--cond);letter-spacing:.02em;margin:6px 0 2px;transform:skewX(-6deg)}.ttl em{font-style:normal;color:var(--lime)}
.sub{font-size:12px;color:var(--mut);margin-bottom:12px}
.rail{display:flex;gap:4px;margin-bottom:12px}.rail button{flex:1;padding:7px 0 6px;transform:skewX(-12deg);background:rgba(255,255,255,.06);border:1px solid var(--line);text-align:center}
.rail button span{display:block;transform:skewX(12deg);font:italic 700 10px/1 var(--cond);letter-spacing:.12em;color:var(--mut)}.rail button i{display:block;transform:skewX(12deg);font-style:normal;font-size:11px;margin-top:3px;color:#cfd5de}
.rail button.on{background:var(--lime);border-color:var(--lime)}.rail button.on span,.rail button.on i{color:#05070c}.rail button.done span{color:var(--lime)}
.sec{flex:1}.h2{font:italic 700 22px/1 var(--cond);letter-spacing:.06em;margin:4px 0 10px}.h2 small{font:600 12px/1 var(--ja);color:var(--mut);margin-left:8px;letter-spacing:0}
.dist{display:grid;gap:8px}.dist button{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border:1px solid var(--line);background:var(--pan);transform:skewX(-8deg)}
.dist button b{transform:skewX(8deg);font:italic 700 34px/1 var(--cond)}.dist button span{transform:skewX(8deg);font-size:12px;color:var(--mut);text-align:right}
.dist button.on{border-color:var(--lime);box-shadow:inset 0 0 0 1px var(--lime)}.dist button.on b{color:var(--lime)}
.picked{display:flex;gap:6px;flex-wrap:wrap;min-height:30px;margin-bottom:8px}.picked span{padding:5px 9px;background:var(--lime);color:#05070c;font-size:12px;font-weight:700;transform:skewX(-10deg)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tile{position:relative;padding:8px 2px 7px;background:var(--pan);border:1px solid var(--line);text-align:center;min-height:74px}
.tile .em{font-size:26px;line-height:1.2;display:block}.tile .nm{display:block;font-size:10.5px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tile .mx{display:block;font:italic 700 12px/1 var(--cond);color:var(--mut);margin-top:3px}
.tile.on{border-color:var(--lime);box-shadow:inset 0 0 0 1px var(--lime)}.tile.on .mx{color:var(--lime)}.tile .ck{position:absolute;top:3px;right:4px;font:italic 700 12px/1 var(--cond);color:var(--lime)}
.tile.me{grid-column:span 4;display:flex;align-items:center;gap:10px;padding:8px 12px;text-align:left;min-height:0}
.tile.me .em{font-size:24px}.tile.me .nm{font-size:13px}.tsel{display:flex;gap:4px;align-items:center;margin-left:auto;font-size:12px;color:var(--mut)}
select{background:#0b0f17;color:#fff;border:1px solid var(--line);padding:6px 4px;font:600 14px var(--ja)}
.next{position:sticky;bottom:0;margin-top:12px;padding:10px 0 0;background:linear-gradient(transparent,#05070c 40%)}
.go{width:100%;padding:15px;background:var(--lime);color:#05070c;font:italic 700 22px/1 var(--cond);letter-spacing:.12em;transform:skewX(-10deg);box-shadow:0 0 24px rgba(217,255,74,.35)}
.go small{font:700 13px var(--ja);letter-spacing:0;margin-left:8px}.go:disabled{background:#2a2f38;color:#5e6672;box-shadow:none}
.ghost{display:block;width:100%;margin-top:8px;padding:11px;border:1px solid var(--line);font-size:13px;color:#cfd5de;transform:skewX(-10deg)}
.note{font-size:10.5px;color:#7d8797;margin-top:8px;line-height:1.5}
/* VS */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cards.n3 .card:first-child{grid-column:span 2}
.card{position:relative;border:1.5px solid rgba(255,255,255,.35);background:#070a10;overflow:hidden;transform:skewX(-4deg);aspect-ratio:3/4.3}
.card>*{transform:skewX(4deg)}
.card .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*22);background:radial-gradient(ellipse at 50% 35%,#1e2a3f,#070a10 70%)}
.cards.n3 .card,.cards.n4 .card{aspect-ratio:1/1.05}.cards.n3 .card:first-child{aspect-ratio:2/1.05}.cards.n3 .card .ph,.cards.n4 .card .ph{font-size:calc(var(--u)*16)}
.card .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55),transparent 28%,transparent 45%,rgba(0,0,0,.92) 78%);transform:none}
.card .top{position:absolute;left:10px;right:10px;top:8px;z-index:2}
.card .en{font:italic 700 calc(var(--u)*5.4)/1 var(--cond);letter-spacing:.04em}.card .ja{font-size:12px;font-weight:700;color:#cfd5de;margin-top:3px}
.card .bt{position:absolute;left:10px;right:10px;bottom:9px;z-index:2}
.card .ms{font:italic 700 10px/1 var(--cond);letter-spacing:.16em;color:var(--lime)}
.card .mv{font:italic 700 calc(var(--u)*12)/.9 var(--cond);color:#fff;text-shadow:0 0 18px rgba(217,255,74,.35)}.card .mv small{font-size:.38em;margin-left:3px;color:#cfd5de}
.cards.n3 .card .mv,.cards.n4 .card .mv{font-size:calc(var(--u)*9)}
.card .hp{margin-top:6px}.hp em{font-style:normal;font-size:10px;color:#cfd5de}.hp b{float:right;font:italic 700 13px/1 var(--cond);color:var(--cc)}
.hp i{display:block;clear:both;height:8px;margin-top:3px;border:1.5px solid rgba(255,255,255,.75);background:rgba(0,0,0,.55);position:relative;overflow:hidden}
.hp i:before{content:'';position:absolute;inset:0;width:var(--w);background:var(--cc);box-shadow:0 0 10px var(--cc)}
.card .det{position:absolute;right:8px;top:8px;z-index:3;padding:4px 7px;border:1px solid rgba(255,255,255,.4);font:italic 700 10px/1 var(--cond);letter-spacing:.1em;background:rgba(0,0,0,.5)}
.card.pick{border-color:var(--lime);box-shadow:0 0 0 2px var(--lime),0 0 28px rgba(217,255,74,.45)}
.card.pick:before{content:'WIN?';position:absolute;z-index:3;left:50%;top:44%;transform:translate(-50%,-50%) skewX(-8deg);padding:4px 12px;background:var(--lime);color:#05070c;font:italic 700 20px/1 var(--cond);letter-spacing:.1em}
.vsq{text-align:center;margin:12px 0 4px;font:italic 700 18px/1 var(--cond);letter-spacing:.08em}.vsq small{display:block;font:600 11px/1.4 var(--ja);color:var(--mut);margin-top:4px;letter-spacing:0}
.rec{display:flex;justify-content:center;gap:12px;font-size:11px;color:var(--mut);margin-top:6px}.rec b{color:#fff;font:italic 700 14px var(--cond)}
/* modal */
.mod{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center}
.mod>div{width:min(560px,100%);max-height:88dvh;overflow:auto;background:#0a0e16;border-top:2px solid var(--lime);padding:16px 16px max(18px,env(safe-area-inset-bottom))}
.mod h3{font:italic 700 26px/1 var(--cond)}.mod h3 small{font:700 13px var(--ja);margin-left:8px;color:#cfd5de}
.mod .sp{font-size:11px;color:var(--mut);margin:4px 0 10px}.mod p{font-size:13px;line-height:1.6;margin:8px 0}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:5px 8px;align-items:center;font-size:12px}.bars i{height:7px;background:rgba(255,255,255,.1);position:relative}.bars i:before{content:'';position:absolute;inset:0;width:var(--w);background:var(--lime)}
.bars b{font:italic 700 13px var(--cond)}
.tag{display:inline-block;padding:2px 6px;margin-right:4px;font:italic 700 10px/1.2 var(--cond);letter-spacing:.08em;border:1px solid var(--line)}
.tag.MEASURED{color:#05070c;background:var(--lime);border-color:var(--lime)}.tag.REFERENCE{color:#fff;border-color:#fff}.tag.MODEL,.tag.UNVERIFIED{color:#9aa4b4}
.src{font-size:11px;line-height:1.5;color:#b9c2cf;margin-top:6px}.src a{color:#cfe8ff}
/* race */
#race{position:fixed;inset:0;z-index:20;background:#03060b;display:none}
#race.on{display:block}#rcv{position:absolute;inset:0;width:100%;height:100%}
.lb{position:absolute;left:max(8px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));z-index:2;display:grid;gap:4px;width:min(360px,calc(100% - 16px))}
.lbh{display:flex;align-items:center;gap:8px}.lbh .live{padding:4px 8px;background:#e52b3a;font:italic 700 12px/1 var(--cond);letter-spacing:.1em}.lbh .tm{font:italic 700 30px/1 var(--cond);text-shadow:0 2px 6px #000}.lbh .ds{font:italic 700 12px var(--cond);color:var(--mut)}
.row{display:grid;grid-template-columns:22px 26px 1fr auto;align-items:center;gap:6px;padding:4px 8px 5px 0;background:rgba(6,9,15,.82);border:1px solid var(--line);transform:skewX(-8deg)}
.row>*{transform:skewX(8deg)}.row .rk{align-self:stretch;display:flex;align-items:center;justify-content:center;background:#ffd34a;color:#05070c;font:italic 700 15px var(--cond)}
.row.me .rk{background:var(--lime)}.row .ic{font-size:19px;text-align:center}.row .nm{min-width:0}.row .nm b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm .st{display:inline-block;margin-top:2px;padding:1px 5px;font-size:10px;font-weight:700;background:rgba(255,255,255,.12)}.row .nm .st.hot{background:var(--lime);color:#05070c}.row .nm .st.bad{background:#ff6a4a;color:#05070c}.row .nm .st.stop{background:#ffd34a;color:#05070c}
.row .vv{text-align:right}.row .vv b{font:italic 700 20px/1 var(--cond)}.row .vv small{font:italic 600 10px var(--cond);color:var(--mut)}.row .vv em{display:block;font:italic 600 11px/1.2 var(--cond);color:#cfd5de;font-style:italic}
.row .sta{grid-column:3/5;height:4px;background:rgba(255,255,255,.12);position:relative;margin-top:2px}.row .sta:before{content:'';position:absolute;inset:0;width:var(--w);background:var(--c)}
.tick{position:absolute;left:10px;right:10px;bottom:calc(62px + env(safe-area-inset-bottom));z-index:2;display:flex;align-items:stretch;background:rgba(6,9,15,.9);border:1px solid var(--line);min-height:38px}
.tick b{display:flex;align-items:center;padding:0 10px;background:var(--lime);color:#05070c;font:italic 700 13px var(--cond);letter-spacing:.1em}.tick span{display:flex;align-items:center;padding:6px 10px;font-size:13px;font-weight:700;line-height:1.35}
.tick span.new{animation:tk .35s}@keyframes tk{0%{opacity:0;transform:translateY(6px)}100%{opacity:1}}
.ctl{position:absolute;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:2;display:flex;gap:6px}
.ctl button{height:42px;min-width:46px;padding:0 10px;background:rgba(6,9,15,.85);border:1px solid var(--line);font:italic 700 15px var(--cond);transform:skewX(-10deg)}.ctl button.on{background:var(--lime);color:#05070c}.ctl .sk{margin-left:auto}
.fin{position:absolute;left:0;right:0;top:40%;z-index:3;display:none;justify-content:center;pointer-events:none}.fin.on{display:flex}
.fin div{padding:12px 30px;background:var(--lime);color:#05070c;font:italic 700 44px/1 var(--cond);letter-spacing:.06em;transform:skewX(-10deg);animation:fi .5s cubic-bezier(.2,1.4,.4,1)}@keyframes fi{0%{transform:skewX(-10deg) scaleX(0)}100%{transform:skewX(-10deg)}}
.lim{position:absolute;right:10px;top:max(8px,env(safe-area-inset-top));z-index:2;padding:4px 8px;font:italic 700 11px var(--cond);color:var(--mut);background:rgba(6,9,15,.8);border:1px solid var(--line)}
/* result */
.board{margin-top:4px;padding:14px 14px 16px;background:radial-gradient(rgba(70,90,60,.33) .8px,transparent 1px) 0 0/4px 4px,#06090a;border:4px solid #262a30;box-shadow:0 0 0 1px #000,0 10px 30px rgba(0,0,0,.6)}
.board .bh{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid rgba(217,255,74,.6);padding-bottom:6px;margin-bottom:6px}
.board .bh b{font:italic 700 30px/1 var(--cond);color:var(--lime);letter-spacing:.12em;text-shadow:0 0 10px rgba(217,255,74,.8)}.board .bh span{font:italic 600 16px var(--cond)}
.br{display:grid;grid-template-columns:26px 26px 1fr auto;gap:6px;align-items:center;padding:6px 0;border-bottom:1px dashed rgba(255,255,255,.1)}
.br i{font:italic 700 22px var(--cond);font-style:italic}.br .ic{font-size:20px}.br b{font-size:14px}.br small{display:block;font-size:10.5px;color:var(--mut);font-weight:400}.br em{font:italic 700 24px var(--cond);font-style:italic;color:var(--lime);text-align:right}.br em.dnf{color:#ff8a6a;font-size:15px}
.pred{margin:10px 0;padding:10px 12px;text-align:center;font:italic 700 22px var(--cond);letter-spacing:.06em;transform:skewX(-8deg)}.pred.ok{background:var(--lime);color:#05070c}.pred.ng{background:#3a1b1b;color:#ffb3a1;border:1px solid #ff6a4a}.pred small{display:block;font:600 11px var(--ja);letter-spacing:0;margin-top:3px}
.why{padding:12px;border-left:3px solid var(--lime);background:rgba(255,255,255,.04);font-size:13.5px;line-height:1.7;margin:10px 0}.why b{color:var(--lime)}
.tbl{width:100%;border-collapse:collapse;font-size:12px;margin:6px 0}.tbl th,.tbl td{padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.08);text-align:right;white-space:nowrap}.tbl th:first-child,.tbl td:first-child{text-align:left;color:var(--mut);font-weight:400}.tbl th{font-size:11px;color:#cfd5de}
.tbl td b{font:italic 700 15px var(--cond)}
.chart{width:100%;height:170px;display:block;background:rgba(255,255,255,.03);border:1px solid var(--line);margin:4px 0 2px}
.lg{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:#cfd5de;margin-bottom:8px}.lg span:before{content:'';display:inline-block;width:12px;height:3px;margin-right:4px;vertical-align:middle;background:var(--c)}
.h3{font:italic 700 15px/1 var(--cond);letter-spacing:.1em;color:var(--lime);margin:16px 0 6px}
.learn{font-size:12px;line-height:1.6;color:#cfd5de;padding:10px 12px;border:1px solid var(--line);margin-top:10px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.btns .go{font-size:16px;padding:13px}.btns .ghost{margin:0}
</style></head>

<script>/* ===== ANIMAL BATTLE：シミュレーションエンジン（描画なし・固定刻み0.1秒・シード乱数） =====

function radar(cv,sets){const x=cv.getContext('2d'),W=cv.width,H=cv.height,cx=W/2,cy=H/2+6,R=H*.38,K=[['speed','最高速度'],['accel','加速力'],['endurance','持久力'],['recovery','回復力'],['focus','集中力'],['stability','安定性']];

  const P=(i,r)=>[cx+Math.sin(i/6*Math.PI*2)*r,cy-Math.cos(i/6*Math.PI*2)*r];
  for(let g=1;g<=4;g++){x.beginPath();for(let i=0;i<6;i++){const[p,q]=P(i,R*g/4);i?x.lineTo(p,q):x.moveTo(p,q)}x.closePath();x.strokeStyle='rgba(255,255,255,.14)';x.stroke()}
  K.forEach(([k,l],i)=>{const[p,q]=P(i,R+22);x.fillStyle='#cfd5de';x.fillText(l,p,q)});
  sets.slice().reverse().forEach(s=>{x.beginPath();K.forEach(([k],i)=>{const[p,q]=P(i,R*s.v[k]/100);i?x.lineTo(p,q):x.moveTo(p,q)});x.closePath();x.strokeStyle=s.c;x.lineWidth=2.5;x.stroke();x.fillStyle=s.c.replace(')',',.18)').replace('rgba(255,255,255,.55,.18)','rgba(255,255,255,.08)').replace('#d9ff4a,.18)','rgba(217,255,74,.2)');x.globalAlpha=.25;x.fill();x.globalAlpha=1})}

function sampAt(t){const r=S.race,s=r.samp,dt=AB_DT*2;if(t<=0)return{x:r.ents.map(()=>0),v:r.ents.map(()=>0),sp:r.ents.map(()=>1),en:r.ents.map(()=>1),fat:r.ents.map(()=>0),st:r.ents.map(()=>'START')};
  const i=Math.min(s.length-1,Math.floor(t/dt)-1),j=Math.min(s.length-1,i+1),a=s[Math.max(0,i)],b=s[j],f=Math.max(0,Math.min(1,(t-a.t)/dt));

/* 上から見た競技場：楕円トラックを周回。外側にスタンドと照明 */
function trackXY(d,W,H,lane){const L=84.39,R0=36.5+lane*1.4,per=2*L+2*Math.PI*R0;let s=(((d%400)/400)*per+L)%per;const sc=Math.min(W*.86/(L+2*(36.5+9.8)),(H*.62)/(2*(36.5+9.8))),cx=W/2,cy=H*.56;
  let x,y;if(s<L){x=-L/2+s;y=R0}else if((s-=L)<Math.PI*R0){const a=s/R0;x=L/2+Math.sin(a)*R0;y=Math.cos(a)*R0}else if((s-=Math.PI*R0)<L){x=L/2-s;y=-R0}else{s-=L;const a=s/R0;x=-L/2-Math.sin(a)*R0;y=-Math.cos(a)*R0}
  return[cx+x*sc,cy+y*sc,sc]}
function draw(T){const cv=$('rcv'),dpr=Math.min(2,devicePixelRatio||1),W=cv.clientWidth,H=cv.clientHeight;if(cv.width!==W*dpr){cv.width=W*dpr;cv.height=H*dpr}const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);

  // スタンド（観客の点）

  ring(36.5+10.5,'#a3473b');ring(36.5,'#28543a');for(let k=0;k<=8;k++)ring(36.5+k*1.22,null,'rgba(242,238,230,.55)',.7);
  x.strokeStyle='#fff';x.lineWidth=2.5;x.beginPath();x.moveTo(cx+L/2*sc,cy+36.5*sc);x.lineTo(cx+L/2*sc,cy+46.3*sc);x.stroke();// フィニッシュ（直線の終わり）

  const s=sampAt(T),r=S.race,D=r.D,start=(400-D%400)%400;r.ents.forEach((e,i)=>{const d=start+s.x[i];const[px,py]=trackXY(d+1e-6,W,H,1+i*1.5);const R=Math.max(13,sc*2.6);

    x.font=Math.round(R*1.15)+'px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(e.me?'🏃':e.a.display.emoji,px,py+1);

const STJ=AB_STATE_JA,HOT={SPRINTING:1,FINAL_SPURT:1,REACCELERATING:1,ACCELERATING:1},BAD={FATIGUED:1,UNMOTIVATED:1,DECELERATING:1,DNF:1,TIMEUP:1},STOP={RESTING:1,OBSERVING:1,ALERT:1};
function hud(T){const r=S.race,s=sampAt(T),ord=r.ents.map((e,i)=>({e,i,x:s.x[i],f:e.fin!=null&&T>=e.fin?e.fin:1e9})).sort((a,b)=>a.f-b.f||b.x-a.x),lead=ord[0].x;

/* ---------- 実況：シミュレーションで実際に起きたことだけから作る（優先度・クールダウン・重複なし） ---------- */
function buildComm(r){const L=[],N=r.ents.map(e=>e.name),s=r.samp,dt=AB_DT*2;const prevTop=r.ents.map(()=>0),spdMark=r.ents.map(()=>0);let prevOrd=null,lastGap=null;
  const add=(t,p,txt,key)=>L.push({t,p,txt,key});
  r.ents.forEach((e,i)=>e.ev.forEach(v=>{const n=N[i];if(v.k==='stop')add(v.t,3,v.s==='OBSERVING'?n+'が立ち止まり、周囲を観察しています。':n+'が警戒して止まった！','stop'+i);
    if(v.k==='rest')add(v.t,4,n+'が休息に入った！ ここで止まる！','rest'+i);if(v.k==='go')add(v.t,2,n+'が再び走り出した！','go'+i);if(v.k==='dash')add(v.t,4,n+'が突然のダッシュ！','dash'+i);
    if(v.k==='spurt')add(v.t,3,n+'がラストスパート！','sp'+i);if(v.k==='reacc')add(v.t,3,n+'、最後の力で再加速！','ra'+i);if(v.k==='fin')add(v.t,6,n+'がゴール！ '+fmt(v.t),'fin'+i);if(v.k==='dnf')add(v.t,6,n+'、走るのをやめてしまった…','dnf'+i)}));
  for(let k=0;k<s.length;k++){const a=s[k];
    a.v.forEach((v,i)=>{const kh=v*3.6;for(const m of[30,40,50,60,70,80,90,100])if(kh>=m&&spdMark[i]<m&&m>=Math.min(60,r.ents[i].a.display.maxSpeedKmh*.75)){spdMark[i]=m;add(a.t,m>=80?5:2,N[i]+'が時速'+m+'kmを突破！','spd'+i)}
      if(k>=10){const b=s[k-10].v[i];if(b>4&&v<b*.7&&a.st[i]!=='RESTING')add(a.t,3,N[i]+'が大きく減速！','dec'+i)}});
    const ord=a.x.map((x,i)=>[x,i]).sort((p,q)=>q[0]-p[0]).map(z=>z[1]);
    if(prevOrd&&ord[0]!==prevOrd[0]&&a.t>3){const lost=prevOrd[0];add(a.t,5,N[ord[0]]+'が'+N[lost]+'をかわして先頭に！','lead')}
    else if(prevOrd&&ord.join()!==prevOrd.join()&&a.t>3){for(let p=1;p<ord.length;p++)if(ord[p]!==prevOrd[p]&&prevOrd.indexOf(ord[p])>p){add(a.t,2,N[ord[p]]+'がじわじわと順位を上げてきました！','up'+ord[p]);break}}
    if(ord.length>1&&k%5===0){const gap=a.x[ord[0]]-a.x[ord[1]],rem=r.D-a.x[ord[0]];if(lastGap!=null&&lastGap-gap>4&&gap<40&&rem>0)add(a.t,3,'先頭との差は'+gap.toFixed(0)+'m！ '+N[ord[1]]+'が差を詰めています！','gap');lastGap=gap}
    if(k===Math.round(3/dt)){add(a.t,3,N[ord[0]]+'が'+(a.v[ord[0]]*3.6>60?'圧倒的なスピードで':'')+'飛び出した！','start')}
    if(k%Math.round(30/dt)===0&&k>0){const st=a.st;st.forEach((x,i)=>{if(x==='CRUISING'&&r.ents[i].a.abilities.stability>=85)add(a.t,1,N[i]+'は安定したペースを維持しています。','cr'+i)})}
    prevOrd=ord}
  return L.sort((p,q)=>p.t-q.t)}
function comm(T){const L=RP.comm;let best=null;while(RP.ci<L.length&&L[RP.ci].t<=T){const c=L[RP.ci++];if(c.t<T-3*Math.max(1,RP.spd/4)&&c.p<6)continue;if(!best||c.p>=best.p)best=c}
  if(!best)return;const gap=T-RP.lastAt;if(best.txt===RP.lastTxt)return;if(gap<2.2/Math.max(1,RP.spd/4)&&best.p<5)return;if(RP.lastKey===best.key&&gap<8)return;
  RP.lastTxt=best.txt;RP.lastKey=best.key;RP.lastAt=T;const el=$('tk');el.textContent=best.txt;el.classList.remove('new');void el.offsetWidth;el.classList.add('new')}
function endRace(){if(!RP||RP.done)return;RP.done=true;$('race').classList.remove('on');$('fin').classList.remove('on');result()}
/* ---------- 結果と分析 ---------- */
function result(){const r=S.race,D=r.D,ST=r.ents.map(e=>({e,...abStats(e,D)})),win=r.winner,pr=S.pred;
  let pv='';if(pr){const ok=win&&win.id===pr&&!r.tie;PRED.n++;if(ok){PRED.ok++;PRED.streak++;PRED.best=Math.max(PRED.best,PRED.streak)}else PRED.streak=0;savePred();
    pv='<div class="pred '+(ok?'ok':'ng')+'">'+(ok?'予想的中！':'予想ハズレ')+'<small>予想：'+esc(r.ents.find(e=>e.id===pr).name)+'　正解率 '+Math.round(PRED.ok/PRED.n*100)+'%（'+PRED.ok+'/'+PRED.n+'）連続 '+PRED.streak+'</small></div>'}
  const rows=r.order.map((e,k)=>{const s=ST.find(z=>z.e===e);return'<div class="br"><i>'+(win?k+1:'参'+(k+1))+'</i><span class="ic">'+(e.me?'🏃':e.a.display.emoji)+'</span><b>'+esc(e.name)+'<small>'+(e.fin!=null?'平均 '+(s.avg*3.6).toFixed(1)+' km/h':e.dnf.why==='abandon'?'走行放棄':'時間切れ')+'</small></b>'+(e.fin!=null?'<em>'+fmt(e.fin)+'</em>':'<em class="dnf">'+Math.round(e.dnf.x)+'m<br>'+fmt(e.dnf.t)+'</em>')+'</div>'}).join('');
  const th='<tr><th></th>'+r.order.map(e=>'<th>'+(e.me?'🏃':e.a.display.emoji)+' '+esc(e.name)+'</th>').join('')+'</tr>',S2=e=>ST.find(z=>z.e===e);
  const tr=(lab,f)=>'<tr><td>'+lab+'</td>'+r.order.map(e=>'<td>'+f(S2(e),e)+'</td>').join('')+'</tr>';
  const laps=[];const nl=Math.ceil(D/400);for(let k=0;k<nl;k++)laps.push(k);
  const lapRows=laps.map(k=>tr(k<nl-1||D%400===0?((k+1)*400)+'m':D+'m（最後の'+(D-(nl-1)*400)+'m）',(s,e)=>{const tt=[0,...e.laps];const end=k<e.laps.length?e.laps[k]:(k===nl-1&&e.fin!=null?e.fin:null);return end==null||tt[k]==null?'—':(end-tt[k]).toFixed(1)})).join('');
  $('sec').innerHTML='<div class="board"><div class="bh"><b>RESULT</b><span>'+D+'m</span></div>'+rows+(win?'':'<div class="note">全員が時間内にゴールできなかったため、正式な勝者はなし。到達距離による参考順位です。</div>')+'</div>'+pv+
   '<div class="why">'+analysis(r,ST)+'</div>'+
   '<div class="h3">RACE DATA</div><table class="tbl">'+th+
   tr('ゴールタイム',(s,e)=>e.fin!=null?'<b>'+fmt(e.fin)+'</b>':'未完走 '+Math.round(e.dnf.x)+'m')+
   tr('カードのMAX SPEED',(s,e)=>e.me?'—':e.a.display.maxSpeedKmh+' km/h')+tr('レース中の最高速度',s=>(s.top*3.6).toFixed(1)+' km/h')+
   tr('平均速度',s=>(s.avg*3.6).toFixed(1)+' km/h')+tr('移動中の平均速度',s=>(s.avgMove*3.6).toFixed(1)+' km/h')+tr('停止回数',s=>s.stopN+'回')+tr('合計停止時間',s=>s.stopT.toFixed(1)+'秒')+tr('移動継続率',s=>s.cont.toFixed(0)+'%')+'</table>'+
   '<div class="h3">LAP（400mごと・秒）</div><table class="tbl">'+th+lapRows+'</table>'+
   '<div class="h3">SPEED（km/h）</div><canvas class="chart" id="c1"></canvas><div class="h3">STAMINA（残存体力）</div><canvas class="chart" id="c2"></canvas><div class="h3">POSITION（順位）</div><canvas class="chart" id="c3"></canvas>'+
   '<div class="lg">'+r.ents.map(e=>'<span style="--c:'+e.col+'">'+esc(e.name)+'</span>').join('')+'</div>'+
   '<div class="learn">'+learn(r,ST)+'</div><div class="note">最高速度は参考値・ゲーム設定値を含みます。疲労・回復・停止はゲーム内のモデルで、動物の生理学的な実測値ではありません。動物のモデルをそのまま人のトレーニングに当てはめることはできません。</div>'+
   '<div class="btns"><button class="go" id="again">もう一度</button><button class="ghost" id="cd">距離を変える</button></div><button class="ghost" id="re">出場者を選び直す</button>';
  S.step=2;rail();scrollTo(0,0);
  charts(r);$('again').onclick=()=>{S.seed=null;S.pred=null;go(2)};$('cd').onclick=()=>{S.seed=null;go(0)};$('re').onclick=()=>go(1)}
function analysis(r,ST){const o=r.order,w=o[0],S=e=>ST.find(z=>z.e===e),out=[];if(o.length<2)return'';
  const W=S(w),fast=ST.slice().sort((a,b)=>b.top-a.top)[0];const name=e=>'<b>'+esc(e.name)+'</b>';
  if(!r.winner){out.push('どの出場者も制限時間内にゴールできませんでした。いちばん遠くまで進んだのは'+name(w)+'（'+Math.round(w.dnf.x)+'m）です。');}
  else{const L=o[1],Ls=S(L);
    if(fast.e!==w)out.push(name(fast.e)+'は最高速度 '+(fast.top*3.6).toFixed(0)+'km/h で'+name(w)+'（'+(W.top*3.6).toFixed(0)+'km/h）を上回りましたが、'+(fast.stopT>W.stopT+2?'合計'+fast.stopT.toFixed(0)+'秒の停止':'後半の失速')+'が響き、勝ったのは'+name(w)+'でした。');
    else out.push(name(w)+'は最高速度でも'+name(L)+'を上回り、そのまま押し切りました。');
    if(W.stopT<1&&Ls.stopT>3)out.push(name(w)+'は一度も止まらずに走り続け（移動継続率 '+W.cont.toFixed(0)+'%）、'+name(L)+'は'+Ls.stopN+'回・合計'+Ls.stopT.toFixed(0)+'秒止まりました。');
    else if(W.avgMove<Ls.avgMove&&W.stopT<Ls.stopT)out.push('動いている間の平均速度は'+name(L)+'の方が速かった（'+(Ls.avgMove*3.6).toFixed(1)+' vs '+(W.avgMove*3.6).toFixed(1)+'km/h）のに、停止時間の差で逆転されました。');
    const lead10=r.samp.find(s=>s.t>=10);if(lead10){const li=lead10.x.indexOf(Math.max(...lead10.x)),le=r.ents[li];if(le!==w)out.push('10秒の時点では'+name(le)+'が先頭でしたが、'+name(w)+'が'+(w.a.behavior.policy==='pacer'||w.me?'ペースを保って':'')+'逆転しました。')}
    if(L.fin!=null){const g=L.fin-w.fin;out.push('タイム差は '+g.toFixed(2)+'秒'+(g<1?'。わずかな差の決着でした。':'。'))}
    o.forEach(e=>{if(e.dnf&&e.dnf.why==='abandon')out.push(name(e)+'は走る気をなくして走行放棄となりました。')})}
  return out.join('')}
function learn(r,ST){const f=ST.slice().sort((a,b)=>b.top-a.top)[0],w=r.winner;const L=[];
  if(w&&f.e!==w)L.push('💡 最高速度がいちばん速くても、勝つとは限りません。続けられる速さ（巡航速度）と、止まらずに走り続けることが大切です。');
  if(ST.some(s=>s.stopT>5))L.push('💡 止まっている時間はそのままタイムのロスになります。');
  if(ST.some(s=>s.e.a.behavior.policy==='burst'&&s.stopN>0))L.push('💡 序盤に全力を出しすぎると、後半に大きく失速することがあります。');
  if(!L.length)L.push('💡 同じ対戦でも、距離や本日の調子で展開は変わります。距離を変えて再戦してみよう。');return L.join('<br>')}
function charts(r){const s=r.samp,T=s.length?s[s.length-1].t:1;const ch=(id,f,ymax,inv)=>{const cv=$(id),W=cv.clientWidth,H=cv.clientHeight,d=Math.min(2,devicePixelRatio||1);cv.width=W*d;cv.height=H*d;const x=cv.getContext('2d');x.scale(d,d);
    x.strokeStyle='rgba(255,255,255,.08)';x.fillStyle='#7d8797';x.font='10px sans-serif';for(let g=0;g<=4;g++){const y=8+(H-22)*g/4;x.beginPath();x.moveTo(28,y);x.lineTo(W-4,y);x.stroke();if(!inv)x.fillText(Math.round(ymax*(1-g/4)),2,y+3)}
    x.fillText('0',28,H-2);x.fillText(fmt(T).replace(/\.\d+$/,''),W-40,H-2);
    r.ents.forEach((e,i)=>{x.beginPath();x.strokeStyle=e.col;x.lineWidth=2;const step=Math.max(1,Math.floor(s.length/400));for(let k=0;k<s.length;k+=step){const v=f(s[k],i),px=28+(W-32)*s[k].t/T,py=8+(H-22)*(inv?(v-1)/Math.max(1,r.ents.length-1):1-v/ymax);k?x.lineTo(px,py):x.moveTo(px,py)}x.stroke()})};
  const vm=Math.max(10,...s.map(a=>Math.max(...a.v)*3.6));ch('c1',(a,i)=>a.v[i]*3.6,Math.ceil(vm/10)*10);ch('c2',(a,i)=>(a.sp[i]*.35+a.en[i]*.4+(1-a.fat[i])*.25)*100,100);
  ch('c3',(a,i)=>1+a.x.filter(v=>v>a.x[i]).length,1,true)}
go(0);
</script></body></html>
